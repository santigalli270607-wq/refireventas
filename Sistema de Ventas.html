    bGaleria.addEventListener('click', function () { inpGaleria.click(); });

    botones.appendChild(bCamara);
    botones.appendChild(bGaleria);
    botones.appendChild(inpCamara);
    botones.appendChild(inpGaleria);
    caja.appendChild(botones);

    /* ── Zona para arrastrar (en la computadora) ── */
    var zona = U.el('div', { class: 'zona-pdf', style: 'margin-bottom:14px' }, [
      U.el('div', { class: 'ico', text: '🖼' }),
      U.el('div', { html: '<strong>Arrastrá las fotos acá</strong>' }),
      U.el('div', { class: 'txt-chico', style: 'margin-top:4px',
        text: 'O usá los botones de arriba. Desde el celular se puede sacar la foto en el momento.' })
    ]);
    zona.addEventListener('click', function () { inpGaleria.click(); });
    ['dragenter', 'dragover'].forEach(function (ev) {
      zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.add('sobre'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.remove('sobre'); });
    });
    zona.addEventListener('drop', function (e) {
      if (e.dataTransfer.files) tomar(e.dataTransfer.files);
    });
    caja.appendChild(zona);

    /* ── Grilla ── */
    var estado = U.el('div', { class: 'txt-chico', style: 'margin-bottom:8px' });
    var grilla = U.el('div', { class: 'fotos-grilla' });
    caja.appendChild(estado);
    caja.appendChild(grilla);

    inpCamara.addEventListener('change', function () { tomar(inpCamara.files); inpCamara.value = ''; });
    inpGaleria.addEventListener('change', function () { tomar(inpGaleria.files); inpGaleria.value = ''; });

    function tomar(lista) {
      var archivos = Array.prototype.slice.call(lista || []).filter(function (f) {
        return /^image\//.test(f.type);
      });
      if (!archivos.length) return;

      var hechas = 0;
      estado.textContent = 'Preparando ' + archivos.length + ' foto' + (archivos.length === 1 ? '' : 's') + '…';

      // De a una, para no saturar la memoria con fotos grandes de celular.
      var cadena = Promise.resolve();
      archivos.forEach(function (f) {
        cadena = cadena.then(function () {
          return U.comprimirImagen(f)
            .then(function (chica) { return Store.guardarArchivo(chica); })
            .then(function (id) {
              ids.push(id);
              agregadasAca.push(id);
              hechas++;
              estado.textContent = 'Preparando… ' + hechas + ' de ' + archivos.length;
              pintar();
            });
        });
      });

      cadena.then(function () {
        estado.textContent = '';
        U.toast(archivos.length === 1 ? 'Foto agregada.' : archivos.length + ' fotos agregadas.', 'ok');
      }).catch(function (e) {
        estado.textContent = '';
        U.toast('No se pudieron guardar las fotos: ' + e.message, 'error');
      });
    }

    function pintar() {
      grilla.innerHTML = '';
      if (!ids.length) {
        grilla.appendChild(U.el('div', { class: 'txt-chico', text: 'Todavía no hay fotos cargadas.' }));
        return;
      }
      ids.forEach(function (id) {
        var celda = U.el('div', { class: 'foto' });
        grilla.appendChild(celda);

        Store.urlArchivo(id).then(function (a) {
          if (!a) { celda.remove(); return; }
          var img = U.el('img', { src: a.url, alt: a.nombre || 'Foto' });
          celda.appendChild(img);
          celda.appendChild(U.el('div', { class: 'pie', text: U.bytes(a.tamano) }));
          celda.addEventListener('click', function () { App.abrirFoto(id); });

          var x = U.el('button', { class: 'quitar', type: 'button', text: '×', title: 'Quitar foto' });
          x.addEventListener('click', function (ev) {
            ev.stopPropagation();
            ids = ids.filter(function (i) { return i !== id; });
            Store.del('archivos', id);
            pintar();
          });
          celda.appendChild(x);
        });
      });
    }

    pintar();

    return {
      el: caja,
      ids: function () { return ids.slice(); },
      /** Borra las fotos subidas en esta pasada (si se cancela el formulario). */
      descartarNuevas: function () {
        agregadasAca.forEach(function (id) { Store.del('archivos', id); });
        agregadasAca = [];
      },
      /** Marca las fotos como confirmadas: ya no se descartan al cancelar. */
      confirmar: function () { agregadasAca = []; }
    };
  };

  /** Grilla de solo lectura, para las fichas de detalle. */
  Fotos.grilla = function (ids) {
    var g = U.el('div', { class: 'fotos-grilla' });
    if (!ids || !ids.length) {
      return U.el('div', { class: 'txt-chico', text: 'Sin fotos.' });
    }
    ids.forEach(function (id) {
      var celda = U.el('div', { class: 'foto' });
      g.appendChild(celda);
      Store.urlArchivo(id).then(function (a) {
        if (!a) { celda.remove(); return; }
        celda.appendChild(U.el('img', { src: a.url, alt: a.nombre || 'Foto' }));
        celda.addEventListener('click', function () { App.abrirFoto(id); });
      });
    });
    return g;
  };

  global.Fotos = Fotos;
})(window);

/* ───────── app/js/vistas/consultas.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/consultas.js — listado general de ventas
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};
  var C = global.Comunes;

  /* Estado de la vista (se conserva mientras dura la sesión). */
  var f = {
    texto: '', vendedor: '', estado: '', estadoPago: '', equipo: '', desde: '', hasta: '',
    incluirPendientes: false,
    orden: null, dir: 1,
    pagina: 1, porPagina: 100
  };

  /* Prioridad de estados para el orden por defecto: primero lo que está en curso. */
  var PESO = {
    'En fábrica': 0, 'En pintura': 1, 'Autorizada': 2, 'Terminada': 3,
    'Entregada': 4, 'Facturada': 5, 'Pendiente de autorización': 6,
    'Cancelada': 7, 'Rechazada': 8, 'Histórica': 9
  };

  var COLUMNAS = [
    { clave: 'fecha',          rot: 'Fecha',              ancho: '96px' },
    { clave: 'clienteNombre',  rot: 'Cliente' },
    { clave: 'equipoNombre',   rot: 'Equipo' },
    { clave: 'nroSerie',       rot: 'Nro. de serie',      ancho: '130px' },
    { clave: 'montadoSobre',   rot: 'Vehículo',           ancho: '165px' },
    { clave: 'vendedorNombre', rot: 'Vendedor',           ancho: '140px' },
    { clave: 'estado',         rot: 'Proceso',            ancho: '225px' },
    { clave: 'estadoPago',     rot: 'Estado de pago',     ancho: '200px' },
    { clave: 'fechaPrometida', rot: 'Entrega estipulada', ancho: '120px' },
    { clave: 'garantiaOrden',  rot: 'Garantía',           ancho: '110px' },
    { clave: 'observaciones',  rot: 'Observaciones',      ancho: '230px' }
  ];

  /* ═══════════════ Filtrado ═══════════════ */

  function filtrar() {
    var base = f.incluirPendientes ? App.cache.ventas.slice() : App.ventasVisibles();
    var t = U.norm(f.texto);

    var res = base.filter(function (v) {
      if (f.vendedor && v.vendedorNombre !== f.vendedor) return false;
      if (f.estado && v.estado !== f.estado) return false;
      if (f.estadoPago && (v.estadoPago || '') !== f.estadoPago) return false;
      if (f.equipo && v.equipoNombre !== f.equipo) return false;
      if (f.desde && (v.fecha || '') < f.desde) return false;
      if (f.hasta && (v.fecha || '') > f.hasta) return false;
      if (t) {
        var bolsa = v._busqueda;
        if (!bolsa) {
          bolsa = U.norm([v.nroSerie, v.clienteNombre, v.clienteCuit, v.equipoNombre,
            v.vendedorNombre, v.montadoSobre, v.color, v.estado, v.nro,
            v.nroFactura, v.nroRemito].join(' '));
          v._busqueda = bolsa;
        }
        if (bolsa.indexOf(t) === -1) return false;
      }
      return true;
    });

    if (f.orden === 'garantiaOrden') {
      // Se ordena por días restantes; lo que no tiene garantía cargada, al final.
      res.sort(function (a, b) {
        var ga = U.garantia(a.fechaEntrega, a.garantiaDias);
        var gb = U.garantia(b.fechaEntrega, b.garantiaDias);
        var va = ga ? ga.restantes : (f.dir === 1 ? Infinity : -Infinity);
        var vb = gb ? gb.restantes : (f.dir === 1 ? Infinity : -Infinity);
        return (va - vb) * f.dir;
      });
    } else if (f.orden) {
      res = U.ordenarPor(res, f.orden, f.dir);
    } else {
      // Por defecto: lo que está en fábrica arriba, y dentro de cada
      // estado lo más nuevo primero.
      res.sort(function (a, b) {
        var pa = PESO[a.estado] !== undefined ? PESO[a.estado] : 6;
        var pb = PESO[b.estado] !== undefined ? PESO[b.estado] : 6;
        if (pa !== pb) return pa - pb;
        return String(b.fecha || '').localeCompare(String(a.fecha || ''));
      });
    }
    return res;
  }

  /* ═══════════════ Render ═══════════════ */

  Vistas.consultas = {
    titulo: 'Consultas',
    sub: function () {
      return U.miles(App.cache.ventas.length) + ' ventas registradas en el sistema';
    },

    render: function (cont, acciones) {
      var bNueva = U.el('button', { class: 'btn btn-accion', text: '+ Nueva venta' });
      bNueva.addEventListener('click', function () { App.ir('venta'); });
      acciones.appendChild(bNueva);

      var bExp = U.el('button', { class: 'btn btn-borde', text: 'Exportar a Excel' });
      bExp.addEventListener('click', exportar);
      acciones.appendChild(bExp);

      var panelFiltros = U.el('div', { class: 'panel' });
      var cuerpoFiltros = U.el('div', { class: 'panel-cuerpo' });
      cuerpoFiltros.appendChild(construirFiltros());
      panelFiltros.appendChild(cuerpoFiltros);
      cont.appendChild(panelFiltros);

      var panelTabla = U.el('div', { class: 'panel' });
      panelTabla.id = 'panel-tabla';
      cont.appendChild(panelTabla);
      pintarTabla(panelTabla);
    }
  };

  function construirFiltros() {
    var caja = U.el('div');
    var fila = U.el('div', { class: 'filtros' });

    var buscar = U.el('label', { class: 'campo' }, [U.el('span', { text: 'Buscar' })]);
    var wrapBuscar = U.el('div', { class: 'barra-buscar' });
    var inpBuscar = U.el('input', { type: 'text', placeholder: 'Serie, cliente, factura…', value: f.texto });
    inpBuscar.addEventListener('input', U.debounce(function () {
      f.texto = inpBuscar.value; f.pagina = 1; repintar();
    }, 220));
    wrapBuscar.appendChild(inpBuscar);
    buscar.appendChild(wrapBuscar);
    fila.appendChild(buscar);

    var vendedores = {};
    App.cache.ventas.forEach(function (v) { if (v.vendedorNombre) vendedores[v.vendedorNombre] = 1; });
    fila.appendChild(selectFiltro('Vendedor', Object.keys(vendedores).sort(), f.vendedor, function (val) {
      f.vendedor = val; f.pagina = 1; repintar();
    }));

    fila.appendChild(selectFiltro('Proceso',
      Datos.listaEstados().map(function (e) { return e.nombre; }), f.estado, function (val) {
        f.estado = val; f.pagina = 1; repintar();
      }));

    fila.appendChild(selectFiltro('Estado de pago',
      Datos.listaEstadosPago().map(function (e) { return e.nombre; }), f.estadoPago, function (val) {
        f.estadoPago = val; f.pagina = 1; repintar();
      }));

    var equipos = {};
    App.cache.ventas.forEach(function (v) { if (v.equipoNombre) equipos[v.equipoNombre] = 1; });
    fila.appendChild(selectFiltro('Equipo', Object.keys(equipos).sort(), f.equipo, function (val) {
      f.equipo = val; f.pagina = 1; repintar();
    }));

    fila.appendChild(campoFecha('Desde', f.desde, function (val) { f.desde = val; f.pagina = 1; repintar(); }));
    fila.appendChild(campoFecha('Hasta', f.hasta, function (val) { f.hasta = val; f.pagina = 1; repintar(); }));

    caja.appendChild(fila);

    var opciones = U.el('div', { class: 'fila-flex', style: 'margin-top:14px' });

    var chkPend = U.el('input', { type: 'checkbox' });
    chkPend.checked = f.incluirPendientes;
    chkPend.addEventListener('change', function () {
      f.incluirPendientes = chkPend.checked; f.pagina = 1; repintar();
    });
    opciones.appendChild(U.el('label', { class: 'check' }, [chkPend,
      U.el('span', { text: 'Incluir ventas pendientes de autorización' })]));

    var bLimpiar = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Limpiar filtros' });
    bLimpiar.addEventListener('click', function () {
      f.texto = ''; f.vendedor = ''; f.estado = ''; f.estadoPago = ''; f.equipo = '';
      f.desde = ''; f.hasta = ''; f.incluirPendientes = false; f.pagina = 1;
      App.refrescar();
    });
    opciones.appendChild(bLimpiar);

    caja.appendChild(opciones);
    return caja;
  }

  function selectFiltro(rot, opciones, valor, alCambiar) {
    var lab = U.el('label', { class: 'campo' }, [U.el('span', { text: rot })]);
    var sel = U.el('select');
    sel.appendChild(U.el('option', { value: '', text: 'Todos' }));
    opciones.forEach(function (o) {
      var op = U.el('option', { value: o, text: o });
      if (o === valor) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', function () { alCambiar(sel.value); });
    lab.appendChild(sel);
    return lab;
  }

  function campoFecha(rot, valor, alCambiar) {
    var lab = U.el('label', { class: 'campo' }, [U.el('span', { text: rot })]);
    var inp = U.el('input', { type: 'date', value: valor || '' });
    inp.addEventListener('change', function () { alCambiar(inp.value); });
    lab.appendChild(inp);
    return lab;
  }

  function repintar() {
    var p = document.getElementById('panel-tabla');
    if (p) pintarTabla(p);
    document.getElementById('subtitulo-vista').textContent = Vistas.consultas.sub();
  }

  /* ═══════════════ Tabla ═══════════════ */

  function pintarTabla(panel) {
    panel.innerHTML = '';
    var todas = filtrar();

    var totalPag = Math.max(1, Math.ceil(todas.length / f.porPagina));
    if (f.pagina > totalPag) f.pagina = totalPag;
    var ini = (f.pagina - 1) * f.porPagina;
    var pagina = todas.slice(ini, ini + f.porPagina);

    panel.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Ventas' }),
        U.el('p', { class: 'sub', text: U.miles(todas.length) + ' resultado' + (todas.length === 1 ? '' : 's') })
      ])
    ]));

    if (!todas.length) {
      panel.appendChild(U.el('div', { class: 'vacio' }, [
        U.el('div', { class: 'grande', text: '☰' }),
        U.el('div', { text: App.cache.ventas.length
          ? 'Ninguna venta coincide con los filtros elegidos.'
          : 'Todavía no hay ventas cargadas. Podés importar el historial desde Administración → Importar Excel.' })
      ]));

    }

    var scroll = U.el('div', { class: 'tabla-scroll' });

    var trh = U.el('tr');
    COLUMNAS.forEach(function (c) {
      var flecha = f.orden === c.clave ? (f.dir === 1 ? ' ▲' : ' ▼') : '';
      var th = U.el('th', {
        class: 'ord',

      });
      th.addEventListener('click', function () {
        if (f.orden === c.clave) f.dir = f.dir === 1 ? -1 : 1;
        else { f.orden = c.clave; f.dir = 1; }
        repintar();
      });
      trh.appendChild(th);
    });
    tabla.appendChild(U.el('thead', {}, [trh]));

    var tbody = U.el('tbody');
    pagina.forEach(function (v) { tbody.appendChild(filaVenta(v)); });
    tabla.appendChild(tbody);
    scroll.appendChild(tabla);
    panel.appendChild(scroll);

  function filaVenta(v) {
    var tr = U.el('tr', { class: 'clickable fila-' + Datos.colorEstado(v.estado) });

      class: 'txt-chico celda-obs',

    }, [U.el('span', { text: obs || '—' })]));

    tr.addEventListener('click', function () { App.ir('venta', { editar: v }); });
    return tr;
  }

  /** Celda de estado: desplegable para Gerencia, etiqueta fija para el resto. */
  function celdaEstado(v, campo, lista, alCambiar) {
    var td = U.el('td');
    var actual = v[campo] || '';

    if (!Auth.puede('cambiarEstado')) {
      td.innerHTML = campo === 'estado' ? Datos.pillEstado(actual) : Datos.pillEstadoPago(actual);
      return td;
    }

    var sel = U.el('select', { class: 'sel-estado' });
    sel.appendChild(U.el('option', { value: '', text: '— sin definir —' }));
    lista.forEach(function (e) {
      var op = U.el('option', { value: e.nombre, text: e.nombre });
      if (e.nombre === actual) op.selected = true;
      sel.appendChild(op);
    });

    function pintarColor() {
      var color = campo === 'estado'
        ? Datos.colorEstado(sel.value)
        : Datos.colorEstadoPago(sel.value);
      sel.className = 'sel-estado ' + (sel.value ? 'pill-' + color : '');
    }
    pintarColor();

    sel.addEventListener('click', function (ev) { ev.stopPropagation(); });
    sel.addEventListener('change', function (ev) {
      ev.stopPropagation();
      var anterior = v[campo] || '';
      v[campo] = sel.value;
      App.anotar(v, campo === 'estado' ? 'Cambio de estado' : 'Cambio de estado de pago',
        (anterior || 'sin definir') + ' → ' + (sel.value || 'sin definir'));
      v.actualizadoEn = new Date().toISOString();
      delete v._busqueda;

      Store.put('ventas', v).then(function () {
        pintarColor();
        if (alCambiar) alCambiar(sel.value);
        U.toast('Actualizado: ' + (sel.value || 'sin definir'), 'ok');
      }).catch(function (e) {
        v[campo] = anterior;
        sel.value = anterior;
        pintarColor();
        U.toast('No se pudo guardar el cambio: ' + e.message, 'error');
      });
    });

    td.appendChild(sel);
    return td;
  }

  function paginador(total, totalPag) {
    var cont = U.el('div', { class: 'paginacion' });

    var desde = (f.pagina - 1) * f.porPagina + 1;
    var hasta = Math.min(total, f.pagina * f.porPagina);
    cont.appendChild(U.el('div', { class: 'info',
      text: 'Mostrando ' + U.miles(desde) + '–' + U.miles(hasta) + ' de ' + U.miles(total) }));

    var ctrl = U.el('div', { class: 'ctrl' });

    var selTam = U.el('select');
    [50, 100, 200, 500].forEach(function (n) {
      var op = U.el('option', { value: n, text: n + ' por página' });
      if (n === f.porPagina) op.selected = true;
      selTam.appendChild(op);
    });
    selTam.addEventListener('change', function () {
      f.porPagina = Number(selTam.value); f.pagina = 1; repintar();
    });
    ctrl.appendChild(selTam);

    function boton(txt, destino, activo) {
      var b = U.el('button', { class: 'btn btn-borde', text: txt });
      b.disabled = !activo;
      b.addEventListener('click', function () { f.pagina = destino; repintar(); });
      return b;
    }

    ctrl.appendChild(boton('« Primera', 1, f.pagina > 1));
    ctrl.appendChild(boton('‹ Anterior', f.pagina - 1, f.pagina > 1));
    ctrl.appendChild(U.el('span', { class: 'pag-num', text: 'Página ' + f.pagina + ' de ' + totalPag }));
    ctrl.appendChild(boton('Siguiente ›', f.pagina + 1, f.pagina < totalPag));
    ctrl.appendChild(boton('Última »', totalPag, f.pagina < totalPag));

    cont.appendChild(ctrl);
    return cont;
  }

  /* ═══════════════ Exportar ═══════════════ */

  function exportar() {
    var datos = filtrar();
    if (!datos.length) { U.toast('No hay nada para exportar con esos filtros.', 'aviso'); return; }
    var enc = ['Fecha', 'Cliente', 'CUIT', 'Equipo', 'Nro de serie', 'Vehículo',
      'Vendedor', 'Proceso', 'Estado de pago', 'Entrega estipulada', 'Observaciones',
      'Nro de factura', 'Nro de remito',
      'Fecha de entrega', 'Garantía (días)', 'Garantía vence', 'Días restantes',
      'Accionamiento', 'Color', 'Plataforma', 'Toma de fuerza', 'Dimensiones',
      'Ancho', 'Largo', 'Biela', 'Voltaje',
      'Forma de pago', 'Plazo (días)', 'Precio de venta', 'Precio acordado'];

    var filas = datos.map(function (v) {
      var g = U.garantia(v.fechaEntrega, v.garantiaDias);
      return [
        U.fecha(v.fecha), v.clienteNombre, U.cuitFmt(v.clienteCuit), v.equipoNombre,
        v.nroSerie, v.montadoSobre, v.vendedorNombre, v.estado, v.estadoPago,
        U.fecha(v.fechaPrometida), v.observaciones,
        v.nroFactura, v.nroRemito,
        U.fecha(v.fechaEntrega), v.garantiaDias,
        g ? U.fecha(g.vence) : '', g ? (g.vencida ? 'vencida' : g.restantes) : '',
        v.accionamiento, v.color, v.plataforma, v.tomaFuerza ? (v.tomaFuerzaNro || 'Sí') : 'No',
        v.dimensiones, v.ancho, v.largo, v.biela, v.voltaje,
        v.formaPago, v.plazoEntregaDias,
        v.precioVenta || '', v.precioAcordado || ''
      ];
    });
    U.descargar('ventas_' + U.hoyISO() + '.csv', U.aCSV(enc, filas), 'text/csv;charset=utf-8');
    U.toast('Se descargó el listado (' + U.miles(datos.length) + ' ventas).', 'ok');

      C.item('IVA', v.precioVenta ? (v.alicuotaIva + '%  —  ' + U.plata(v.precioVenta * v.alicuotaIva / 100, v.moneda)) : ''),
      C.item('Total con IVA', v.precioVenta ? U.plata(v.precioVenta * (1 + v.alicuotaIva / 100), v.moneda) : ''),
      C.item('Precio acordado', v.precioAcordado ? U.plata(v.precioAcordado, v.moneda) : '')

      C.item('Situación', g ? (g.vencida ? 'Vencida' : 'Le quedan ' + g.restantes + ' días') : 'Sin cargar')

    cuerpo.appendChild(bloqueReparaciones(v));

      cuerpo.appendChild(C.bloqueDetalle('Autorización', [

    if (v.historial && v.historial.length) {

        setTimeout(function () { formAdministracion(v); }, 120);

    U.modal({

      cuerpo: cuerpo,
      ancho: true,
      botones: botones
    });

        U.cerrarModal();

      });
      tb.appendChild(tr);

    return caja;

  /* ═══════════════ Cargar factura, remito, pago y garantía ═══════════════ */

  function formAdministracion(v) {
    var cuerpo = U.el('div');

    var inpFactura = C.inp({ type: 'text', value: v.nroFactura || '', placeholder: 'Ej: A 0001-00012345' });
    var adjFactura = C.adjuntoPDF(v.facturaId, 'Factura');

    var inpRemito = C.inp({ type: 'text', value: v.nroRemito || '', placeholder: 'Ej: 0001-00004567' });
    var adjRemito = C.adjuntoPDF(v.remitoId, 'Remito');

    var selPago = C.selEstado(Datos.listaEstadosPago(), v.estadoPago || '', '— sin definir —');
    var inpSerie = C.inp({ type: 'text', value: v.nroSerie || '' });

    var inpEntrega = C.inp({ type: 'date', value: v.fechaEntrega || '' });
    var inpGarantia = C.inp({ type: 'number', min: '0', step: '1',
      value: v.garantiaDias === '' || v.garantiaDias === undefined ? '' : v.garantiaDias,
      placeholder: String(Datos.GARANTIA_DIAS) });

    var avisoGarantia = U.el('div', { class: 'txt-chico' });
    function actualizarAviso() {
      var g = U.garantia(inpEntrega.value, inpGarantia.value);
      if (!g) { avisoGarantia.textContent = 'Cargá la fecha de entrega y los días para calcular el vencimiento.'; return; }
      avisoGarantia.textContent = g.vencida
        ? 'La garantía venció el ' + U.fecha(g.vence) + '.'
        : 'Vence el ' + U.fecha(g.vence) + ' — le quedan ' + g.restantes + ' días.';
    }
    inpEntrega.addEventListener('change', actualizarAviso);
    inpGarantia.addEventListener('input', actualizarAviso);

    var bUnAnio = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '1 año (365 días)' });
    bUnAnio.addEventListener('click', function () {
      inpGarantia.value = Datos.GARANTIA_DIAS;
      if (!inpEntrega.value) inpEntrega.value = U.hoyISO();
      actualizarAviso();
    });
    actualizarAviso();

    /* Factura */
    var s1 = U.el('div', { class: 'grid g2' });
    s1.appendChild(C.campo('Número de factura', inpFactura));
    s1.appendChild(C.campo('PDF de la factura', adjFactura.el));
    cuerpo.appendChild(C.seccion(null, 'Factura', s1));

    /* Remito */
    var s2 = U.el('div', { class: 'grid g2' });
    s2.appendChild(C.campo('Número de remito', inpRemito));
    s2.appendChild(C.campo('PDF del remito', adjRemito.el));
    cuerpo.appendChild(C.seccion(null, 'Remito', s2));

    /* Cobranza y entrega */
    var s3 = U.el('div', { class: 'grid g2' });
    s3.appendChild(C.campo('Estado de pago', selPago));
    s3.appendChild(C.campo('Nro. de serie', inpSerie, 'Se puede completar cuando fábrica lo asigna'));
    s3.appendChild(C.campo('Fecha de entrega', inpEntrega, 'Desde acá arranca la garantía'));
    s3.appendChild(U.el('div', { class: 'campo' }, [
      U.el('span', { text: 'Días de garantía' }),
      U.el('div', { style: 'display:flex;gap:8px;align-items:center' }, [inpGarantia, bUnAnio]),
      avisoGarantia
    ]));
    cuerpo.appendChild(C.seccion(null, 'Entrega, cobranza y garantía', s3));

    U.modal({
      titulo: 'Cargar datos — ' + (v.clienteNombre || ''),
      cuerpo: cuerpo,
      ancho: true,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde', accion: function () {
          adjFactura.descartarNuevo();
          adjRemito.descartarNuevo();
        } },
        { texto: 'Guardar', clase: 'btn-primario', accion: function () {
          var cambios = [];
          function anotarSi(rot, antes, ahora) {
            if (String(antes || '') !== String(ahora || '')) cambios.push(rot);
          }
          anotarSi('factura', v.nroFactura, inpFactura.value.trim());
          anotarSi('remito', v.nroRemito, inpRemito.value.trim());
          anotarSi('estado de pago', v.estadoPago, selPago.value);
          anotarSi('nro. de serie', v.nroSerie, inpSerie.value.trim());
          anotarSi('fecha de entrega', v.fechaEntrega, inpEntrega.value);
          anotarSi('garantía', v.garantiaDias, inpGarantia.value);

          v.nroFactura = inpFactura.value.trim();
          v.facturaId = adjFactura.id();
          v.nroRemito = inpRemito.value.trim();
          v.remitoId = adjRemito.id();
          v.estadoPago = selPago.value;
          v.nroSerie = inpSerie.value.trim();
          v.fechaEntrega = inpEntrega.value;
          v.garantiaDias = inpGarantia.value === '' ? '' : Number(inpGarantia.value);
          v.actualizadoEn = new Date().toISOString();
          delete v._busqueda;

          if (cambios.length) App.anotar(v, 'Datos administrativos', 'Se actualizó: ' + cambios.join(', '));

          Store.put('ventas', v).then(function () {
            adjFactura.confirmar();
            adjRemito.confirmar();
            U.toast('Datos guardados.', 'ok');
            App.refrescar();
          }).catch(function (e) {
            U.toast('No se pudo guardar: ' + e.message, 'error');
          });
        } }
      ]
    });
  }

  Vistas.formAdministracionVenta = formAdministracion;

})(window);

/* ───────── app/js/vistas/venta.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/venta.js — carga de una venta y de venta múltiple
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};

  /* ═══════════════ Ayudantes de formulario ═══════════════ */

  function campo(rot, control, ayuda) {
    var hijos = [U.el('span', { text: rot })];
    if (ayuda) hijos.push(U.el('span', { class: 'ayuda', text: ayuda }));
    hijos.push(control);
    return U.el('label', { class: 'campo' }, hijos);
  }

  function inp(attrs) { return U.el('input', attrs || { type: 'text' }); }

  function sel(opciones, valor, textoVacio) {
    var s = U.el('select');
    if (textoVacio !== null) s.appendChild(U.el('option', { value: '', text: textoVacio || '— elegir —' }));
    opciones.forEach(function (o) {
      var v = typeof o === 'string' ? o : o.valor;
      var t = typeof o === 'string' ? o : o.texto;
      var op = U.el('option', { value: v, text: t });
      if (v === valor) op.selected = true;
      s.appendChild(op);
    });
    return s;
  }

  function seccion(numero, titulo, cuerpo) {
    var s = U.el('div', { class: 'seccion' });
    s.appendChild(U.el('div', { class: 'seccion-cab' }, [
      U.el('span', { class: 'n', text: String(numero) }),
      U.el('span', { text: titulo })
    ]));
    s.appendChild(U.el('div', { class: 'seccion-cuerpo' }, [cuerpo]));
    return s;
  }

  function marcarError(control, hay) {
    var lab = control.closest ? control.closest('.campo') : null;
    if (lab) lab.classList.toggle('campo-error', !!hay);
  }

  /* ═══════════════ Bloque: datos de producción ═══════════════ */

  /**
   * Devuelve { el, leer(), validar() } para un bloque de producción.
   * Se usa una vez en la venta simple y N veces en la venta múltiple.
   */
  function bloqueProduccion(inicial, alCambiarPrecio) {
    inicial = inicial || {};
    var caja = U.el('div');

    /** Avisa al bloque de administración que cambió el precio de lista. */
    function avisarPrecio() { if (alCambiarPrecio) alCambiarPrecio(); }

    /* ── Equipo ── */
    var selEquipo = sel(App.equiposActivos().map(function (e) {
      return { valor: e.id, texto: e.nombre + (e.precio ? '  ·  ' + U.plata(e.precio) : '') };
    }), inicial.equipoId, '— elegir equipo —');
    selEquipo.addEventListener('change', avisarPrecio);

    var bNuevoEq = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '+ Equipo nuevo' });
    bNuevoEq.addEventListener('click', function () {
      crearEquipo(function (nuevo) {
        selEquipo.appendChild(U.el('option', { value: nuevo.id, text: nuevo.nombre }));
        selEquipo.value = nuevo.id;
      });
    });

    var filaEquipo = U.el('div', { style: 'display:flex;gap:8px;align-items:flex-end' });
    var labEquipo = campo('Equipo *', selEquipo);
    labEquipo.style.flex = '1';
    filaEquipo.appendChild(labEquipo);
    filaEquipo.appendChild(bNuevoEq);

    /* ── Accionamiento ── */
    var selAcc = sel(App.cache.listas.accionamientos || Datos.ACCIONAMIENTOS,
      inicial.accionamiento, '— elegir —');

    /* ── Plataforma ── */
    var selPlat = sel(Datos.PLATAFORMAS.filter(function (p) { return p.valor; }),
      inicial.plataforma, '— sin especificar —');

    /* ── Montado sobre / color ── */
    var inpMontado = inp({ type: 'text', placeholder: 'Ej: Mercedes-Benz Accelo 1016', value: inicial.montadoSobre || '' });
    var inpColor = inp({ type: 'text', placeholder: 'Ej: Blanco', value: inicial.color || '' });

    /* ── Nro. de serie ── */
    var inpSerie = inp({ type: 'text', placeholder: 'Se puede completar más adelante', value: inicial.nroSerie || '' });

    /* ── Toma de fuerza ── */
    var chkTF = U.el('input', { type: 'checkbox' });
    chkTF.checked = !!inicial.tomaFuerza;
    var inpTF = inp({ type: 'text', placeholder: 'N° de toma de fuerza', value: inicial.tomaFuerzaNro || '' });
    inpTF.disabled = !chkTF.checked;
    chkTF.addEventListener('change', function () {
      inpTF.disabled = !chkTF.checked;
      if (!chkTF.checked) inpTF.value = '';
      else inpTF.focus();
    });
    var filaTF = U.el('div', { class: 'campo' }, [
      U.el('span', { text: 'Toma de fuerza' }),
      U.el('div', { style: 'display:flex;gap:12px;align-items:center' }, [
        U.el('label', { class: 'check nowrap' }, [chkTF, U.el('span', { text: 'Lleva' })]),
        inpTF
      ])
    ]);

    /* ── Grilla principal ── */
    var g = U.el('div', { class: 'grid g3' });
    g.appendChild(U.el('div', { style: 'grid-column:1/-1' }, [filaEquipo]));
    g.appendChild(campo('Accionamiento', selAcc));
    g.appendChild(campo('Plataforma', selPlat, 'Opcional'));
    g.appendChild(campo('Nro. de serie', inpSerie, 'Opcional'));
    g.appendChild(campo('Montado sobre', inpMontado));
    g.appendChild(campo('Color', inpColor));
    g.appendChild(filaTF);
    caja.appendChild(g);

    /* ── Accesorios ── */
    caja.appendChild(U.el('div', { class: 'sep' }));
    caja.appendChild(U.el('div', { class: 'etiqueta', style: 'display:block;margin-bottom:8px', text: 'Accesorios' }));

    var contAcc = U.el('div');
    caja.appendChild(contAcc);

    function filaAccesorio(datos) {
      datos = datos || {};
      var fila = U.el('div', { class: 'fila-accesorio' });
      fila.style.gridTemplateColumns = '1fr 90px 140px 40px';

      var s = sel(App.accesoriosActivos().map(function (a) {
        return { valor: a.id, texto: a.nombre + (a.precio ? '  ·  ' + U.plata(a.precio) : '') };
      }), datos.accesorioId, '— elegir accesorio —');

      // Si la venta trae un accesorio que ya no está en el catálogo (o que
      // fue desactivado), se agrega igual para no perderlo al editar.
      if (datos.accesorioId && !s.value) {
        var suelto = U.el('option', {
          value: datos.accesorioId,
          text: (datos.nombre || 'Accesorio') + '  (fuera del catálogo)'
        });
        suelto.selected = true;
        s.appendChild(suelto);
      }

      var c = inp({ type: 'number', min: '1', step: '1', value: datos.cantidad || 1 });
      var p = inp({ type: 'number', min: '0', step: '0.01',
        value: datos.precioUnitario !== undefined ? datos.precioUnitario : '' });

      // Al elegir el accesorio se trae el precio de lista; se puede pisar a mano.
      s.addEventListener('change', function () {
        var acc = App.cache.accesorios.filter(function (a) { return a.id === s.value; })[0];
        if (acc && !Number(p.value)) p.value = acc.precio || 0;
        avisarPrecio();
      });
      c.addEventListener('input', avisarPrecio);
      p.addEventListener('input', avisarPrecio);

      var x = U.el('button', { class: 'btn btn-borde', type: 'button', text: '×', title: 'Quitar' });
      x.addEventListener('click', function () { fila.remove(); avisarPrecio(); });

      fila.appendChild(campo('Accesorio', s));
      fila.appendChild(campo('Cant.', c));
      fila.appendChild(campo('Precio unit.', p));
      fila.appendChild(x);

      fila._leer = function () {
        if (!s.value) return null;
        var acc = App.cache.accesorios.filter(function (a) { return a.id === s.value; })[0];
        return {
          accesorioId: s.value,
          // Si quedó fuera del catálogo, se conserva el nombre con el que se vendió.
          nombre: acc ? acc.nombre : (datos.nombre || ''),
          cantidad: Math.max(1, Number(c.value) || 1),
          precioUnitario: Number(p.value) || 0
        };
      };
      return fila;
    }

    (inicial.accesorios || []).forEach(function (a) { contAcc.appendChild(filaAccesorio(a)); });

    var filaBotonesAcc = U.el('div', { class: 'fila-flex' });
    var bAddAcc = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '+ Agregar accesorio' });
    bAddAcc.addEventListener('click', function () { contAcc.appendChild(filaAccesorio()); avisarPrecio(); });
    filaBotonesAcc.appendChild(bAddAcc);

    var bNuevoAcc = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '+ Accesorio nuevo al catálogo' });
    bNuevoAcc.addEventListener('click', function () {
      crearAccesorio(function () { U.toast('Accesorio agregado al catálogo.', 'ok'); });
    });
    filaBotonesAcc.appendChild(bNuevoAcc);
    caja.appendChild(filaBotonesAcc);

    /* ── Observaciones y medidas especiales ── */
    caja.appendChild(U.el('div', { class: 'sep' }));

    var txtObservaciones = U.el('textarea', {
      rows: '3',
      placeholder: 'Lo que haya que aclarar de este equipo'
    });
    txtObservaciones.value = inicial.observaciones || '';
    caja.appendChild(campo('Observaciones', txtObservaciones,
      'Se ven en la columna Observaciones del listado y en la hoja de fábrica'));

    var txtMedidas = U.el('textarea', {
      rows: '5',
      placeholder: 'Detalle de medidas especiales, adaptaciones, refuerzos, observaciones para fábrica…'
    });
    txtMedidas.value = inicial.medidasEspeciales || '';
    caja.appendChild(U.el('div', { style: 'margin-top:14px' },
      [campo('Descripción de medidas especiales', txtMedidas)]));

    return {
      el: caja,
      /** Suma el precio de lista del equipo más el de los accesorios cargados. */
      precioLista: function () {
        var eq = App.cache.equipos.filter(function (x) { return x.id === selEquipo.value; })[0];
        var total = eq ? (Number(eq.precio) || 0) : 0;
        U.$$('.fila-accesorio', contAcc).forEach(function (fi) {
          var a = fi._leer();
          if (a) total += a.cantidad * a.precioUnitario;
        });
        return total;
      },
      nombreEquipo: function () {
        var e = App.cache.equipos.filter(function (x) { return x.id === selEquipo.value; })[0];
        return e ? e.nombre : '';
      },
      validar: function () {
        var ok = !!selEquipo.value;
        marcarError(selEquipo, !ok);
        return ok;
      },
      leer: function () {
        var accesorios = U.$$('.fila-accesorio', contAcc)
          .map(function (f) { return f._leer(); })
          .filter(Boolean);
        var eq = App.cache.equipos.filter(function (x) { return x.id === selEquipo.value; })[0];
        return {
          equipoId: selEquipo.value,
          equipoNombre: eq ? eq.nombre : '',
          accionamiento: selAcc.value,
          plataforma: selPlat.value,
          montadoSobre: inpMontado.value.trim(),
          color: inpColor.value.trim(),
          nroSerie: inpSerie.value.trim(),
          tomaFuerza: chkTF.checked,
          tomaFuerzaNro: chkTF.checked ? inpTF.value.trim() : '',
          accesorios: accesorios,
          observaciones: txtObservaciones.value.trim(),
          medidasEspeciales: txtMedidas.value.trim()
        };
      }
    };
  }

  /* ═══════════════ Bloque: adjuntar planilla PDF ═══════════════ */

  /**
   * @param {string|null} idExistente  planilla ya guardada (al editar una venta)
   */
  function bloquePlanilla(idExistente) {
    var caja = U.el('div');
    var archivo = null;          // archivo nuevo elegido en esta pasada
    var idGuardado = idExistente || null;
    var urlPrevia = null;

    var zona = U.el('div', { class: 'zona-pdf' }, [
      U.el('div', { class: 'ico', text: '📄' }),
      U.el('div', { html: '<strong>Hacé clic acá o arrastrá el PDF</strong>' }),
      U.el('div', { class: 'txt-chico', style: 'margin-top:4px', text: 'Planilla de medidas en formato PDF' })
    ]);

    var input = U.el('input', { type: 'file', accept: 'application/pdf,.pdf', style: 'display:none' });
    var cargado = U.el('div', { class: 'oculto' });

    caja.appendChild(zona);
    caja.appendChild(input);
    caja.appendChild(cargado);

    function limpiarUrl() {
      if (urlPrevia) { URL.revokeObjectURL(urlPrevia); urlPrevia = null; }
    }

    function tomar(file) {
      if (!file) return;
      var esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      if (!esPdf) { U.toast('La planilla tiene que ser un archivo PDF.', 'error'); return; }
      if (file.size > 25 * 1024 * 1024) {
        U.toast('El PDF es muy pesado (máximo 25 MB).', 'error'); return;
      }
      limpiarUrl();
      archivo = file;
      idGuardado = null;         // el nuevo reemplaza al que estaba
      urlPrevia = URL.createObjectURL(file);

      zona.classList.add('oculto');
      cargado.classList.remove('oculto');
      cargado.innerHTML = '';
      cargado.appendChild(U.el('div', { class: 'pdf-cargado' }, [
        U.el('span', { text: '📄' }),
        U.el('div', { class: 'nom' }, [
          U.el('div', { text: file.name }),
          U.el('div', { class: 'txt-chico', text: U.bytes(file.size) })
        ]),
        (function () {
          var b = U.el('button', { class: 'btn btn-chico btn-primario', type: 'button', text: 'Ver con zoom' });
          b.addEventListener('click', function () { App.abrirPDFUrl(urlPrevia, file.name); });
          return b;
        })(),
        (function () {
          var b = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Quitar' });
          b.addEventListener('click', function () {
            limpiarUrl(); archivo = null; input.value = '';
            cargado.classList.add('oculto'); zona.classList.remove('oculto');
            vistaPrevia.innerHTML = '';
          });
          return b;
        })()
      ]));

      /* Vista previa embebida, para no tener que descargar el PDF */
      vistaPrevia.innerHTML = '';
      var marco = U.el('iframe', {
        src: urlPrevia,
        style: 'width:100%;height:520px;border:1px solid var(--gris-3);border-radius:8px;margin-top:12px;background:var(--gris-2)'
      });
      vistaPrevia.appendChild(marco);
    }

    var vistaPrevia = U.el('div');
    caja.appendChild(vistaPrevia);

    zona.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () { tomar(input.files[0]); });

    ['dragenter', 'dragover'].forEach(function (ev) {
      zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.add('sobre'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.remove('sobre'); });
    });
    zona.addEventListener('drop', function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) tomar(e.dataTransfer.files[0]);
    });

    /* Al editar una venta que ya tenía planilla, se muestra la que está. */
    if (idGuardado) {
      zona.classList.add('oculto');
      cargado.classList.remove('oculto');
      Store.urlArchivo(idGuardado).then(function (a) {
        if (!a) { idGuardado = null; zona.classList.remove('oculto'); cargado.classList.add('oculto'); return; }
        cargado.innerHTML = '';
        cargado.appendChild(U.el('div', { class: 'pdf-cargado' }, [
          U.el('span', { text: '📄' }),
          U.el('div', { class: 'nom' }, [
            U.el('div', { text: a.nombre }),
            U.el('div', { class: 'txt-chico', text: U.bytes(a.tamano) + ' · ya guardada' })
          ]),
          (function () {
            var b = U.el('button', { class: 'btn btn-chico btn-primario', type: 'button', text: 'Ver con zoom' });
            b.addEventListener('click', function () { App.abrirPDF(idGuardado, a.nombre); });
            return b;
          })(),
          (function () {
            var b = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Reemplazar' });
            b.addEventListener('click', function () { input.click(); });
            return b;
          })(),
          (function () {
            var b = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Quitar' });
            b.addEventListener('click', function () {
              idGuardado = null; archivo = null;
              cargado.classList.add('oculto'); zona.classList.remove('oculto');
              vistaPrevia.innerHTML = '';
            });
            return b;
          })()
        ]));
        vistaPrevia.innerHTML = '';
        vistaPrevia.appendChild(U.el('iframe', {
          src: a.url,
          style: 'width:100%;height:520px;border:1px solid var(--gris-3);border-radius:8px;margin-top:12px;background:var(--gris-2)'
        }));
      });
    }

    return {
      el: caja,
      archivo: function () { return archivo; },
      idGuardado: function () { return idGuardado; },
      liberar: limpiarUrl
    };
  }

  /* ═══════════════ Bloque: cliente ═══════════════ */

  function bloqueCliente(clienteInicial) {
    var caja = U.el('div');
    var clienteElegido = null;

    var inpCuit = inp({ type: 'text', placeholder: '30-12345678-9', maxlength: '13' });
    var resultado = U.el('div', { style: 'margin-top:12px' });

    var bBuscar = U.el('button', { class: 'btn btn-borde', type: 'button', text: 'Buscar' });
    var bLista = U.el('button', { class: 'btn btn-borde', type: 'button', text: 'Elegir de la lista' });

    var fila = U.el('div', { style: 'display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap' });
    var labCuit = campo('CUIT del cliente *', inpCuit, 'Al cargarlo se completan los datos automáticamente');
    labCuit.style.flex = '1';
    labCuit.style.minWidth = '240px';
    fila.appendChild(labCuit);
    fila.appendChild(bBuscar);
    fila.appendChild(bLista);
    caja.appendChild(fila);
    caja.appendChild(resultado);

    function mostrar(c) {
      clienteElegido = c;
      resultado.innerHTML = '';
      if (!c) return;
      var g = U.el('div', { class: 'detalle-grid', style: 'background:var(--gris-1);padding:14px;border-radius:8px;border:1px solid var(--gris-3)' });
      [['Razón social', c.razonSocial], ['Nombre de fantasía', c.nombreFantasia],
       ['Condición IVA', c.condicionIva], ['Dirección', c.direccion],
       ['Localidad', c.localidad], ['Provincia', c.provincia],
       ['Teléfono', c.telefono], ['Email', c.email]
      ].forEach(function (p) {
        if (!p[1]) return;
        g.appendChild(U.el('div', { class: 'detalle-item' }, [
          U.el('div', { class: 'rot', text: p[0] }),
          U.el('div', { class: 'val', text: p[1] })
        ]));
      });
      resultado.appendChild(g);
    }

    function noEncontrado(cuit) {
      clienteElegido = null;
      resultado.innerHTML = '';
      var aviso = U.el('div', { class: 'alerta alerta-aviso', style: 'display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap' });
      aviso.appendChild(U.el('span', { text: 'No hay ningún cliente cargado con ese CUIT.' }));
      var b = U.el('button', { class: 'btn btn-chico btn-primario', type: 'button', text: '+ Crear cliente' });
      b.addEventListener('click', function () {
        Vistas.formCliente({ cuit: cuit }, function (nuevo) {
          inpCuit.value = U.cuitFmt(nuevo.cuit);
          mostrar(nuevo);
        });
      });
      aviso.appendChild(b);
      resultado.appendChild(aviso);
    }

    function buscar() {
      var d = U.soloDigitos(inpCuit.value);
      if (!d) { resultado.innerHTML = ''; clienteElegido = null; return; }
      if (d.length !== 11) {
        resultado.innerHTML = '<div class="alerta alerta-error">El CUIT tiene que tener 11 dígitos.</div>';
        clienteElegido = null;
        return;
      }
      inpCuit.value = U.cuitFmt(d);
      var c = App.clientePorCuit(d);
      if (c) mostrar(c); else noEncontrado(d);
    }

    inpCuit.addEventListener('blur', buscar);
    inpCuit.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); buscar(); }
    });
    bBuscar.addEventListener('click', buscar);
    bLista.addEventListener('click', function () {
      elegirCliente(function (c) { inpCuit.value = U.cuitFmt(c.cuit); mostrar(c); });
    });

    if (clienteInicial) {
      inpCuit.value = U.cuitFmt(clienteInicial.cuit);
      mostrar(clienteInicial);
    }

    return {
      el: caja,
      cliente: function () { return clienteElegido; },
      validar: function () {
        var ok = !!clienteElegido;
        marcarError(inpCuit, !ok);
        return ok;
      }
    };
  }

  /** Modal para elegir un cliente de la lista. */
  function elegirCliente(alElegir) {
    var cuerpo = U.el('div');
    var buscador = inp({ type: 'text', placeholder: 'Buscar por nombre o CUIT…' });
    cuerpo.appendChild(campo('Buscar', buscador));
    var lista = U.el('div', { style: 'margin-top:12px;max-height:380px;overflow:auto' });
    cuerpo.appendChild(lista);

    function pintar() {
      var t = U.norm(buscador.value);
      var res = App.cache.clientes.filter(function (c) {
        if (!t) return true;
        return U.norm(c.razonSocial + ' ' + c.nombreFantasia + ' ' + c.cuit).indexOf(t) !== -1;
      }).slice(0, 200);

      lista.innerHTML = '';
      if (!res.length) {
        lista.appendChild(U.el('div', { class: 'vacio', text: 'No se encontraron clientes.' }));
        return;
      }
      var tabla = U.el('table', { class: 'tabla' });
      var tb = U.el('tbody');
      U.ordenarPor(res, 'razonSocial').forEach(function (c) {
        var tr = U.el('tr', { class: 'clickable' }, [
          U.el('td', { text: c.razonSocial }),
          U.el('td', { class: 'txt-chico', text: U.cuitFmt(c.cuit) })
        ]);
        tr.addEventListener('click', function () { U.cerrarModal(); alElegir(c); });
        tb.appendChild(tr);
      });
      tabla.appendChild(tb);
      lista.appendChild(tabla);
    }

    buscador.addEventListener('input', U.debounce(pintar, 180));
    U.modal({ titulo: 'Elegir cliente', cuerpo: cuerpo, botones: [{ texto: 'Cancelar', clase: 'btn-borde' }] });
    pintar();
    buscador.focus();
  }

  /* ═══════════════ Bloque: administración ═══════════════ */

  function bloqueAdmin(getFecha, cuitCliente, precioSugerido, inicial) {
    inicial = inicial || {};
    var caja = U.el('div');

    var inpCuitFact = inp({ type: 'text', placeholder: 'Igual al del cliente si se deja vacío',
      value: inicial.cuitFacturacion ? U.cuitFmt(inicial.cuitFacturacion) : '' });
    var selPago = sel(App.cache.listas.formasPago || Datos.FORMAS_PAGO, inicial.formaPago || '', '— elegir —');
    var inpPlazo = inp({ type: 'number', min: '0', step: '1', placeholder: 'Ej: 45',
      value: inicial.plazoEntregaDias === undefined ? '' : inicial.plazoEntregaDias });
    var inpPrometida = inp({ type: 'date', value: inicial.fechaPrometida || '' });
    // Si ya venía cargada, no se pisa sola al tocar el plazo.
    var prometidaManual = !!inicial.fechaPrometida;

    inpPrometida.addEventListener('input', function () { prometidaManual = true; });

    function recalcular() {
      if (prometidaManual) return;
      var base = getFecha();
      if (base && inpPlazo.value !== '') inpPrometida.value = U.sumarDias(base, inpPlazo.value);
    }
    inpPlazo.addEventListener('input', recalcular);

    var bAuto = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Recalcular' });
    bAuto.addEventListener('click', function () { prometidaManual = false; recalcular(); });

    var filaProm = U.el('div', { style: 'display:flex;gap:8px;align-items:flex-end' });
    var labProm = campo('Fecha prometida', inpPrometida, 'Se calcula sola con el plazo');
    labProm.style.flex = '1';
    filaProm.appendChild(labProm);
    filaProm.appendChild(bAuto);

    /* Precios */
    var inpPrecio = inp({ type: 'number', min: '0', step: '0.01', placeholder: '0,00',
      value: inicial.precioVenta || '' });
    var selIva = sel(Datos.ALICUOTAS_IVA.map(function (a) { return { valor: String(a), texto: a + '%' }; }),
      String(inicial.alicuotaIva === undefined ? 21 : inicial.alicuotaIva), null);
    var selMoneda = sel(Datos.MONEDAS, inicial.moneda || 'ARS', null);
    var inpAcordado = inp({ type: 'number', min: '0', step: '0.01', placeholder: '0,00',
      value: inicial.precioAcordado || '' });

    var totales = U.el('div', { class: 'total-caja' });
    function pintarTotales() {
      var neto = Number(inpPrecio.value) || 0;
      var ali = Number(selIva.value) || 0;
      var iva = neto * ali / 100;
      var m = selMoneda.value;
      totales.innerHTML = '';
      totales.appendChild(U.el('div', { class: 'total-linea' }, [
        U.el('span', { text: 'Precio de venta (neto)' }), U.el('strong', { text: U.plata(neto, m) })]));
      totales.appendChild(U.el('div', { class: 'total-linea' }, [
        U.el('span', { text: 'IVA ' + ali + '%' }), U.el('strong', { text: U.plata(iva, m) })]));
      totales.appendChild(U.el('div', { class: 'total-linea grande' }, [
        U.el('span', { text: 'Total con IVA' }), U.el('span', { text: U.plata(neto + iva, m) })]));
      var ac = Number(inpAcordado.value) || 0;
      if (ac) {
        totales.appendChild(U.el('div', { class: 'total-linea', style: 'color:var(--naranja-osc)' }, [
          U.el('span', { text: 'Precio acordado' }), U.el('strong', { text: U.plata(ac, m) })]));
      }
    }
    [inpPrecio, selIva, selMoneda, inpAcordado].forEach(function (c) {
      c.addEventListener('input', pintarTotales);
      c.addEventListener('change', pintarTotales);
    });

    var g = U.el('div', { class: 'grid g3' });
    g.appendChild(campo('CUIT de facturación', inpCuitFact));
    g.appendChild(campo('Forma de pago', selPago));
    g.appendChild(campo('Plazo de entrega (días)', inpPlazo));
    g.appendChild(filaProm);
    g.appendChild(campo('Moneda', selMoneda));
    g.appendChild(campo('Alícuota de IVA', selIva));
    /* Precio de venta con atajo al precio de lista del catálogo */
    var bLista = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Usar precio de lista' });
    var avisoLista = U.el('div', { class: 'ayuda' });

    function actualizarAvisoLista() {
      var sug = precioSugerido ? precioSugerido() : 0;
      avisoLista.textContent = sug
        ? 'Según el catálogo: ' + U.plata(sug)
        : 'Cargá los precios en Equipos y accesorios para que se calcule solo.';
      bLista.disabled = !sug;
    }
    bLista.addEventListener('click', function () {
      var sug = precioSugerido ? precioSugerido() : 0;
      if (!sug) return;
      inpPrecio.value = sug;
      pintarTotales();
    });

    var campoPrecio = U.el('div', { class: 'campo' }, [
      U.el('span', { text: 'Precio de venta (neto)' }),
      U.el('div', { style: 'display:flex;gap:8px;align-items:center' }, [inpPrecio, bLista]),
      avisoLista
    ]);

    g.appendChild(campoPrecio);
    g.appendChild(campo('Precio acordado', inpAcordado, 'Si difiere del calculado'));
    caja.appendChild(g);
    caja.appendChild(U.el('div', { style: 'margin-top:16px' }, [totales]));
    pintarTotales();
    actualizarAvisoLista();

    return {
      el: caja,
      recalcular: recalcular,
      actualizarPrecioLista: actualizarAvisoLista,
      leer: function () {
        return {
          cuitFacturacion: U.soloDigitos(inpCuitFact.value) || U.soloDigitos(cuitCliente() || ''),
          formaPago: selPago.value,
          plazoEntregaDias: inpPlazo.value === '' ? '' : Number(inpPlazo.value),
          fechaPrometida: inpPrometida.value,
          moneda: selMoneda.value,
          alicuotaIva: Number(selIva.value) || 0,
          precioVenta: Number(inpPrecio.value) || 0,
          precioAcordado: Number(inpAcordado.value) || 0
        };
      }
    };
  }

  /* ═══════════════ Altas rápidas de catálogo ═══════════════ */

  function crearEquipo(alCrear) {
    var cuerpo = U.el('div');
    var i = inp({ type: 'text', placeholder: 'Nombre del equipo' });
    cuerpo.appendChild(campo('Nombre del equipo', i));

      titulo: 'Equipo nuevo',
      cuerpo: cuerpo,

          if (!n) { U.toast('Escribí un nombre.', 'error'); return false; }

          });

      ]
    });

  function crearAccesorio(alCrear) {
    var cuerpo = U.el('div');
    var i = inp({ type: 'text', placeholder: 'Nombre del accesorio' });
    cuerpo.appendChild(campo('Nombre del accesorio', i));
    U.modal({
      titulo: 'Accesorio nuevo',
      cuerpo: cuerpo,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        { texto: 'Crear', clase: 'btn-primario', accion: function () {
          var n = i.value.trim();
          if (!n) { U.toast('Escribí un nombre.', 'error'); return false; }
          var ac = { id: U.id('acc'), nombre: n, precio: 0, activo: true };
          Store.put('accesorios', ac).then(function () {
            App.cache.accesorios.push(ac);
            if (alCrear) alCrear(ac);
          });
        } }
      ]
    });
    setTimeout(function () { i.focus(); }, 50);
  }

  /* ═══════════════ Vista: Venta ═══════════════ */

  function construirVista(multiple) {
    /**
     * @param {object} params  { editar: venta } para abrir una venta ya cargada
     */
    return function (cont, acciones, params) {
      // Al editar se trabaja siempre sobre una sola unidad.
      var original = (params && params.editar) || null;
      if (original) multiple = false;

      // App.ir ya puso el título de "Nueva venta"; al editar se reemplaza.
      if (original) {
        document.getElementById('titulo-vista').textContent =
          (original.equipoNombre || 'Venta') + (original.nroSerie ? ' — ' + original.nroSerie : '');
        document.getElementById('subtitulo-vista').textContent =
          (original.nro ? 'Venta N° ' + original.nro + ' · ' : '') +
          (original.clienteNombre || '') + ' · ' + (original.estado || '');
      }

      var panel = U.el('div', { class: 'panel' });

      /* ── 1. Datos del vendedor ── */
      var vendedores = App.vendedores();
      var selVend = sel(vendedores.map(function (u) {
        return { valor: u.id, texto: u.nombre + ' (' + Auth.rolTexto(u.rol) + ')' };
      }), original ? original.vendedorId : Auth.usuario.id, '— elegir vendedor —');
      var inpFecha = inp({ type: 'date', value: original ? original.fecha : U.hoyISO() });

      // Las ventas del histórico no tienen vendedor del sistema; se deja
      // el nombre suelto para no perderlo al guardar.
      var nombreVendedorSuelto = original && !selVend.value ? (original.vendedorNombre || '') : '';

      var g1 = U.el('div', { class: 'grid g2' });
      g1.appendChild(campo('Vendedor *', selVend));
      g1.appendChild(campo('Fecha *', inpFecha));
      if (nombreVendedorSuelto) {
        g1.appendChild(U.el('div', { class: 'col-todo' }, [
          U.el('div', { class: 'alerta alerta-info',
            text: 'Esta venta vino del histórico con el vendedor "' + nombreVendedorSuelto +
                  '", que no es un usuario del sistema. Si elegís uno de la lista, se reemplaza.' })
        ]));
      }
      panel.appendChild(seccion(1, 'Datos del vendedor', g1));

      /* ── 2. Cliente ── */
      var clienteInicial = original
        ? (App.cache.clientes.filter(function (c) { return c.id === original.clienteId; })[0] ||
           App.clientePorCuit(original.clienteCuit))
        : null;
      var cli = bloqueCliente(clienteInicial);
      panel.appendChild(seccion(2, 'Datos del cliente', cli.el));

      if (original && !clienteInicial) {
        panel.appendChild(U.el('div', { class: 'seccion-cuerpo' }, [
          U.el('div', { class: 'alerta alerta-aviso',
            text: 'Esta venta figura a nombre de "' + (original.clienteNombre || '—') +
                  '", pero ese cliente no tiene ficha cargada. Buscalo o crealo para poder guardar.' })
        ]));
      }

      /* ── 3. Producción ── */
      var bloques = [];
      var contProd = U.el('div');
      var admin = null;   // se crea más abajo; los bloques le avisan al cambiar precios

      function avisarAdmin() { if (admin) admin.actualizarPrecioLista(); }

      if (!multiple) {
        var b = bloqueProduccion(original, avisarAdmin);
        bloques.push(b);
        contProd.appendChild(b.el);
      } else {
        var lista = U.el('div');
        contProd.appendChild(lista);

        function agregarUnidad(copiarDe) {
          var datos = copiarDe ? copiarDe.leer() : null;
          if (datos) { datos.nroSerie = ''; }
          var bp = bloqueProduccion(datos, avisarAdmin);
          bloques.push(bp);

          var caja = U.el('div', { class: 'fila-unidad' });
          var titulo = U.el('span', { text: 'Unidad ' + bloques.length });
          var acciones = U.el('div', { class: 'fila-flex' });

          var bDup = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Duplicar' });
          bDup.addEventListener('click', function (e) { e.stopPropagation(); agregarUnidad(bp); });

          var bDel = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: 'Quitar' });
          bDel.addEventListener('click', function (e) {
            e.stopPropagation();
            if (bloques.length === 1) { U.toast('Tiene que quedar al menos una unidad.', 'aviso'); return; }
            bloques = bloques.filter(function (x) { return x !== bp; });
            caja.remove();
            renumerar();
          });

          acciones.appendChild(bDup);
          acciones.appendChild(bDel);

          var cab = U.el('div', { class: 'cab' }, [titulo, acciones]);
          var cuerpo = U.el('div', { class: 'cuerpo' }, [bp.el]);
          cab.addEventListener('click', function () {
            cuerpo.classList.toggle('oculto');
          });
          caja.appendChild(cab);
          caja.appendChild(cuerpo);
          caja._titulo = titulo;
          caja._bloque = bp;
          lista.appendChild(caja);
          renumerar();
        }

        function renumerar() {
          U.$$('.fila-unidad', lista).forEach(function (c, i) {
            c._titulo.textContent = 'Unidad ' + (i + 1) +
              (c._bloque.nombreEquipo() ? ' — ' + c._bloque.nombreEquipo() : '');
          });
        }

        agregarUnidad();

        var bAdd = U.el('button', { class: 'btn btn-borde', type: 'button', text: '+ Agregar unidad' });
        bAdd.addEventListener('click', function () { agregarUnidad(); });
        contProd.appendChild(bAdd);
      }

      panel.appendChild(seccion(3, multiple ? 'Datos de producción — unidades' : 'Datos de producción', contProd));

      /* ── 4. Planilla ── */
      var planilla = bloquePlanilla(original ? original.planillaId : null);
      panel.appendChild(seccion(4, 'Planilla de medidas', planilla.el));

      /* ── 5. Administración ── */
      admin = bloqueAdmin(
        function () { return inpFecha.value; },
        function () { return cli.cliente() ? cli.cliente().cuit : ''; },
        function () {
          return bloques.reduce(function (a, bp) { return a + bp.precioLista(); }, 0);
        },
        original
      );
      inpFecha.addEventListener('change', admin.recalcular);
      panel.appendChild(seccion(5, 'Datos para administración', admin.el));

      /* ── Acciones ── */
      var pieAcciones = U.el('div', { class: 'acciones-form' });

      if (original && Auth.puede('borrarVenta')) {
        var bBorrar = U.el('button', { class: 'btn btn-peligro', type: 'button', text: 'Borrar venta' });
        bBorrar.style.marginRight = 'auto';
        bBorrar.addEventListener('click', function () { borrar(); });
        pieAcciones.appendChild(bBorrar);
      }

      if (original) {
        var bImprimir = U.el('button', { class: 'btn btn-borde', type: 'button', text: '🖨 Imprimir PDF' });
        bImprimir.addEventListener('click', function () {
          Vistas.hojaFabrica(lecturaActual());
        });
        pieAcciones.appendChild(bImprimir);
      }

      var bCancelar = U.el('button', { class: 'btn btn-borde', type: 'button',
        text: original ? 'VOLVER' : 'CANCELAR' });
      bCancelar.addEventListener('click', function () {
        U.confirmar(original ? 'Salir sin guardar' : 'Cancelar la carga',
          original ? 'Si hiciste cambios y salís, se pierden. ¿Salir igual?'
                   : '¿Seguro que querés salir? Se pierde todo lo cargado.',
          function () {
            planilla.liberar();
            App.ir('consultas');
          }, 'Sí, salir');
      });

      var bEnviar = U.el('button', { class: 'btn btn-accion', type: 'button',
        text: original ? 'GUARDAR CAMBIOS' : 'ENVIAR A FÁBRICA' });
      bEnviar.addEventListener('click', function () { enviar(bEnviar); });

      pieAcciones.appendChild(bCancelar);
      pieAcciones.appendChild(bEnviar);
      panel.appendChild(pieAcciones);

      cont.appendChild(panel);

      /* ── Al editar: lo que no se toca desde acá ── */
      if (original) cont.appendChild(panelesDeSoloLectura(original));

      /** Arma un objeto venta con lo que hay en pantalla ahora mismo. */
      function lecturaActual() {
        var v = U.clonar(original || {});
        var prod = bloques[0].leer();
        var datosAdmin = admin.leer();
        Object.keys(prod).forEach(function (k) { v[k] = prod[k]; });
        Object.keys(datosAdmin).forEach(function (k) { v[k] = datosAdmin[k]; });
        v.fecha = inpFecha.value;
        var c = cli.cliente();
        if (c) { v.clienteNombre = c.razonSocial; v.clienteCuit = c.cuit; }
        return v;
      }

      /** Borrado de la venta, solo para Gerencia. */
      function borrar() {
        U.confirmar('Borrar la venta',
          'Se borra la venta de ' + (original.clienteNombre || '') + ' — ' +
          (original.equipoNombre || '') + (original.nroSerie ? ' (serie ' + original.nroSerie + ')' : '') +
          ', junto con la planilla, la factura y el remito adjuntos. Esto no se puede deshacer.',
          function () {
            App.borrarVenta(original).then(function () {
              U.toast('Venta borrada.', 'ok');
              App.ir('consultas');
            }).catch(function (e) {
              U.toast('No se pudo borrar: ' + e.message, 'error');
            });
          }, 'Sí, borrar');
      }

      /* ── Envío ── */
      function enviar(boton) {
        var errores = [];

        if (!selVend.value) { marcarError(selVend, true); errores.push('Elegí el vendedor.'); }
        else marcarError(selVend, false);

        if (!inpFecha.value) { marcarError(inpFecha, true); errores.push('Cargá la fecha.'); }
        else marcarError(inpFecha, false);

        if (!cli.validar()) errores.push('Elegí un cliente con CUIT válido.');

        var faltaEquipo = bloques.some(function (b) { return !b.validar(); });
        if (faltaEquipo) errores.push('Todas las unidades tienen que tener un equipo elegido.');

        if (errores.length) {
          U.toast(errores[0], 'error');
          return;
        }

        var textoOriginal = boton.textContent;
        boton.disabled = true;
        boton.textContent = 'Guardando…';

        var cliente = cli.cliente();
        var vendedor = App.cache.usuarios.filter(function (u) { return u.id === selVend.value; })[0];
        var datosAdmin = admin.leer();
        var archivo = planilla.archivo();
        var grupoId = multiple && bloques.length > 1 ? U.id('grp') : null;

        var guardarArchivo = archivo
          ? Store.guardarArchivo(archivo)
          : Promise.resolve(planilla.idGuardado());

        /* ── Edición de una venta ya existente ── */
        if (original) {
          guardarArchivo.then(function (idArchivo) {
            var ahora = new Date().toISOString();
            var antes = U.clonar(original);
            var prod = bloques[0].leer();

            // Si se reemplazó la planilla, se borra la anterior.
            if (archivo && antes.planillaId && antes.planillaId !== idArchivo) {
              Store.del('archivos', antes.planillaId);
            }

            original.fecha = inpFecha.value;
            original.vendedorId = selVend.value;
            original.vendedorNombre = vendedor ? vendedor.nombre : nombreVendedorSuelto;
            original.clienteId = cliente.id;
            original.clienteCuit = cliente.cuit;
            original.clienteNombre = cliente.razonSocial;
            original.planillaId = idArchivo;
            Object.keys(prod).forEach(function (k) { original[k] = prod[k]; });
            Object.keys(datosAdmin).forEach(function (k) { original[k] = datosAdmin[k]; });
            original.actualizadoEn = ahora;
            delete original._busqueda;

            var cambios = describirCambios(antes, original);
            App.anotar(original, 'Venta modificada', cambios || 'sin cambios de datos');

            return Store.put('ventas', original).then(function () {
              planilla.liberar();
              U.toast('Cambios guardados.', 'ok');
              App.ir('consultas');
            });
          }).catch(function (e) {
            console.error(e);
            boton.disabled = false;
            boton.textContent = textoOriginal;
            U.toast('No se pudo guardar: ' + e.message, 'error', 6000);
          });
          return;
        }

        /* ── Venta nueva ── */
        guardarArchivo.then(function (idArchivo) {
          var nro = App.proximoNumero();
          var ahora = new Date().toISOString();

          var ventas = bloques.map(function (b, i) {
            var prod = b.leer();
            var v = {
              id: U.id('vta'),
              nro: nro + i,
              origen: 'sistema',
              grupoId: grupoId,
              fecha: inpFecha.value,
              vendedorId: selVend.value,
              vendedorNombre: vendedor ? vendedor.nombre : '',
              clienteId: cliente.id,
              clienteCuit: cliente.cuit,
              clienteNombre: cliente.razonSocial,
              planillaId: idArchivo,
              nroFactura: '', facturaId: null,
              nroRemito: '', remitoId: null,
              estadoPago: '',
              fechaEntrega: '', garantiaDias: '',
              estado: Datos.ESTADO_PENDIENTE,
              autorizacion: { estado: 'pendiente' },
              creadoPor: Auth.usuario.nombre,
              creadoEn: ahora,
              actualizadoEn: ahora,
              historial: [{
                fecha: ahora, usuario: Auth.usuario.nombre,
                accion: 'Venta enviada a fábrica', detalle: ''
              }]
            };
            Object.keys(prod).forEach(function (k) { v[k] = prod[k]; });
            Object.keys(datosAdmin).forEach(function (k) { v[k] = datosAdmin[k]; });
            return v;
          });

          return Store.bulk('ventas', ventas).then(function () {
            App.cache.ventas = App.cache.ventas.concat(ventas);
            planilla.liberar();
            U.toast(ventas.length === 1
              ? 'Venta enviada. Queda esperando la autorización.'
              : ventas.length + ' ventas enviadas. Quedan esperando la autorización.', 'ok', 5000);
            App.ir('consultas');
          });
        }).catch(function (e) {
          console.error(e);
          boton.disabled = false;
          boton.textContent = textoOriginal;
          U.toast('No se pudo guardar: ' + e.message, 'error', 6000);
        });
      }
    };
  }

  /** Resume qué campos cambiaron, para dejarlo anotado en el historial. */
  function describirCambios(antes, ahora) {
    var mirar = {
      fecha: 'fecha', clienteNombre: 'cliente', equipoNombre: 'equipo',
      nroSerie: 'nro. de serie', accionamiento: 'accionamiento', plataforma: 'plataforma',
      montadoSobre: 'vehículo', color: 'color', tomaFuerzaNro: 'toma de fuerza',
      dimensiones: 'dimensiones', medidasEspeciales: 'medidas especiales',
      observaciones: 'observaciones', formaPago: 'forma de pago',
      plazoEntregaDias: 'plazo', fechaPrometida: 'entrega estipulada',
      precioVenta: 'precio', precioAcordado: 'precio acordado'
    };
    var lista = [];
    Object.keys(mirar).forEach(function (k) {
      if (String(antes[k] || '') !== String(ahora[k] || '')) lista.push(mirar[k]);
    });
    if (JSON.stringify(antes.accesorios || []) !== JSON.stringify(ahora.accesorios || [])) {
      lista.push('accesorios');
    }
    if ((antes.planillaId || '') !== (ahora.planillaId || '')) lista.push('planilla');
    return lista.join(', ');
  }

  /**
   * Al abrir una venta ya cargada se muestran abajo las cosas que no se
   * editan desde este formulario: la documentación que carga administración,
   * la garantía, las reparaciones del equipo y el historial.
   */
  function panelesDeSoloLectura(v) {
    var caja = U.el('div');

    /* Documentación y garantía */
    var p1 = U.el('div', { class: 'panel' });
    p1.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Documentación y garantía' }),
        U.el('p', { class: 'sub', text: 'Lo carga Gerencia desde "Cargar factura / remito"' })
      ])
    ]));
    var c1 = U.el('div', { class: 'panel-cuerpo' });

    var g = U.el('div', { class: 'detalle-grid' });
    var gar = U.garantia(v.fechaEntrega, v.garantiaDias);
    [['Nro. de factura', v.nroFactura], ['Nro. de remito', v.nroRemito],
     ['Estado de pago', v.estadoPago], ['Fecha de entrega', U.fecha(v.fechaEntrega)],
     ['Garantía', gar ? (gar.vencida ? 'Vencida el ' + U.fecha(gar.vence)
                                     : gar.restantes + ' días (vence ' + U.fecha(gar.vence) + ')') : '']
    ].forEach(function (par) { g.appendChild(Comunes.item(par[0], par[1])); });
    c1.appendChild(g);

    var filaDoc = U.el('div', { class: 'fila-flex', style: 'margin-top:14px' });
    [['Factura', v.facturaId], ['Remito', v.remitoId]].forEach(function (par) {
      if (!par[1]) {
        filaDoc.appendChild(U.el('span', { class: 'chip', text: par[0] + ': sin adjuntar' }));
        return;
      }
      var b = U.el('button', { class: 'btn btn-chico btn-primario', type: 'button', text: '📄 Ver ' + par[0] });
      b.addEventListener('click', function () { App.abrirPDF(par[1], par[0]); });
      filaDoc.appendChild(b);
    });
    if (Auth.puede('cambiarEstado')) {
      var bCargar = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button',
        text: 'Cargar factura / remito' });
      bCargar.addEventListener('click', function () { Vistas.formAdministracionVenta(v); });
      filaDoc.appendChild(bCargar);
    }
    c1.appendChild(filaDoc);
    p1.appendChild(c1);
    caja.appendChild(p1);

    /* Reparaciones */
    var reps = App.reparacionesDeVenta(v);
    var p2 = U.el('div', { class: 'panel' });
    var cab2 = U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [U.el('h3', { text: 'Reparaciones de este equipo (' + reps.length + ')' })])
    ]);
    var bNuevaRep = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '+ Reparación' });
    bNuevaRep.addEventListener('click', function () { Vistas.nuevaReparacionDesdeVenta(v); });
    cab2.appendChild(bNuevaRep);
    p2.appendChild(cab2);

    if (!reps.length) {
      p2.appendChild(U.el('div', { class: 'panel-cuerpo' }, [
        U.el('p', { class: 'txt-chico', style: 'margin:0', text: 'Todavía no tuvo reparaciones.' })
      ]));
    } else {
      var t2 = U.el('table', { class: 'tabla' });
      t2.appendChild(U.el('thead', {}, [U.el('tr', {}, [
        U.el('th', { text: 'N°' }), U.el('th', { text: 'Ingreso' }),
        U.el('th', { text: 'Falla' }), U.el('th', { text: 'Garantía' }),
        U.el('th', { text: 'Total' }), U.el('th', { text: 'Estado' })
      ])]));
      var tb2 = U.el('tbody');
      reps.forEach(function (r) {
        var tr = U.el('tr', { class: 'clickable' }, [
          U.el('td', { class: 'num-col', text: r.nro || '—' }),
          U.el('td', { class: 'nowrap', text: U.fecha(r.fechaIngreso) }),
          U.el('td', { class: 'txt-chico', text: (r.falla || '').slice(0, 50) || '—' }),
          U.el('td', { text: r.enGarantia ? 'Sí' : 'No' }),
          U.el('td', { class: 'num-col', text: r.enGarantia ? 'Sin cargo' : U.plata(r.total || 0) }),
          U.el('td', { html: '<span class="pill pill-' + Datos.colorEstadoReparacion(r.estado) + '">' +
            U.esc(r.estado || '—') + '</span>' })
        ]);
        tr.addEventListener('click', function () { Vistas.verReparacion(r); });
        tb2.appendChild(tr);
      });
      t2.appendChild(tb2);
      p2.appendChild(U.el('div', { class: 'tabla-scroll' }, [t2]));
    }
    caja.appendChild(p2);

    /* Historial */
    if (v.historial && v.historial.length) {
      var p3 = U.el('div', { class: 'panel' });
      p3.appendChild(U.el('div', { class: 'panel-cab' }, [
        U.el('div', {}, [U.el('h3', { text: 'Historial' })])
      ]));
      var t3 = U.el('table', { class: 'tabla' });
      var tb3 = U.el('tbody');
      v.historial.slice().reverse().forEach(function (h) {

(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};
  var C = global.Comunes;

  /* ═══════════════ Listado ═══════════════ */

  Vistas.reparaciones = {
    titulo: 'Reparaciones',
    sub: function () {
      var abiertas = App.cache.reparaciones.filter(function (r) { return r.estado !== 'Entregada'; }).length;

      acciones.appendChild(bNueva);

      var panelF = U.el('div', { class: 'panel' });

      wrap.appendChild(inpBuscar);

      var selEstado = C.sel(Datos.listaEstadosReparacion().map(function (e) { return e.nombre; }),
        filtro.estado, 'Todos');

      fila.appendChild(U.el('label', { class: 'campo' }, [U.el('span', { text: 'Estado' }), selEstado]));

      cuerpoF.appendChild(fila);

      var chk = U.el('input', { type: 'checkbox' });
      chk.checked = filtro.soloGarantia;

      cuerpoF.appendChild(U.el('label', { class: 'check', style: 'margin-top:14px' },
        [chk, U.el('span', { text: 'Ver solo las que entraron por garantía' })]));

      panelF.appendChild(cuerpoF);

    }
  };

  function filtrados() {
    var t = U.norm(filtro.texto);
    return App.cache.reparaciones.filter(function (r) {
      if (filtro.estado && r.estado !== filtro.estado) return false;
      if (filtro.soloGarantia && !r.enGarantia) return false;
      if (!t) return true;
      return U.norm([r.nroSerie, r.clienteNombre, r.equipoNombre, r.falla, r.trabajos, r.tecnico]
        .join(' ')).indexOf(t) !== -1;
    }).sort(function (a, b) {
      return String(b.fechaIngreso || '').localeCompare(String(a.fechaIngreso || ''));
    });
  }

  function pintar(cont) {
    cont.innerHTML = '';
    var res = filtrados();

    if (!res.length) {
      cont.appendChild(U.el('div', { class: 'panel' }, [
        U.el('div', { class: 'vacio' }, [
          U.el('div', { class: 'grande', text: '🔧' }),

        ])

    var panel = U.el('div', { class: 'panel' });
    var scroll = U.el('div', { class: 'tabla-scroll' });

      U.el('th', { text: 'Equipo' }),
      U.el('th', { text: 'Nro. de serie', style: 'width:130px' }),
      U.el('th', { text: 'Cliente' }),
      U.el('th', { text: 'Falla' }),

    ])]));

    var tb = U.el('tbody');
    res.forEach(function (r) {
      var tr = U.el('tr', { class: 'clickable fila-' + Datos.colorEstadoReparacion(r.estado) }, [
        U.el('td', { class: 'num-col', text: r.nro || '—' }),
