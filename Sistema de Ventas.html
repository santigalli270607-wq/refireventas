<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REFIRE — Sistema de Ventas</title>
<style>
/* ═══════════════════════════════════════════════════════
   Sistema de Ventas — Hidromecánica
   ═══════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════
   Identidad REFIRE
   Los dos colores de la empresa, sacados de la fachada:
     rojo  #DE1014  (el del cartel y el pórtico de entrada)
     gris  #35343A  (el del revestimiento)
   Los nombres de variable quedaron de la versión anterior;
   lo que cambia es el valor.
   ═══════════════════════════════════════════════════════ */
:root{
  /* "azul" = el gris oscuro de la marca: títulos, botones, barra lateral */
  --azul:#35343a;      --azul-osc:#26252a;  --azul-cla:#4f4e58;
  /* "naranja" = el rojo de la marca: acentos y acción principal */
  --naranja:#de1014;   --naranja-osc:#b00d11;
  /* rojo de peligro: más oscuro, para no confundirlo con el rojo de marca */
  --verde:#1e8e5a;     --rojo:#8e1b16;      --amarillo:#b7791f;
  --gris-0:#ffffff;    --gris-1:#f7f7f8;    --gris-2:#ecebee;
  --gris-3:#d9d8dd;    --gris-4:#9b9aa3;    --gris-5:#5d5c66;  --gris-6:#2e2d33;
  --radio:8px;  --radio-chico:5px;
  --sombra:0 1px 3px rgba(16,24,40,.09), 0 1px 2px rgba(16,24,40,.05);
  --sombra-md:0 8px 24px rgba(16,24,40,.14);
  --lateral:250px;
  --fuente:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"Cascadia Mono", Consolas, "Courier New", monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--fuente); font-size:14px; color:var(--gris-6);
  background:var(--gris-1); -webkit-font-smoothing:antialiased;
}
.oculto{display:none !important;}

/* ─────────── Carga ─────────── */
.pantalla-carga{
  position:fixed; inset:0; display:flex; flex-direction:column; gap:16px;
  align-items:center; justify-content:center; background:var(--gris-1); z-index:99;
  color:var(--gris-5);
}
.spinner{
  width:34px;height:34px;border:3px solid var(--gris-3);border-top-color:var(--azul);
  border-radius:50%;animation:girar .8s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg);}}

/* ─────────── Login ─────────── */
.login-wrap{
  min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  background:linear-gradient(135deg,var(--azul-osc) 0%,var(--azul) 55%,var(--azul-cla) 100%);
}
.login-card{
  width:100%; max-width:390px; background:#fff; border-radius:12px; padding:34px 32px 30px;
  box-shadow:0 20px 50px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:16px;
  border-top:4px solid var(--naranja);
}
/* El logo de REFIRE, tal cual el original, con el fondo recortado */
.logo-login{display:block; width:100%; max-width:270px; height:auto; margin:2px auto 0;}
.login-sub{
  margin:0; text-align:center; font-size:12px; font-weight:600; color:var(--gris-4);
  text-transform:uppercase; letter-spacing:1.6px;
}
.login-sep{height:1px; background:var(--gris-2); margin:2px 0 4px;}
.login-pie{margin:0;font-size:12px;color:var(--gris-4);text-align:center;line-height:1.5;}

/* ─────────── Campos ─────────── */
.campo{display:flex;flex-direction:column;gap:5px;}
.campo > span, .etiqueta{font-size:12.5px;font-weight:600;color:var(--gris-5);}
.campo .ayuda{font-size:11.5px;color:var(--gris-4);font-weight:400;}
input[type=text],input[type=password],input[type=number],input[type=date],
input[type=email],input[type=tel],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--gris-3); border-radius:var(--radio-chico);
  font-family:inherit; font-size:14px; color:var(--gris-6); background:#fff; transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--azul-cla); box-shadow:0 0 0 3px rgba(222,16,20,.15);
}
input:disabled,select:disabled,textarea:disabled{background:var(--gris-2);color:var(--gris-4);cursor:not-allowed;}
textarea{resize:vertical;min-height:80px;line-height:1.5;}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--azul);cursor:pointer;}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;user-select:none;}
.campo-error input,.campo-error select,.campo-error textarea{border-color:var(--rojo);}
.msg-error{color:var(--rojo);font-size:12px;}

/* ─────────── Botones ─────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border:1px solid transparent;border-radius:var(--radio-chico);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  background:var(--gris-2);color:var(--gris-6);transition:background .12s,border-color .12s,opacity .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--gris-3);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primario{background:var(--azul);color:#fff;}
.btn-primario:hover{background:var(--azul-cla);}
.btn-accion{background:var(--naranja);color:#fff;}
.btn-accion:hover{background:var(--naranja-osc);}
.btn-ok{background:var(--verde);color:#fff;}
.btn-ok:hover{filter:brightness(1.1);}
.btn-peligro{background:var(--rojo);color:#fff;}
.btn-peligro:hover{filter:brightness(1.1);}
.btn-borde{background:#fff;border-color:var(--gris-3);}
.btn-borde:hover{background:var(--gris-1);border-color:var(--gris-4);}
.btn-fantasma{background:transparent;color:inherit;border-color:currentColor;opacity:.75;}
.btn-fantasma:hover{background:rgba(255,255,255,.12);opacity:1;}
.btn-block{width:100%;}
.btn-chico{padding:5px 10px;font-size:12.5px;}
.btn-x{
  background:none;border:none;font-size:26px;line-height:1;color:var(--gris-4);
  cursor:pointer;padding:0 4px;
}
.btn-x:hover{color:var(--gris-6);}

/* ─────────── Layout app ─────────── */
.app{display:flex;min-height:100vh;}
.lateral{
  width:var(--lateral);flex:0 0 var(--lateral);background:var(--azul-osc);color:#c9c8cd;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.lateral-marca{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid rgba(255,255,255,.09);}
/* El isotipo tiene trazos oscuros, así que va sobre una pastilla blanca */
.logo-iso{
  width:38px;height:38px;flex:0 0 38px;object-fit:contain;
  background:#fff;border-radius:8px;padding:3px;
}
.lateral-marca-txt{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
.lateral-marca-txt strong{color:#fff;font-size:14px;}
.lateral-marca-txt span{font-size:11.5px;color:#8e8d96;}
.nav{flex:1;overflow-y:auto;padding:12px 8px;}
.nav-grupo{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#83828c;
  padding:14px 10px 6px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 11px;border:none;background:none;color:#c9c8cd;font-family:inherit;font-size:13.5px;
  border-radius:var(--radio-chico);cursor:pointer;margin-bottom:2px;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.activo{background:var(--naranja);color:#fff;font-weight:600;}
.nav-item .ico{width:18px;text-align:center;flex:0 0 18px;opacity:.9;}
.nav-item .globo{
  margin-left:auto;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;
  border-radius:10px;padding:1px 7px;min-width:20px;text-align:center;
}
.nav-item.activo .globo{background:rgba(0,0,0,.28);}
.nav-sub{padding-left:26px;font-size:13px;}
.lateral-pie{padding:12px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:10px;}
.usuario-box{display:flex;align-items:center;gap:10px;}
.avatar{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--azul-cla);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
}
.usuario-datos{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
.usuario-datos strong{color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.usuario-datos span{font-size:11px;color:#8e8d96;}
.version{font-size:10.5px;color:#83828c;text-align:center;}

.contenido{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--gris-3);padding:16px 26px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
}
.topbar h2{margin:0;font-size:19px;}
.topbar .sub{margin:3px 0 0;font-size:12.5px;color:var(--gris-4);}
.topbar-acciones{display:flex;gap:8px;flex-wrap:wrap;}
.vista{padding:22px 26px 60px;flex:1;}

/* ─────────── Tarjetas / paneles ─────────── */
.panel{background:#fff;border:1px solid var(--gris-3);border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:18px;}
.panel-cab{padding:14px 18px;border-bottom:1px solid var(--gris-2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-cab h3{margin:0;font-size:15px;}
.panel-cab .sub{margin:2px 0 0;font-size:12px;color:var(--gris-4);}
.panel-cuerpo{padding:18px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.col-todo{grid-column:1/-1;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr;}}

/* ─────────── Tarjetas de resumen ─────────── */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.tarjeta{background:#fff;border:1px solid var(--gris-3);border-radius:var(--radio);padding:14px 16px;box-shadow:var(--sombra);}
.tarjeta .num{font-size:24px;font-weight:700;color:var(--azul);line-height:1.15;}
.tarjeta .rot{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-4);margin-top:3px;font-weight:600;}

/* ─────────── Tablas ─────────── */
.tabla-scroll{overflow-x:auto;}

/* Barra para correr la tabla a los costados, arriba de todo.
   Queda pegada abajo de la barra superior, así se puede usar sin
   tener que bajar hasta el final del listado. */
.scroll-arriba{
  position:sticky; z-index:16;
  overflow-x:auto; overflow-y:hidden;
  background:var(--gris-1);
  border-bottom:1px solid var(--gris-2);
}
.scroll-arriba > div{height:1px;}
.scroll-arriba::-webkit-scrollbar{height:13px;}
.scroll-arriba::-webkit-scrollbar-track{background:var(--gris-2);border-radius:7px;}
.scroll-arriba::-webkit-scrollbar-thumb{
  background:var(--gris-4);border-radius:7px;border:3px solid var(--gris-2);
}
.scroll-arriba::-webkit-scrollbar-thumb:hover{background:var(--gris-5);}
.scroll-arriba{scrollbar-width:thin;scrollbar-color:var(--gris-4) var(--gris-2);}
table.tabla{width:100%;border-collapse:collapse;font-size:13px;}
table.tabla th{
  background:var(--gris-1);text-align:left;padding:9px 12px;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--gris-5);font-weight:700;
  border-bottom:1px solid var(--gris-3);white-space:nowrap;position:sticky;top:0;z-index:2;
}
table.tabla th.ord{cursor:pointer;user-select:none;}
table.tabla th.ord:hover{background:var(--gris-2);}
table.tabla th .flecha{color:var(--naranja);margin-left:3px;}
table.tabla td{padding:8px 12px;border-bottom:1px solid var(--gris-2);vertical-align:middle;}
table.tabla tbody tr:hover{background:#fbfcfe;}
table.tabla tbody tr.clickable{cursor:pointer;}
table.tabla .num-col{text-align:right;font-variant-numeric:tabular-nums;}
.serie{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--azul);}
.vacio{padding:44px 20px;text-align:center;color:var(--gris-4);}
.vacio .grande{font-size:34px;margin-bottom:8px;opacity:.4;}

/* ─────────── Colores de estado ───────────
   Cada color define tres cosas: la etiqueta (pill), el tinte de la fila
   en el listado y el punto de color del selector. Se agregan o cambian
   desde Catálogos → Listas del formulario. */
.pill{
  display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;font-weight:600;
  white-space:nowrap;border:1px solid transparent;
}

.pill-blanco  {background:#fff;      color:var(--gris-5); border-color:var(--gris-3);}
.pill-gris    {background:#eceef2;   color:#5b6373;}
.pill-verde   {background:#dcf3e6;   color:#14653e;}
.pill-lima    {background:#e9f5cd;   color:#4c6b15;}
.pill-celeste {background:#d8f0f8;   color:#0e5c74;}
.pill-azul    {background:#dfeafa;   color:#12355b;}
.pill-violeta {background:#eae2f8;   color:#523096;}
.pill-rosa    {background:#fbe1ee;   color:#8c2560;}
.pill-rojo    {background:#fbe0dc;   color:#a12a1a;}
.pill-naranja {background:#fdead6;   color:#a5540f;}
.pill-amarillo{background:#fdf1d3;   color:#7a5210;}
.pill-marron  {background:#eee5da;   color:#6b4c2a;}

/* Tinte de fila + barra de color al costado */
tr.fila-blanco  {--tinte:#ffffff; --acento:var(--gris-3);}
tr.fila-gris    {--tinte:#f5f6f8; --acento:#9aa1ae;}
tr.fila-verde   {--tinte:#f1fbf6; --acento:#1e8e5a;}
tr.fila-lima    {--tinte:#f7fbec; --acento:#7ba321;}
tr.fila-celeste {--tinte:#eff9fc; --acento:#1596b8;}
tr.fila-azul    {--tinte:#f1f6fd; --acento:#1d4e89;}
tr.fila-violeta {--tinte:#f6f2fc; --acento:#7b5bc9;}
tr.fila-rosa    {--tinte:#fdf2f8; --acento:#c74e93;}
tr.fila-rojo    {--tinte:#fdf2f0; --acento:#c0392b;}
tr.fila-naranja {--tinte:#fef6ed; --acento:#e07b21;}
tr.fila-amarillo{--tinte:#fefaef; --acento:#d9a520;}
tr.fila-marron  {--tinte:#f9f6f2; --acento:#8a6540;}

table.tabla tbody tr[class*="fila-"] > td{background:var(--tinte);}
table.tabla tbody tr[class*="fila-"] > td:first-child{
  box-shadow:inset 3px 0 0 var(--acento);
}
/* El hover oscurece por encima, sin tapar el color del estado */
table.tabla tbody tr:hover > td{box-shadow:inset 0 0 0 9999px rgba(46,45,51,.05);}
table.tabla tbody tr[class*="fila-"]:hover > td:first-child{
  box-shadow:inset 3px 0 0 var(--acento), inset 0 0 0 9999px rgba(46,45,51,.05);
}

/* Los nombres de estado son largos ("Pendiente de autorización"). El
   desplegable ocupa toda la celda y nunca baja de un ancho legible: si la
   tabla no entra, se corre con la barra horizontal en vez de aplastar la
   columna. */
select.sel-estado{
  padding:3px 22px 3px 8px; font-size:12px; border-radius:11px; font-weight:600;
  width:100%; min-width:180px;
}
/* Las celdas de proceso y estado de pago no se dejan comprimir. */
table.tabla td:has(> select.sel-estado){min-width:190px;}

/* Muestra de color en Catálogos */
.muestra-color{
  width:20px;height:20px;border-radius:5px;border:1px solid var(--gris-3);
  display:inline-block;vertical-align:middle;cursor:pointer;
}
.paleta{display:flex;gap:6px;flex-wrap:wrap;}
.paleta button{
  width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0;
}
.paleta button.elegido{border-color:var(--gris-6);}

/* ─────────── Filtros ─────────── */
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:end;}
.filtros .campo span{font-size:11.5px;}
.barra-buscar{position:relative;}
.barra-buscar input{padding-left:32px;}
.barra-buscar::before{content:"\2315";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gris-4);font-size:17px;}

/* ─────────── Paginación ─────────── */
.paginacion{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid var(--gris-2);flex-wrap:wrap;}
.paginacion .info{font-size:12.5px;color:var(--gris-5);}
.paginacion .ctrl{display:flex;align-items:center;gap:6px;}
.paginacion .ctrl button{padding:5px 10px;font-size:12.5px;}
.paginacion .pag-num{font-size:12.5px;color:var(--gris-5);padding:0 6px;}

/* ─────────── Formulario de venta ─────────── */
.seccion{border-top:1px solid var(--gris-2);}
.seccion:first-child{border-top:none;}
.seccion-cab{
  padding:13px 18px;display:flex;align-items:center;gap:10px;background:#fbfcfe;
  font-weight:700;font-size:13.5px;color:var(--azul);
}
.seccion-cab .n{
  width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--azul);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;
}
.seccion-cuerpo{padding:18px;}
.fila-accesorio{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;align-items:end;margin-bottom:10px;}
.fila-unidad{border:1px solid var(--gris-3);border-radius:var(--radio);margin-bottom:14px;overflow:hidden;}
.fila-unidad > .cab{
  background:var(--gris-1);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-weight:700;font-size:13px;cursor:pointer;
}
.fila-unidad > .cuerpo{padding:16px;border-top:1px solid var(--gris-2);}
.acciones-form{display:flex;gap:10px;justify-content:flex-end;padding:16px 18px;border-top:1px solid var(--gris-2);background:var(--gris-1);flex-wrap:wrap;}
.zona-pdf{
  border:2px dashed var(--gris-3);border-radius:var(--radio);padding:26px;text-align:center;
  cursor:pointer;transition:border-color .15s,background .15s;color:var(--gris-5);
}
.zona-pdf:hover,.zona-pdf.sobre{border-color:var(--azul-cla);background:#fdf6f6;}
.zona-pdf .ico{font-size:30px;margin-bottom:6px;opacity:.5;}
.pdf-cargado{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--gris-3);border-radius:var(--radio);background:var(--gris-1);flex-wrap:wrap;}
.pdf-cargado .nom{font-weight:600;flex:1;min-width:140px;word-break:break-all;}
.total-caja{background:var(--gris-1);border:1px solid var(--gris-3);border-radius:var(--radio);padding:14px 16px;}
.total-linea{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;}
.total-linea.grande{border-top:1px solid var(--gris-3);margin-top:7px;padding-top:9px;font-size:16px;font-weight:700;color:var(--azul);}

/* ─────────── Detalle ─────────── */
.detalle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.detalle-item .rot{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--gris-4);font-weight:700;margin-bottom:2px;}
.detalle-item .val{font-size:13.5px;word-break:break-word;}
.detalle-item .val.vacia{color:var(--gris-4);font-style:italic;}

/* ─────────── Alertas / avisos ─────────── */
.alerta{padding:11px 14px;border-radius:var(--radio-chico);font-size:13px;border:1px solid transparent;line-height:1.5;}
.alerta-error{background:#fbe6e3;color:#8e2a1e;border-color:#f0c0b8;}
.alerta-ok{background:#e0f2e9;color:#14653e;border-color:#b6dfc9;}
.alerta-info{background:#e2ecf8;color:#123a63;border-color:#bcd3ea;}
.alerta-aviso{background:#fdf3dc;color:#7a5210;border-color:#eddcb4;}
#avisos{padding:0 26px;}
#avisos .alerta{margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;}

/* ─────────── Modal ─────────── */
.modal-fondo{
  position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{
  background:#fff;border-radius:var(--radio);box-shadow:var(--sombra-md);
  width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;
}
.modal.ancho{max-width:1060px;}
.modal-cab{padding:15px 20px;border-bottom:1px solid var(--gris-2);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-cab h3{margin:0;font-size:16px;}
.modal-cuerpo{padding:20px;overflow-y:auto;flex:1;}
.modal-pie{padding:13px 20px;border-top:1px solid var(--gris-2);display:flex;justify-content:flex-end;gap:9px;background:var(--gris-1);flex-wrap:wrap;}
.modal-pie:empty{display:none;}

/* ─────────── Visor PDF ─────────── */
.visor{background:#fff;border-radius:var(--radio);width:100%;max-width:1200px;height:92vh;display:flex;flex-direction:column;box-shadow:var(--sombra-md);}
.visor-acciones{display:flex;align-items:center;gap:10px;}
#visor-iframe{flex:1;width:100%;border:none;border-radius:0 0 var(--radio) var(--radio);background:var(--gris-2);}

/* ─────────── Toasts ─────────── */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:360px;}
.toast{
  background:var(--gris-6);color:#fff;padding:12px 15px;border-radius:var(--radio-chico);
  box-shadow:var(--sombra-md);font-size:13.5px;animation:entrar .2s ease;line-height:1.45;
}
.toast.ok{background:var(--verde);} .toast.error{background:var(--rojo);} .toast.aviso{background:var(--amarillo);}
@keyframes entrar{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ─────────── Barra de progreso ─────────── */
.progreso{height:9px;background:var(--gris-2);border-radius:5px;overflow:hidden;}
.progreso > div{height:100%;background:var(--naranja);width:0;transition:width .15s;}

/* ─────────── Fotos ─────────── */
.fotos-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.foto{
  position:relative;aspect-ratio:4/3;border-radius:var(--radio);overflow:hidden;
  border:1px solid var(--gris-3);background:var(--gris-2);cursor:pointer;
}
.foto img{width:100%;height:100%;object-fit:cover;display:block;}
.foto .quitar{
  position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;border:none;cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.foto .quitar:hover{background:var(--rojo);}
.foto .pie{
  position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.68));
  color:#fff;font-size:10.5px;padding:14px 6px 4px;
}
.botones-foto{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
.visor-foto{max-width:100%;max-height:86vh;display:block;margin:0 auto;border-radius:var(--radio);}

/* ─────────── Garantía ─────────── */
.garantia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;}
.garantia .barra{width:42px;height:5px;border-radius:3px;background:var(--gris-2);overflow:hidden;}
.garantia .barra > i{display:block;height:100%;border-radius:3px;}
.garantia.viva{color:var(--verde);}    .garantia.viva .barra > i{background:var(--verde);}
.garantia.porvencer{color:var(--amarillo);} .garantia.porvencer .barra > i{background:var(--amarillo);}
.garantia.vencida{color:var(--gris-4);}

/* ─────────── Buscador de equipo / venta ─────────── */
.resultado-busqueda{
  border:1px solid var(--gris-3);border-radius:var(--radio);max-height:300px;overflow:auto;
}
.resultado-busqueda .item{
  padding:10px 13px;border-bottom:1px solid var(--gris-2);cursor:pointer;display:flex;
  justify-content:space-between;gap:12px;align-items:center;
}
.resultado-busqueda .item:last-child{border-bottom:none;}
.resultado-busqueda .item:hover{background:var(--gris-1);}
.tarjeta-elegida{
  border:1px solid var(--azul-cla);background:#fdf6f6;border-radius:var(--radio);padding:14px 16px;
  display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;
}

/* ═══════════════════════════════════════════════════════
   Hoja para fábrica
   Se arma en un contenedor aparte que en pantalla está oculto;
   al imprimir se esconde todo lo demás y queda solo la hoja.
   ═══════════════════════════════════════════════════════ */
#hoja-impresion{display:none;}

.hoja{
  font-family:var(--fuente); color:#000; background:#fff;
  width:190mm; padding:0; margin:0 auto;
}
.hoja-cab{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  border-bottom:3px solid #000; padding-bottom:8px; margin-bottom:14px;
}
.hoja-cab img{height:52px;width:auto;}
.hoja-cab .tit{text-align:right;}
.hoja-cab .tit h1{margin:0;font-size:19pt;letter-spacing:.5px;text-transform:uppercase;}
.hoja-cab .tit p{margin:2px 0 0;font-size:9.5pt;}

.hoja table{width:100%;border-collapse:collapse;margin-bottom:12px;}
.hoja table td{border:1.5px solid #000;padding:7px 10px;font-size:12pt;vertical-align:middle;}
.hoja table td.rot{
  width:38mm;background:#e9e9e9;font-size:9pt;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
}
.hoja table td.val{font-weight:600;min-height:26px;}
.hoja table td.val.grande{font-size:15pt;}

.hoja .tildes{display:flex;gap:26px;flex-wrap:wrap;}
.hoja .tilde{display:flex;align-items:center;gap:7px;font-size:11.5pt;font-weight:600;}
.hoja .caja-tilde{
  width:16px;height:16px;border:2px solid #000;display:inline-block;
  text-align:center;line-height:13px;font-size:13px;font-weight:900;
}
.hoja .bloque-libre{border:1.5px solid #000;padding:8px 10px;margin-bottom:12px;min-height:22mm;}
.hoja .bloque-libre .rot{
  font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;
}
.hoja .bloque-libre .txt{font-size:11.5pt;white-space:pre-wrap;line-height:1.45;}
.hoja-pie{
  margin-top:14px;border-top:1.5px solid #000;padding-top:6px;
  display:flex;justify-content:space-between;font-size:8.5pt;
}
.hoja-firmas{display:flex;gap:20mm;margin-top:16mm;}
.hoja-firmas div{flex:1;border-top:1.5px solid #000;padding-top:4px;font-size:9pt;text-align:center;}

@media print{
  @page{size:A4 portrait;margin:12mm 10mm;}
  body{background:#fff;}
  body > *{display:none !important;}
  #hoja-impresion{display:block !important;}
  .hoja{width:auto;}
  .hoja table td{border-color:#000;}
}

/* ─────────── Varios ─────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.celda-obs{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip{padding:3px 9px;background:var(--gris-2);border-radius:11px;font-size:12px;}
.sep{height:1px;background:var(--gris-2);margin:16px 0;}
.txt-chico{font-size:12px;color:var(--gris-4);}
.txt-der{text-align:right;}
.nowrap{white-space:nowrap;}
.mt0{margin-top:0;} .mb0{margin-bottom:0;}
.fila-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
</style>
</head>
<body>

<!-- ══════════════ PANTALLA DE CARGA ══════════════ -->
<div id="cargando" class="pantalla-carga">
  <div class="spinner"></div>
  <p>Iniciando sistema…</p>
</div>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="pantalla-login" class="login-wrap oculto">
  <form class="login-card" id="form-login" autocomplete="off">
    <img id="logo-login" class="logo-login" alt="REFIRE — Desarrollos Hidromecánicos">
    <p class="login-sub">Sistema de Ventas</p>
    <div class="login-sep"></div>

    <label class="campo">
      <span>Usuario</span>
      <input type="text" id="login-usuario" autocomplete="username" required autofocus>
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input type="password" id="login-clave" autocomplete="current-password" required>
    </label>

    <div id="login-error" class="alerta alerta-error oculto"></div>

    <button type="submit" class="btn btn-primario btn-block">Ingresar</button>

    <p class="login-pie" id="login-pie"></p>
  </form>
</div>

<!-- ══════════════ APLICACIÓN ══════════════ -->
<div id="app" class="app oculto">

  <!-- Barra lateral -->
  <aside class="lateral">
    <div class="lateral-marca">
      <img id="logo-iso" class="logo-iso" alt="REFIRE">
      <div class="lateral-marca-txt">
        <strong>REFIRE</strong>
        <span>Sistema de Ventas</span>
      </div>
    </div>

    <nav class="nav" id="nav"><!-- generado por JS --></nav>

    <div class="lateral-pie">
      <div class="usuario-box">
        <div class="avatar" id="usr-avatar">—</div>
        <div class="usuario-datos">
          <strong id="usr-nombre">—</strong>
          <span id="usr-rol">—</span>
        </div>
      </div>
      <button class="btn btn-fantasma btn-block" id="btn-salir">Cerrar sesión</button>
      <div class="version" id="pie-almacenamiento"></div>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="contenido">
    <header class="topbar">
      <div>
        <h2 id="titulo-vista">Consultas</h2>
        <p id="subtitulo-vista" class="sub"></p>
      </div>
      <div class="topbar-acciones" id="topbar-acciones"></div>
    </header>

    <div id="avisos"></div>
    <section id="vista" class="vista"><!-- generado por JS --></section>
  </main>
</div>

<!-- ══════════════ MODAL GENÉRICO ══════════════ -->
<div id="modal-fondo" class="modal-fondo oculto">
  <div class="modal" id="modal">
    <header class="modal-cab">
      <h3 id="modal-titulo">—</h3>
      <button class="btn-x" id="modal-cerrar" title="Cerrar">&times;</button>
    </header>
    <div class="modal-cuerpo" id="modal-cuerpo"></div>
    <footer class="modal-pie" id="modal-pie"></footer>
  </div>
</div>

<!-- ══════════════ VISOR DE PDF ══════════════ -->
<div id="visor-fondo" class="modal-fondo oculto">
  <div class="visor">
    <header class="modal-cab">
      <h3 id="visor-titulo">Planilla de medidas</h3>
      <div class="visor-acciones">
        <button class="btn btn-chico" id="visor-nueva">Abrir en pestaña nueva</button>
        <button class="btn-x" id="visor-cerrar" title="Cerrar">&times;</button>
      </div>
    </header>
    <iframe id="visor-iframe" title="Vista previa del PDF"></iframe>
    <div id="visor-imagen" class="oculto" style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--gris-6);padding:14px">
      <img id="visor-img" class="visor-foto" alt="Foto">
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<!-- ══════════════ HOJA PARA FÁBRICA (solo se ve al imprimir) ══════════════ -->
<div id="hoja-impresion"></div>

<!-- ══════════════ SCRIPTS (orden importante) ══════════════ -->

(function (global) {

  U.$  = function (sel, ctx) { return (ctx || document).querySelector(sel); };

  U.el = function (tag, attrs, hijos) {
    var e = document.createElement(tag);
    if (attrs) {

        if (k === 'class') e.className = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else if (k === 'text') e.textContent = attrs[k];
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);

  /* ───── Fechas ───── */
  U.hoyISO = function () {
    var d = new Date();
    return U.aISO(d);

  U.aISO = function (d) {
    if (!d) return '';
    if (typeof d === 'string') return d.slice(0, 10);
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');

  U.fechaHora = function (iso) {

  /* ───── Utilidades varias ───── */
  U.debounce = function (fn, ms) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms || 250);
    };
  };

  U.clonar = function (o) { return JSON.parse(JSON.stringify(o)); };

  /** Ordena un array por clave, devolviendo copia. dir: 1 asc, -1 desc. */
  U.ordenarPor = function (arr, clave, dir) {
    var d = dir === -1 ? -1 : 1;
    return arr.slice().sort(function (a, b) {
      var va = a[clave], vb = b[clave];
      if (va === null || va === undefined) va = '';
      if (vb === null || vb === undefined) vb = '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * d;
      va = U.norm(va); vb = U.norm(vb);
      if (va < vb) return -1 * d;
      if (va > vb) return 1 * d;
      return 0;
    });
  };

  /* ───── Garantía ───── */

  /**
   * Calcula el estado de la garantía de un equipo.
   * Arranca el día de la entrega y dura los días que se hayan cargado.
   * Devuelve null si todavía no se cargó ninguno de los dos datos.
   */
  U.garantia = function (fechaEntrega, dias) {
    if (!fechaEntrega || !dias || isNaN(Number(dias))) return null;
    var vence = U.sumarDias(fechaEntrega, Number(dias));
    if (!vence) return null;

    var hoy = U.hoyISO();
    var restantes = U.diasEntre(hoy, vence);
    var total = Number(dias);

    return {
      vence: vence,
      total: total,
      restantes: restantes,
      vencida: restantes < 0,
      porVencer: restantes >= 0 && restantes <= 30,
      // Porcentaje de garantía que queda, para la barrita del listado.
      porcentaje: Math.max(0, Math.min(100, Math.round(restantes / total * 100)))
    };
  };

  /** Días de diferencia entre dos fechas ISO (b - a). */
  U.diasEntre = function (a, b) {
    if (!a || !b) return 0;
    var pa = String(a).slice(0, 10).split('-');
    var pb = String(b).slice(0, 10).split('-');
    var da = Date.UTC(Number(pa[0]), Number(pa[1]) - 1, Number(pa[2]));
    var db = Date.UTC(Number(pb[0]), Number(pb[1]) - 1, Number(pb[2]));
    return Math.round((db - da) / 86400000);
  };

  /* ───── Imágenes ───── */

  /**
   * Achica y recomprime una foto antes de guardarla.
   * Una foto de celular pesa 3–5 MB; así queda en 200–400 KB sin que
   * se note la diferencia en pantalla. Sin esto, veinte fotos llenan
   * el espacio de guardado del navegador.
   */
  U.comprimirImagen = function (file, ladoMax, calidad) {
    ladoMax = ladoMax || 1600;
    calidad = calidad || 0.82;

    if (!/^image\//.test(file.type)) return Promise.resolve(file);

    return cargarImagen(file).then(function (img) {
      var ancho = img.width, alto = img.height;
      if (!ancho || !alto) throw new Error('sin dimensiones');

      var escala = Math.min(1, ladoMax / Math.max(ancho, alto));
      var w = Math.round(ancho * escala), h = Math.round(alto * escala);

      var lienzo = document.createElement('canvas');
      lienzo.width = w; lienzo.height = h;
      var ctx = lienzo.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      if (img.close) img.close();

      return new Promise(function (res) {
        lienzo.toBlob(function (blob) {
          // Si comprimir no achicó nada, se guarda el original.
          if (!blob || blob.size >= file.size) res(file);
          else res(new File([blob], renombrarJpg(file.name), { type: 'image/jpeg' }));
        }, 'image/jpeg', calidad);
      });
    }).catch(function () {
      return file;   // ante cualquier problema, se guarda tal cual vino
    });
  };

  function cargarImagen(file) {
    if (global.createImageBitmap) {
      return global.createImageBitmap(file).catch(function () { return porEtiqueta(file); });
    }
    return porEtiqueta(file);
  }

  function porEtiqueta(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); res(img); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('no se pudo leer la imagen')); };
      img.src = url;
    });
  }

  function renombrarJpg(nombre) {
    return String(nombre || 'foto').replace(/\.[^.]+$/, '') + '.jpg';
  }

  /* ───── Toasts ───── */
  U.toast = function (msg, tipo, ms) {
    var cont = document.getElementById('toasts');
    if (!cont) return;
    var t = U.el('div', { class: 'toast ' + (tipo || ''), text: msg });
    cont.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s';
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 320);
    }, ms || 3200);
  };

  /* ───── Modal genérico ───── */
  U.modal = function (opts) {
    var fondo = document.getElementById('modal-fondo');
    var caja  = document.getElementById('modal');
    var cuerpo = document.getElementById('modal-cuerpo');
    var pie   = document.getElementById('modal-pie');

    document.getElementById('modal-titulo').textContent = opts.titulo || '';
    cuerpo.innerHTML = '';
    if (typeof opts.cuerpo === 'string') cuerpo.innerHTML = opts.cuerpo;
    else if (opts.cuerpo) cuerpo.appendChild(opts.cuerpo);

    pie.innerHTML = '';
    (opts.botones || []).forEach(function (b) {
      var btn = U.el('button', { class: 'btn ' + (b.clase || 'btn-borde'), text: b.texto });
      btn.addEventListener('click', function () {
        if (b.accion) {
          var r = b.accion();
          if (r === false) return;
        }
        if (b.cierra !== false) U.cerrarModal();
      });
      pie.appendChild(btn);
    });

    caja.classList.toggle('ancho', !!opts.ancho);
    fondo.classList.remove('oculto');
    if (opts.alAbrir) opts.alAbrir(cuerpo);
    return cuerpo;
  };

  U.cerrarModal = function () {
    document.getElementById('modal-fondo').classList.add('oculto');
    document.getElementById('modal-cuerpo').innerHTML = '';
  };

  U.confirmar = function (titulo, mensaje, alAceptar, textoAceptar, clase) {
    U.modal({
      titulo: titulo,
      cuerpo: '<p style="margin:0;line-height:1.6">' + U.esc(mensaje) + '</p>',
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        { texto: textoAceptar || 'Confirmar', clase: clase || 'btn-peligro', accion: alAceptar }
      ]
    });
  };

  /* ───── Descargar archivo generado en el navegador ───── */
  U.descargar = function (nombre, contenido, tipo) {
    var blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = U.el('a', { href: url, download: nombre });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  };

  /** Arma un CSV con BOM para que Excel respete los acentos. */
  U.aCSV = function (encabezados, filas) {
    function celda(v) {
      var s = (v === null || v === undefined) ? '' : String(v);
      return '"' + s.replace(/"/g, '""') + '"';
    }
    var lineas = [encabezados.map(celda).join(';')];
    filas.forEach(function (f) { lineas.push(f.map(celda).join(';')); });
    // ﻿ = BOM, para que Excel abra el CSV respetando los acentos.
    return '﻿' + lineas.join('\r\n');
  };

  global.U = U;
})(window);

/* ───────── app/js/store.js ───────── */
/* ═══════════════════════════════════════════════════════
   store.js — capa de datos

   Usa IndexedDB. Si el navegador la bloquea (pasa a veces abriendo
   el archivo directo con file://), cae automáticamente a localStorage.

   Toda la API es asíncrona a propósito: el día que esto pase a tener
   servidor, se reemplaza el interior de estas funciones por fetch()
   y el resto del sistema no se entera.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  var NOMBRE_DB = 'hidromecanica';
  var VERSION_DB = 2;
  var TIENDAS = ['usuarios', 'clientes', 'equipos', 'accesorios', 'ventas',
                 'ingresos', 'reparaciones', 'archivos', 'config', 'bitacora'];
  var CLAVE_LS = 'hidromecanica_datos';

  var db = null;
  var modo = 'idb';           // 'idb' | 'ls' | 'memoria'
  var memoria = null;         // en modo 'ls' y 'memoria'
  var guardarLSPendiente = null;

  var Store = { modo: 'idb', tiendas: TIENDAS };

  /* ═══════════ Arranque ═══════════ */

  Store.init = function () {
    return abrirIDB().then(function () {
      modo = 'idb';
      Store.modo = 'idb';
    }).catch(function (e) {
      console.warn('IndexedDB no disponible, se usa localStorage:', e && e.message);
      modo = 'ls';
      Store.modo = 'ls';
      cargarLS();
    });
  };

  function abrirIDB() {
    return new Promise(function (res, rej) {
      var pedido;
      try {
        if (!global.indexedDB) return rej(new Error('sin indexedDB'));
        pedido = global.indexedDB.open(NOMBRE_DB, VERSION_DB);
      } catch (e) { return rej(e); }

      var listo = false;
      // Si el navegador ni responde (algunos casos con file://), no colgarse.
      var reloj = setTimeout(function () {
        if (!listo) rej(new Error('timeout abriendo IndexedDB'));
      }, 3000);

      pedido.onupgradeneeded = function (ev) {
        var d = ev.target.result;
        TIENDAS.forEach(function (t) {
          if (!d.objectStoreNames.contains(t)) d.createObjectStore(t, { keyPath: 'id' });
        });
      };
      pedido.onsuccess = function (ev) {
        listo = true; clearTimeout(reloj);
        db = ev.target.result;
        res();
      };
      pedido.onerror = function () {
        listo = true; clearTimeout(reloj);
        rej(pedido.error || new Error('error abriendo IndexedDB'));
      };
      pedido.onblocked = function () {
        listo = true; clearTimeout(reloj);
        rej(new Error('IndexedDB bloqueada por otra pestaña'));
      };
    });
  }

  /* ═══════════ Respaldo en localStorage ═══════════ */

  function cargarLS() {
    memoria = {};
    TIENDAS.forEach(function (t) { memoria[t] = {}; });

    // Primero se comprueba que localStorage exista Y se pueda escribir.
    // Hay contextos (ventanas privadas, políticas de la empresa) donde
    // está presente pero tirar de él lanza excepción.
    try {
      global.localStorage.setItem('hm_prueba', '1');
      global.localStorage.removeItem('hm_prueba');
    } catch (e) {
      modo = 'memoria';
      Store.modo = 'memoria';
      console.error('El navegador no permite guardar nada:', e && e.message);
      return;
    }

    try {
      var crudo = global.localStorage.getItem(CLAVE_LS);
      if (crudo) {
        var obj = JSON.parse(crudo);
        TIENDAS.forEach(function (t) { if (obj[t]) memoria[t] = obj[t]; });
      }
    } catch (e) {
      console.warn('No se pudo leer el guardado anterior:', e);
    }
  }

  function guardarLS() {
    if (modo === 'memoria') return;      // no hay dónde guardar
    // Se agrupa: si entran 3600 registros de golpe no serializamos 3600 veces.
    if (guardarLSPendiente) return;
    guardarLSPendiente = setTimeout(function () {
      guardarLSPendiente = null;
      try {
        global.localStorage.setItem(CLAVE_LS, JSON.stringify(memoria));
      } catch (e) {
        var lleno = e && (e.name === 'QuotaExceededError' || e.code === 22);
        console.error('No se pudo guardar:', e);
        if (global.U) {
          U.toast(lleno
            ? 'No hay más espacio de guardado en el navegador. Exportá un respaldo y borrá los PDF viejos.'
            : 'El navegador rechazó el guardado. Exportá un respaldo antes de cerrar.', 'error', 9000);
        }
      }
    }, 120);
  }

  /* ═══════════ Operaciones ═══════════ */

  function tx(tienda, modoTx) {
    return db.transaction(tienda, modoTx).objectStore(tienda);
  }

  function pedir(req) {
    return new Promise(function (res, rej) {
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }

  /** Devuelve todos los registros de una tienda. */
  Store.all = function (tienda) {
    if (modo !== 'idb') {
      return Promise.resolve(Object.keys(memoria[tienda] || {}).map(function (k) {
        return memoria[tienda][k];
      }));
    }
    return pedir(tx(tienda, 'readonly').getAll());
  };

  Store.get = function (tienda, id) {
    if (modo !== 'idb') return Promise.resolve((memoria[tienda] || {})[id] || null);
    return pedir(tx(tienda, 'readonly').get(id)).then(function (r) { return r || null; });
  };

  Store.put = function (tienda, obj) {
    if (!obj.id) obj.id = U.id(tienda.slice(0, 3));
    if (modo !== 'idb') {
      if (!memoria[tienda]) memoria[tienda] = {};
      memoria[tienda][obj.id] = obj;
      guardarLS();
      return Promise.resolve(obj);
    }
    return pedir(tx(tienda, 'readwrite').put(obj)).then(function () { return obj; });
  };

  /** Guarda muchos registros en una sola transacción. */
  Store.bulk = function (tienda, arr) {
    if (!arr.length) return Promise.resolve(0);
    if (modo !== 'idb') {
      if (!memoria[tienda]) memoria[tienda] = {};
      arr.forEach(function (o) {
        if (!o.id) o.id = U.id(tienda.slice(0, 3));
        memoria[tienda][o.id] = o;
      });
      guardarLS();
      return Promise.resolve(arr.length);
    }
    return new Promise(function (res, rej) {
      var t = db.transaction(tienda, 'readwrite');
      var st = t.objectStore(tienda);
      arr.forEach(function (o) {
        if (!o.id) o.id = U.id(tienda.slice(0, 3));
        st.put(o);
      });
      t.oncomplete = function () { res(arr.length); };
      t.onerror = function () { rej(t.error); };
      t.onabort = function () { rej(t.error || new Error('transacción abortada')); };
    });
  };

  Store.del = function (tienda, id) {
    if (modo !== 'idb') {
      if (memoria[tienda]) delete memoria[tienda][id];
      guardarLS();
      return Promise.resolve();
    }
    return pedir(tx(tienda, 'readwrite').delete(id));
  };

  Store.clear = function (tienda) {
    if (modo !== 'idb') {
      memoria[tienda] = {};
      guardarLS();
      return Promise.resolve();
    }
    return pedir(tx(tienda, 'readwrite').clear());
  };

  /* ═══════════ Config (pares clave/valor) ═══════════ */

  Store.getConfig = function (clave, porDefecto) {
    return Store.get('config', clave).then(function (r) {
      return r ? r.valor : porDefecto;
    });
  };

  Store.setConfig = function (clave, valor) {
    return Store.put('config', { id: clave, valor: valor });
  };

  /* ═══════════ Archivos (PDF de planillas) ═══════════ */

  /**
   * Guarda un PDF. En modo IndexedDB se guarda el Blob tal cual;
   * en localStorage hay que pasarlo a base64 (ocupa ~33% más).
   */
  Store.guardarArchivo = function (file) {
    var reg = {
      id: U.id('arch'),
      nombre: file.name,
      tipo: file.type || 'application/pdf',
      tamano: file.size,
      subidoEn: new Date().toISOString()
    };
    if (modo === 'idb') {
      reg.blob = file;
      return Store.put('archivos', reg).then(function () { return reg.id; });
    }
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        reg.datos = fr.result;             // data:application/pdf;base64,...
        Store.put('archivos', reg).then(function () { res(reg.id); }, rej);
      };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(file);
    });
  };

  /** Devuelve {nombre, tamano, url} con una URL usable en un <iframe>. */
  Store.urlArchivo = function (id) {
    return Store.get('archivos', id).then(function (reg) {
      if (!reg) return null;
      var url;
      if (reg.blob) url = URL.createObjectURL(reg.blob);
      else if (reg.datos) url = reg.datos;
      else return null;
      return { nombre: reg.nombre, tamano: reg.tamano, url: url, esObjeto: !!reg.blob };
    });
  };

  /* ═══════════ Respaldo completo ═══════════ */

  /** Exporta todo (menos los PDF) a un objeto serializable. */
  Store.exportar = function () {
    var salida = { _sistema: 'hidromecanica', _version: 1, _fecha: new Date().toISOString() };
    var tiendas = TIENDAS.filter(function (t) { return t !== 'archivos'; });
    return Promise.all(tiendas.map(function (t) {
      return Store.all(t).then(function (r) { salida[t] = r; });
    })).then(function () { return salida; });
  };

  /** Importa un respaldo. modo 'reemplazar' borra lo anterior. */
  Store.importar = function (obj, modoImp) {
    if (!obj || obj._sistema !== 'hidromecanica') {
      return Promise.reject(new Error('El archivo no es un respaldo válido del sistema.'));
    }
    var tiendas = TIENDAS.filter(function (t) { return t !== 'archivos' && Array.isArray(obj[t]); });
    var cadena = Promise.resolve();
    tiendas.forEach(function (t) {
      cadena = cadena.then(function () {
        return (modoImp === 'reemplazar' ? Store.clear(t) : Promise.resolve())
          .then(function () { return Store.bulk(t, obj[t]); });
      });
    });
    return cadena;
  };

  /** Borra absolutamente todo. */
  Store.borrarTodo = function () {
    return Promise.all(TIENDAS.map(function (t) { return Store.clear(t); }));
  };

  global.Store = Store;
})(window);

/* ───────── app/js/auth.js ───────── */
/* ═══════════════════════════════════════════════════════
   auth.js — usuarios, ingreso y permisos

   Roles:
     'vendedor' → carga ventas, consulta el listado, ve clientes.
     'dueno'    → todo lo anterior + Autorizar, Usuarios,
                  Importar y edición de estados.

   Las contraseñas se guardan hasheadas (SHA-256 con sal por usuario),
   nunca en texto plano.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  var Auth = {};
  var CLAVE_SESION = 'hidromecanica_sesion';
  var SAL = 'hm.v1.';

  Auth.usuario = null;

  /* ───── Hash ───── */
  Auth.hash = function (texto) {
    var dato = SAL + texto;
    if (global.crypto && global.crypto.subtle && global.TextEncoder) {
      try {
        return global.crypto.subtle
          .digest('SHA-256', new TextEncoder().encode(dato))
          .then(function (buf) {
            return Array.prototype.map.call(new Uint8Array(buf), function (b) {
              return b.toString(16).padStart(2, '0');
            }).join('');
          })
          .catch(function () { return Promise.resolve(hashSimple(dato)); });
      } catch (e) { /* sigue al respaldo */ }
    }
    return Promise.resolve(hashSimple(dato));
  };

  // Respaldo para contextos donde crypto.subtle no está disponible.
  function hashSimple(s) {
    var h1 = 0x811c9dc5, h2 = 0x1000193;
    for (var i = 0; i < s.length; i++) {
      h1 ^= s.charCodeAt(i); h1 = (h1 * 0x01000193) >>> 0;
      h2 = ((h2 << 5) - h2 + s.charCodeAt(i)) >>> 0;
    }
    return 'sf' + h1.toString(16) + h2.toString(16);
  }

  /* ───── Ingreso ───── */
  Auth.ingresar = function (usuario, clave) {
    var u = U.norm(usuario);
    return Store.all('usuarios').then(function (todos) {
      var encontrado = todos.filter(function (x) { return U.norm(x.usuario) === u; })[0];
      if (!encontrado) throw new Error('Usuario o contraseña incorrectos.');
      if (!encontrado.activo) throw new Error('Ese usuario está desactivado. Hablá con Gerencia.');
      return Auth.hash(clave).then(function (h) {
        if (h !== encontrado.clave) throw new Error('Usuario o contraseña incorrectos.');
        Auth.usuario = encontrado;
        try {
          global.localStorage.setItem(CLAVE_SESION, JSON.stringify({
            id: encontrado.id, desde: Date.now()
          }));
        } catch (e) { /* sin persistencia de sesión, no es grave */ }
        return encontrado;
      });
    });
  };

  /** Intenta recuperar la sesión guardada. Devuelve el usuario o null. */
  Auth.restaurar = function () {
    var crudo;
    try { crudo = global.localStorage.getItem(CLAVE_SESION); } catch (e) { return Promise.resolve(null); }
    if (!crudo) return Promise.resolve(null);
    var s;
    try { s = JSON.parse(crudo); } catch (e) { return Promise.resolve(null); }
    if (!s || !s.id) return Promise.resolve(null);
    return Store.get('usuarios', s.id).then(function (u) {
      if (u && u.activo) { Auth.usuario = u; return u; }
      return null;
    });
  };

  Auth.salir = function () {
    Auth.usuario = null;
    try { global.localStorage.removeItem(CLAVE_SESION); } catch (e) { /* nada */ }
  };

  /* ───── Permisos ───── */
  Auth.esDueno = function () {
    return !!(Auth.usuario && Auth.usuario.rol === 'dueno');
  };

  Auth.puede = function (accion) {
    if (!Auth.usuario) return false;
    var dueno = Auth.esDueno();
    switch (accion) {
      case 'autorizar':
      case 'cambiarEstado':
      case 'usuarios':
      case 'importar':
      case 'borrarVenta':
      case 'editarCatalogos':
        return dueno;
      case 'crearVenta':
      case 'verVentas':
      case 'clientes':
        return true;
      default:
        return dueno;
    }
  };

  Auth.rolTexto = function (rol) {
    return rol === 'dueno' ? 'Gerencia' : 'Vendedor';
  };

  /* ───── Alta / edición de usuarios ───── */
  Auth.crear = function (datos) {
    return Store.all('usuarios').then(function (todos) {
      var repetido = todos.some(function (x) { return U.norm(x.usuario) === U.norm(datos.usuario); });
      if (repetido) throw new Error('Ya existe un usuario con ese nombre de acceso.');
      return Auth.hash(datos.clave).then(function (h) {
        return Store.put('usuarios', {
          id: U.id('usr'),
          usuario: String(datos.usuario).trim(),
          nombre: String(datos.nombre).trim(),
          rol: datos.rol === 'dueno' ? 'dueno' : 'vendedor',
          clave: h,
          activo: true,
          creadoEn: new Date().toISOString()
        });
      });
    });
  };

  Auth.cambiarClave = function (idUsuario, claveNueva) {
    return Store.get('usuarios', idUsuario).then(function (u) {
      if (!u) throw new Error('Usuario inexistente.');
      return Auth.hash(claveNueva).then(function (h) {
        u.clave = h;
        u.claveInicial = false;
        return Store.put('usuarios', u);
      });
    });
  };

  global.Auth = Auth;
})(window);

/* ───────── app/js/xlsx.js ───────── */
/* ═══════════════════════════════════════════════════════
   xlsx.js — lector de Excel (.xlsx/.xlsm) y CSV

   Sin librerías externas. Un .xlsx es un ZIP con archivos XML
   adentro, así que acá se hace:
     1. leer el ZIP a mano (directorio central + headers locales)
     2. descomprimir con DecompressionStream('deflate-raw') del navegador
     3. parsear el XML de la hoja y de las cadenas compartidas

   Devuelve siempre: { tipo, hojas: [ { nombre, filas: [[celda,...]] } ] }
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  var Lector = {};

  /* ═══════════════ Entrada principal ═══════════════ */

  Lector.leer = function (file) {
    var nombre = (file.name || '').toLowerCase();
    if (/\.csv$|\.txt$/.test(nombre)) return leerCSV(file);
    if (/\.xlsx$|\.xlsm$/.test(nombre)) return leerXLSX(file);
    if (/\.xls$/.test(nombre)) {
      return Promise.reject(new Error(
        'El formato .xls viejo no se puede leer. Abrilo en Excel y guardalo como .xlsx ' +
        '(Archivo → Guardar como → Libro de Excel) o como CSV.'
      ));
    }
    return Promise.reject(new Error('Formato no reconocido. Usá un archivo .xlsx o .csv.'));
  };

  Lector.soportaXLSX = function () {
    return typeof global.DecompressionStream !== 'undefined';
  };

  /* ═══════════════ CSV ═══════════════ */

  function leerCSV(file) {
    return file.arrayBuffer().then(function (buf) {
      var texto = decodificar(buf);
      var filas = parsearCSV(texto);
      return { tipo: 'csv', hojas: [{ nombre: file.name, filas: filas }] };
    });
  }

  /** UTF-8 y, si sale con caracteres rotos, se reintenta como Windows-1252. */
  function decodificar(buf) {
    var t = new TextDecoder('utf-8').decode(buf);
    if (t.indexOf('�') !== -1) {
      try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) { /* queda utf-8 */ }
    }
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);   // BOM
    return t;
  }

  function detectarSeparador(texto) {
    var linea = texto.split(/\r?\n/)[0] || '';
    var fuera = true, cuenta = { ';': 0, ',': 0, '\t': 0 };
    for (var i = 0; i < linea.length; i++) {
      var c = linea[i];
      if (c === '"') fuera = !fuera;
      else if (fuera && cuenta[c] !== undefined) cuenta[c]++;
    }
    var mejor = ';', max = -1;
    Object.keys(cuenta).forEach(function (k) { if (cuenta[k] > max) { max = cuenta[k]; mejor = k; } });
    return max === 0 ? ';' : mejor;
  }

  function parsearCSV(texto) {
    var sep = detectarSeparador(texto);
    var filas = [], fila = [], campo = '', enComillas = false, i = 0;

    while (i < texto.length) {
      var c = texto[i];
      if (enComillas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i += 2; continue; }
          enComillas = false; i++; continue;
        }
        campo += c; i++; continue;
      }
      if (c === '"') { enComillas = true; i++; continue; }
      if (c === sep) { fila.push(campo); campo = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { fila.push(campo); filas.push(fila); fila = []; campo = ''; i++; continue; }
      campo += c; i++;
    }
    if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }

    // Se descartan las filas totalmente vacías del final.
    while (filas.length && filas[filas.length - 1].every(function (v) { return String(v).trim() === ''; })) {
      filas.pop();
    }
    return filas;
  }

  /* ═══════════════ XLSX ═══════════════ */

  function leerXLSX(file) {
    if (!Lector.soportaXLSX()) {
      return Promise.reject(new Error(
        'Este navegador no puede abrir archivos .xlsx. Probá con Google Chrome o Microsoft Edge ' +
        'actualizados, o guardá el Excel como CSV.'
      ));
    }
    return file.arrayBuffer()
      .then(function (buf) { return abrirZip(buf); })
      .then(function (zip) { return armarLibro(zip); });
  }

  /* ───── ZIP ───── */

  function abrirZip(buf) {
    var dv = new DataView(buf);
    var u8 = new Uint8Array(buf);

    // Fin del directorio central: se busca la firma desde el final.
    var eocd = -1;
    var desde = Math.max(0, u8.length - 66000);
    for (var p = u8.length - 22; p >= desde; p--) {
      if (dv.getUint32(p, true) === 0x06054b50) { eocd = p; break; }
    }
    if (eocd === -1) throw new Error('El archivo no parece un .xlsx válido (no se encontró el índice del ZIP).');

    var cantidad = dv.getUint16(eocd + 10, true);
    var inicioCD = dv.getUint32(eocd + 16, true);

    var entradas = {};
    var pos = inicioCD;
    for (var n = 0; n < cantidad; n++) {
      if (dv.getUint32(pos, true) !== 0x02014b50) break;
      var metodo   = dv.getUint16(pos + 10, true);
      var compSize = dv.getUint32(pos + 20, true);
      var rawSize  = dv.getUint32(pos + 24, true);
      var lenNom   = dv.getUint16(pos + 28, true);
      var lenExtra = dv.getUint16(pos + 30, true);
      var lenCom   = dv.getUint16(pos + 32, true);
      var offLocal = dv.getUint32(pos + 42, true);
      // Algunos generadores de ZIP guardan las rutas con barra invertida
      // (Excel usa barra normal, pero conviene aceptar las dos).
      var nombre = new TextDecoder('utf-8')
        .decode(u8.subarray(pos + 46, pos + 46 + lenNom))
        .replace(/\\/g, '/');

      entradas[nombre] = { metodo: metodo, compSize: compSize, rawSize: rawSize, offLocal: offLocal };
      pos += 46 + lenNom + lenExtra + lenCom;
    }

    return {
      /** Devuelve Promise<string> con el contenido de un archivo del ZIP. */
      texto: function (ruta) {
        var e = entradas[ruta];
        if (!e) return Promise.resolve(null);

        // El header local dice cuánto miden nombre y extra; los tamaños
        // reales los tomamos del directorio central (siempre son correctos).
        if (dv.getUint32(e.offLocal, true) !== 0x04034b50) {
          return Promise.reject(new Error('ZIP dañado en ' + ruta));
        }
        var lnNom = dv.getUint16(e.offLocal + 26, true);
        var lnExt = dv.getUint16(e.offLocal + 28, true);
        var ini = e.offLocal + 30 + lnNom + lnExt;
        var datos = u8.subarray(ini, ini + e.compSize);

        if (e.metodo === 0) return Promise.resolve(new TextDecoder('utf-8').decode(datos));
        if (e.metodo !== 8) return Promise.reject(new Error('Compresión no soportada en ' + ruta));
        return inflar(datos).then(function (bytes) {
          return new TextDecoder('utf-8').decode(bytes);
        });
      },
      existe: function (ruta) { return !!entradas[ruta]; },
      lista: function () { return Object.keys(entradas); }
    };
  }

  function inflar(bytes) {
    // Se copia a un buffer propio: subarray sobre el ArrayBuffer original
    // puede dar problemas al pasarlo al stream.
    var copia = new Uint8Array(bytes.length);
    copia.set(bytes);
    var ds = new global.DecompressionStream('deflate-raw');
    var escritor = ds.writable.getWriter();
    escritor.write(copia);
    escritor.close();
    return new Response(ds.readable).arrayBuffer().then(function (ab) {
      return new Uint8Array(ab);
    });
  }

  /* ───── Armado del libro ───── */

  function armarLibro(zip) {
    return Promise.all([
      zip.texto('xl/workbook.xml'),
      zip.texto('xl/_rels/workbook.xml.rels'),
      zip.texto('xl/sharedStrings.xml'),
      zip.texto('xl/styles.xml')
    ]).then(function (r) {
      var xmlLibro = r[0], xmlRels = r[1], xmlSS = r[2], xmlEstilos = r[3];
      if (!xmlLibro) throw new Error('El .xlsx no tiene la estructura esperada.');

      var compartidas = parsearSharedStrings(xmlSS);
      var estilosFecha = parsearEstilosFecha(xmlEstilos);
      var rels = parsearRels(xmlRels);
      var hojasDef = parsearHojas(xmlLibro);

      // Si el workbook no declara relaciones utilizables, se cae a sheet1.xml.
      if (!hojasDef.length) hojasDef = [{ nombre: 'Hoja1', rid: null }];

      var cadena = Promise.resolve();
      var hojas = [];
      hojasDef.forEach(function (h, idx) {
        cadena = cadena.then(function () {
          var ruta = h.rid && rels[h.rid] ? normalizarRuta(rels[h.rid]) : 'xl/worksheets/sheet' + (idx + 1) + '.xml';
          if (!zip.existe(ruta)) return;
          return zip.texto(ruta).then(function (xml) {
            hojas.push({ nombre: h.nombre, filas: parsearHoja(xml, compartidas, estilosFecha) });
          });
        });
      });

      return cadena.then(function () {
        if (!hojas.length) throw new Error('No se encontró ninguna hoja con datos en el archivo.');
        return { tipo: 'xlsx', hojas: hojas };

  function normalizarRuta(target) {
    var t = String(target).replace(/^\/+/, '');
    if (t.indexOf('xl/') === 0) return t;

    if (!texto) return mapa;
    var doc = xml(texto);
    Array.prototype.forEach.call(doc.getElementsByTagName('Relationship'), function (n) {
      mapa[n.getAttribute('Id')] = n.getAttribute('Target');

  function parsearHojas(texto) {
    var doc = xml(texto), salida = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('sheet'), function (n) {
      var rid = n.getAttributeNS ? n.getAttributeNS(NS_REL, 'id') : null;
      if (!rid) rid = n.getAttribute('r:id');

    });
    return salida;
  }

  function parsearSharedStrings(texto) {
    if (!texto) return [];
    var doc = xml(texto), salida = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('si'), function (si) {
      var partes = si.getElementsByTagName('t');
      var s = '';
      for (var i = 0; i < partes.length; i++) {
        // Se ignora el <t> de las guías fonéticas (rPh), que no es texto real.
        if (partes[i].parentNode && partes[i].parentNode.nodeName === 'rPh') continue;
        s += partes[i].textContent;
      }
      salida.push(s);
    });
    return salida;
  }

  /** Devuelve un array: por índice de estilo, true si ese estilo es fecha. */
  function parsearEstilosFecha(texto) {
    var esFecha = [];
    if (!texto) return esFecha;
    var doc = xml(texto);

    var BUILTIN_FECHA = { 14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,45:1,46:1,47:1,
                          27:1,28:1,29:1,30:1,31:1,32:1,33:1,34:1,35:1,36:1,50:1,51:1,
                          52:1,53:1,54:1,55:1,56:1,57:1,58:1 };
    var personalizados = {};
    Array.prototype.forEach.call(doc.getElementsByTagName('numFmt'), function (n) {
      var codigo = (n.getAttribute('formatCode') || '').toLowerCase();
      // Se saca lo que está entre comillas y los colores para no confundirse.
      var limpio = codigo.replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '');
      if (/[ymdhs]/.test(limpio) && !/^[#0.,%\s]*$/.test(limpio)) {
        personalizados[n.getAttribute('numFmtId')] = true;
      }
    });

    var cellXfs = doc.getElementsByTagName('cellXfs')[0];
    if (!cellXfs) return esFecha;
    Array.prototype.forEach.call(cellXfs.getElementsByTagName('xf'), function (xf, i) {
      var idFmt = xf.getAttribute('numFmtId');
      esFecha[i] = !!(BUILTIN_FECHA[Number(idFmt)] || personalizados[idFmt]);
    });
    return esFecha;
  }

  /** "BC12" → 54 (índice de columna, base 0) */
  function colDeRef(ref) {
    var letras = String(ref).replace(/[^A-Za-z]/g, '').toUpperCase();
    var n = 0;
    for (var i = 0; i < letras.length; i++) n = n * 26 + (letras.charCodeAt(i) - 64);
    return n - 1;
  }

  function serialAFecha(n) {
    var ms = Date.UTC(1899, 11, 30) + Math.round(Number(n) * 86400000);
    var d = new Date(ms);
    if (isNaN(d.getTime())) return '';
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  }

  function parsearHoja(texto, compartidas, estilosFecha) {
    var doc = xml(texto);
    var filasXml = doc.getElementsByTagName('row');
    var filas = [];

    for (var i = 0; i < filasXml.length; i++) {
      var celdas = filasXml[i].getElementsByTagName('c');
      var fila = [];
      for (var j = 0; j < celdas.length; j++) {
        var c = celdas[j];
        var col = c.getAttribute('r') ? colDeRef(c.getAttribute('r')) : fila.length;
        var tipo = c.getAttribute('t');
        var valor = '';

        if (tipo === 's') {
          var v = c.getElementsByTagName('v')[0];
          var idx = v ? Number(v.textContent) : -1;
          valor = compartidas[idx] !== undefined ? compartidas[idx] : '';
        } else if (tipo === 'inlineStr') {
          var is = c.getElementsByTagName('is')[0];
          valor = is ? is.textContent : '';
        } else if (tipo === 'e') {
          valor = '';
        } else {
          var vn = c.getElementsByTagName('v')[0];
          valor = vn ? vn.textContent : '';
          if (valor !== '' && tipo !== 'str' && tipo !== 'b') {
            var s = c.getAttribute('s');
            if (s !== null && estilosFecha[Number(s)] && Number(valor) > 0) {
              valor = serialAFecha(valor);
            }
          }
          if (tipo === 'b') valor = valor === '1' ? 'SÍ' : 'NO';
        }

        while (fila.length < col) fila.push('');
        fila[col] = valor;
      }
      filas.push(fila);
    }

    while (filas.length && filas[filas.length - 1].every(function (v) { return String(v).trim() === ''; })) {
      filas.pop();
    }
    return filas;
  }

  global.Lector = Lector;
})(window);

  /**
   * Las tablas anchas (Consultas, Equipos) solo traen la barra para correrlas
   * a los costados abajo de todo, y hay que bajar el listado entero para
   * llegar a ella. Esto agrega una segunda barra arriba, sincronizada con la
   * de abajo, y la deja pegada debajo de la barra superior mientras se baja.
   *
   * @param {HTMLElement} scroll  el contenedor .tabla-scroll
   */
  C.barraDesplazamientoArriba = function (scroll) {
    var barra = U.el('div', { class: 'scroll-arriba' });
    var interno = U.el('div');
    barra.appendChild(interno);
    scroll.parentNode.insertBefore(barra, scroll);

    // Cada barra mueve a la otra. Se compara antes de asignar: cuando las dos
    // ya están en la misma posición no se hace nada, así que el rebote se
    // corta solo y no hacen falta banderas que se puedan quedar trabadas.
    function espejo(origen, destino) {
      origen.addEventListener('scroll', function () {
        if (destino.scrollLeft !== origen.scrollLeft) destino.scrollLeft = origen.scrollLeft;

    }
    espejo(barra, scroll);
    espejo(scroll, barra);

    function medir() {
      var ancho = scroll.scrollWidth;
      interno.style.width = ancho + 'px';

      var sobra = ancho > scroll.clientWidth + 1;
      barra.style.display = sobra ? '' : 'none';

      // La barra superior de la aplicación cambia de alto según el ancho de
      // la ventana (los botones se acomodan en dos líneas), así que se mide.
      var topbar = document.querySelector('.topbar');

      var obs = new ResizeObserver(medir);
      obs.observe(scroll);

   */
  C.adjuntoPDF = function (idActual, etiqueta) {
    var id = idActual || null;
    var idNuevo = null;
    var caja = U.el('div');

    var input = U.el('input', { type: 'file', accept: 'application/pdf,.pdf', style: 'display:none' });
    caja.appendChild(input);

    var zona = U.el('div');
    caja.appendChild(zona);

    function pintar() {
      zona.innerHTML = '';
      if (!id) {
        var b = U.el('button', { class: 'btn btn-borde btn-block', type: 'button',
          text: '📎 Adjuntar ' + (etiqueta || 'PDF') });
        b.addEventListener('click', function () { input.click(); });

        return;
      }

      var fila = U.el('div', { class: 'pdf-cargado' });
      fila.appendChild(U.el('span', { text: '📄' }));
      var nom = U.el('div', { class: 'nom', text: 'Cargando…' });
      fila.appendChild(nom);

      Store.get('archivos', id).then(function (a) {
        nom.textContent = a ? a.nombre : 'Archivo no encontrado';
      });

      var bVer = U.el('button', { class: 'btn btn-chico btn-primario', type: 'button', text: 'Ver' });

    bCamara.addEventListener('click', function () { inpCamara.click(); });
