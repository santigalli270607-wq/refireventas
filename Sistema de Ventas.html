  /* ═══════════════════════════════════════════════════════
     Lista de precios de REFIRE

     El Excel viene armado por secciones. Cada sección arranca
     con una fila donde la columna A tiene el rubro (PLATAFORMAS,
     GRÚAS, AUXILIOS…) y la columna C dice "PRECIO ... MONTAJE".
     Abajo van los equipos: columna A el nombre, columna C el
     precio con montaje, que es el que interesa.

     Las fórmulas no molestan: el .xlsx guarda el resultado
     calculado de cada celda y es lo que se lee.
     ═══════════════════════════════════════════════════════ */

  var COL_NOMBRE = 0;   // columna A
  var COL_PRECIO = 2;   // columna C — "PRECIO C/ MONTAJE"

  /** ¿Esta fila es el encabezado de una sección? */
  function esEncabezadoSeccion(fila) {
    var a = String(fila[COL_NOMBRE] || '').trim();
    var c = U.norm(fila[COL_PRECIO]);
    return !!a && c.indexOf('precio') === 0;
  }

  /** Recorre la hoja y devuelve los renglones con su rubro. */
  function parsearListaPrecios(filas) {
    var items = [];
    var sinPrecio = [];
    var rubroActual = '';
    var tituloActual = '';
    var seccionesVistas = [];

    filas.forEach(function (fila, i) {
      var nombre = String(fila[COL_NOMBRE] === undefined ? '' : fila[COL_NOMBRE]).trim();

      if (esEncabezadoSeccion(fila)) {
        tituloActual = nombre;
        rubroActual = Datos.rubroDesdeTitulo(nombre) || 'Accesorios y opcionales';
        if (seccionesVistas.indexOf(rubroActual) === -1) seccionesVistas.push(rubroActual);
        return;
      }

      if (!nombre) return;                       // fila suelta o vacía
      if (!rubroActual) return;                  // todavía no arrancó ninguna sección

      var crudo = fila[COL_PRECIO];
      var precio = numeroDePrecio(crudo);

      if (precio === null) {
        sinPrecio.push({ fila: i + 1, nombre: nombre, rubro: rubroActual, valor: String(crudo || '') });
        return;
      }

      items.push({ nombre: nombre, precio: precio, rubro: rubroActual, titulo: tituloActual });
    });

    return { items: items, sinPrecio: sinPrecio, secciones: seccionesVistas };
  }

  /** Convierte la celda de precio a número. Devuelve null si no lo es. */
  function numeroDePrecio(v) {
    if (v === undefined || v === null || v === '') return null;
    var s = String(v).trim();
    if (!s) return null;
    if (/^#/.test(s)) return null;               // #N/A, #REF!, etc.
    var n = U.num(s.replace(/[^\d.,-]/g, ''));
    if (!n || n <= 0) return null;
    return n;
  }

  /** Compara lo del archivo contra el catálogo que ya está cargado. */
  function analizarListaPrecios() {
    var res = parsearListaPrecios(hoja().filas);

    var porNombre = {};
    App.cache.equipos.forEach(function (e) { porNombre[U.norm(e.nombre)] = e; });

    var nuevos = [], actualizados = [], igual = [], repetidos = [];
    var vistos = {};

    res.items.forEach(function (it) {
      var clave = U.norm(it.nombre);
      if (vistos[clave]) { repetidos.push(it); return; }
      vistos[clave] = true;

      var eq = porNombre[clave];
      if (!eq) { nuevos.push(it); return; }
      if (Number(eq.precio || 0) === it.precio) { igual.push({ it: it, eq: eq }); return; }
      actualizados.push({ it: it, eq: eq, anterior: Number(eq.precio || 0) });
    });

    // Equipos del catálogo que no figuran en la lista nueva.
    var fuera = App.cache.equipos.filter(function (e) { return !vistos[U.norm(e.nombre)]; });

    return {
      nuevos: nuevos, actualizados: actualizados, igual: igual,
      repetidos: repetidos, sinPrecio: res.sinPrecio, secciones: res.secciones, fuera: fuera
    };
  }

  function pasoListaPrecios(cont) {
    var h = hoja();
    var an = analizarListaPrecios();

    /* ── Archivo leído ── */
    var panel = U.el('div', { class: 'panel' });
    var cab = U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Lista de precios leída' }),
        U.el('p', { class: 'sub', text: 'Hoja "' + h.nombre + '" · ' + h.filas.length + ' filas · ' +
          an.secciones.length + ' secciones' })
      ])
    ]);
    var bOtro = U.el('button', { class: 'btn btn-borde', text: 'Elegir otro archivo' });
    bOtro.addEventListener('click', function () { libro = null; App.refrescar(); });
    cab.appendChild(bOtro);
    panel.appendChild(cab);

    if (U.norm(h.nombre) !== 'pesos') {
      panel.appendChild(U.el('div', { class: 'panel-cuerpo' }, [
        U.el('div', { class: 'alerta alerta-aviso',
          text: 'Se está leyendo la hoja "' + h.nombre + '". La lista de REFIRE tiene los pesos en la ' +
                'hoja llamada PESOS; si el archivo cambió de nombre de hoja, revisá que sea la correcta.' })
      ]));
    }

    var tarjetas = U.el('div', { class: 'tarjetas', style: 'margin:0;padding:18px' });
    [['Precios que cambian', U.miles(an.actualizados.length)],
     ['Equipos nuevos', U.miles(an.nuevos.length)],
     ['Sin cambio', U.miles(an.igual.length)],
     ['Sin precio en la lista', U.miles(an.sinPrecio.length)]
    ].forEach(function (d) {
      tarjetas.appendChild(U.el('div', { class: 'tarjeta' }, [
        U.el('div', { class: 'num', text: d[1] }),
        U.el('div', { class: 'rot', text: d[0] })
      ]));
    });
    panel.appendChild(tarjetas);
    cont.appendChild(panel);

    /* ── Secciones detectadas ── */
    var pSec = U.el('div', { class: 'panel' });
    pSec.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Secciones detectadas' }),
        U.el('p', { class: 'sub', text: 'Cada equipo queda con el rubro de la sección donde estaba, ' +
          'y con eso se decide qué hoja de fábrica le corresponde.' })
      ])
    ]));

    var porRubro = {};
    an.nuevos.forEach(function (it) { contar(porRubro, it.rubro, 'nuevos'); });
    an.actualizados.forEach(function (x) { contar(porRubro, x.it.rubro, 'actualizados'); });
    an.igual.forEach(function (x) { contar(porRubro, x.it.rubro, 'igual'); });

    var tSec = U.el('table', { class: 'tabla' });
    tSec.appendChild(U.el('thead', {}, [U.el('tr', {}, [
      U.el('th', { text: 'Rubro' }),
      U.el('th', { text: 'Hoja de fábrica' }),
      U.el('th', { text: 'Cambian', style: 'width:100px' }),
      U.el('th', { text: 'Nuevos', style: 'width:100px' }),
      U.el('th', { text: 'Sin cambio', style: 'width:110px' })
    ])]));
    var tbSec = U.el('tbody');
    an.secciones.forEach(function (r) {
      var c = porRubro[r] || {};
      tbSec.appendChild(U.el('tr', {}, [
        U.el('td', { text: r }),
        U.el('td', { text: Datos.rotTipoEquipo(Datos.tipoDesdeRubro(r)) }),
        U.el('td', { class: 'num-col', text: U.miles(c.actualizados || 0) }),
        U.el('td', { class: 'num-col', text: U.miles(c.nuevos || 0) }),
        U.el('td', { class: 'num-col', text: U.miles(c.igual || 0) })
      ]));
    });
    tSec.appendChild(tbSec);
    pSec.appendChild(U.el('div', { class: 'tabla-scroll' }, [tSec]));
    cont.appendChild(pSec);

    /* ── Precios que cambian ── */
    if (an.actualizados.length) {
      cont.appendChild(listaCambios('Precios que cambian', an.actualizados.map(function (x) {
        var variacion = '—';
        if (x.anterior > 0) {
          var pct = Math.round((x.it.precio / x.anterior - 1) * 100);
          variacion = (pct > 0 ? '+' : '') + pct + '%';
        } else {
          variacion = 'sin precio antes';
        }
        return [x.it.nombre, x.anterior ? U.plata(x.anterior) : '—', U.plata(x.it.precio), variacion];
      }), ['Equipo', 'Precio anterior', 'Precio nuevo', 'Var.']));
    }

    /* ── Equipos nuevos ── */
    if (an.nuevos.length) {
      cont.appendChild(listaCambios('Equipos que se agregan al catálogo', an.nuevos.map(function (it) {
        return [it.nombre, it.rubro, U.plata(it.precio)];
      }), ['Equipo', 'Rubro', 'Precio']));
    }

    /* ── Renglones sin precio ── */
    if (an.sinPrecio.length) {
      var p = listaCambios('Renglones sin precio (se saltean)', an.sinPrecio.map(function (s) {
        return [s.nombre, s.rubro, s.valor || 'vacío'];
      }), ['Renglón', 'Rubro', 'Qué tiene en la columna de precio']);
      p.insertBefore(U.el('div', { class: 'panel-cuerpo' }, [
        U.el('div', { class: 'alerta alerta-aviso',
          text: 'Estos renglones del Excel no tienen un número en la columna PRECIO C/ MONTAJE ' +
                '(están vacíos, dicen #N/A o el precio quedó en otra columna). No se tocan.' })
      ]), p.children[1]);
      cont.appendChild(p);
    }

    /* ── Equipos del catálogo que no vinieron ── */
    if (an.fuera.length) {
      cont.appendChild(listaCambios(
        'Equipos del catálogo que no están en esta lista',
        an.fuera.map(function (e) {
          var usos = App.cache.ventas.filter(function (v) {
            return v.equipoId === e.id || v.equipoNombre === e.nombre;
          }).length;
          return [e.nombre, e.precio ? U.plata(e.precio) : '—', U.miles(usos) + ' ventas'];
        }), ['Equipo', 'Precio actual', 'Usado en']));
    }

    /* ── Confirmar ── */
    var pRes = U.el('div', { class: 'panel' });
    pRes.appendChild(U.el('div', { class: 'panel-cuerpo' }, [
      U.el('div', { class: 'alerta alerta-info',
        html: 'Se van a <strong>actualizar ' + U.miles(an.actualizados.length) + '</strong> precios y ' +
          '<strong>agregar ' + U.miles(an.nuevos.length) + '</strong> equipos nuevos. ' +
          'Los equipos que ya existen mantienen su ficha, así que las ventas cargadas siguen ' +
          'apuntando al mismo equipo.' })
    ]));

    var pie = U.el('div', { class: 'acciones-form' });
    var bCancelar = U.el('button', { class: 'btn btn-borde', text: 'Cancelar' });
    bCancelar.addEventListener('click', function () { libro = null; App.refrescar(); });
    var bImportar = U.el('button', { class: 'btn btn-accion', text: 'ACTUALIZAR PRECIOS' });
    bImportar.disabled = !an.actualizados.length && !an.nuevos.length;
    bImportar.addEventListener('click', function () { ejecutarListaPrecios(bImportar, an); });
    pie.appendChild(bCancelar);
    pie.appendChild(bImportar);
    pRes.appendChild(pie);
    cont.appendChild(pRes);
  }

  function contar(mapa, rubro, clave) {
    if (!mapa[rubro]) mapa[rubro] = {};
    mapa[rubro][clave] = (mapa[rubro][clave] || 0) + 1;
  }

  /** Panel plegable con una tabla de renglones. */
  function listaCambios(titulo, filas, encabezados) {
    var panel = U.el('div', { class: 'panel' });
    var abierto = filas.length <= 12;

    var cab = U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [U.el('h3', { text: titulo + ' (' + U.miles(filas.length) + ')' })])
    ]);
    var bVer = U.el('button', { class: 'btn btn-chico btn-borde', text: abierto ? 'Ocultar' : 'Ver detalle' });
    cab.appendChild(bVer);
    panel.appendChild(cab);

    var scroll = U.el('div', { class: 'tabla-scroll', style: 'max-height:340px;overflow-y:auto' });
    if (!abierto) scroll.classList.add('oculto');
    bVer.addEventListener('click', function () {
      scroll.classList.toggle('oculto');
      bVer.textContent = scroll.classList.contains('oculto') ? 'Ver detalle' : 'Ocultar';
    });

    var tabla = U.el('table', { class: 'tabla' });
    tabla.appendChild(U.el('thead', {}, [U.el('tr', {},
      encabezados.map(function (e) { return U.el('th', { text: e }); }))]));
    var tb = U.el('tbody');
    filas.slice(0, 400).forEach(function (f) {
      tb.appendChild(U.el('tr', {}, f.map(function (celda, i) {
        return U.el('td', { class: i === 0 ? '' : 'num-col', text: String(celda) });
      })));
    });
    tabla.appendChild(tb);
    scroll.appendChild(tabla);
    panel.appendChild(scroll);

    if (filas.length > 400) {
      panel.appendChild(U.el('div', { class: 'paginacion' }, [
        U.el('div', { class: 'info', text: 'Se muestran los primeros 400 de ' + U.miles(filas.length) + '.' })
      ]));
    }
    return panel;
  }

  function ejecutarListaPrecios(boton, an) {
    boton.disabled = true;

    var cuerpo = U.el('div');
    cuerpo.appendChild(U.el('p', { id: 'imp-txt', style: 'margin-top:0', text: 'Guardando…' }));
    var barra = U.el('div', { class: 'progreso' }, [U.el('div')]);
    cuerpo.appendChild(barra);
    U.modal({ titulo: 'Actualizando precios', cuerpo: cuerpo, botones: [] });
    var relleno = barra.firstChild;

    var aGuardar = [];
    var ahora = new Date().toISOString();

    an.actualizados.forEach(function (x) {
      x.eq.precio = x.it.precio;
      x.eq.rubro = x.it.rubro;
      // Si nadie le tocó la familia a mano, se acomoda según el rubro.
      if (!x.eq.tipoManual) x.eq.tipo = Datos.tipoDesdeRubro(x.it.rubro) || x.eq.tipo;
      x.eq.precioActualizadoEn = ahora;
      aGuardar.push(x.eq);
    });

    an.igual.forEach(function (x) {
      // El precio no cambió, pero puede haber llegado el rubro por primera vez.
      if (x.eq.rubro === x.it.rubro) return;
      x.eq.rubro = x.it.rubro;
      if (!x.eq.tipoManual) x.eq.tipo = Datos.tipoDesdeRubro(x.it.rubro) || x.eq.tipo;
      aGuardar.push(x.eq);
    });

    an.nuevos.forEach(function (it) {
      aGuardar.push({
        id: U.id('eq'),
        nombre: it.nombre,
        precio: it.precio,
        rubro: it.rubro,
        tipo: Datos.tipoDesdeRubro(it.rubro) || Datos.adivinarTipoEquipo(it.nombre),
        activo: true,
        precioActualizadoEn: ahora
      });
    });

    relleno.style.width = '40%';

    Store.bulk('equipos', aGuardar)
      .then(function () { return Store.setConfig('listaPreciosAlDia', ahora); })
      .then(function () { relleno.style.width = '80%'; return App.recargar('equipos'); })
      .then(function () {
        U.cerrarModal();
        libro = null;
        U.modal({
          titulo: 'Precios actualizados',
          cuerpo: '<div class="alerta alerta-ok" style="margin-bottom:14px">Listo.</div>' +
            '<ul style="line-height:1.8;margin:0;padding-left:20px">' +
            '<li>Precios actualizados: ' + U.miles(an.actualizados.length) + '</li>' +
            '<li>Equipos agregados: ' + U.miles(an.nuevos.length) + '</li>' +
            '<li>Sin cambio: ' + U.miles(an.igual.length) + '</li>' +
            (an.sinPrecio.length ? '<li>Renglones sin precio que se saltearon: ' + U.miles(an.sinPrecio.length) + '</li>' : '') +
            '</ul>',
          botones: [
            { texto: 'Ver el catálogo', clase: 'btn-primario', accion: function () { App.ir('catalogos'); } },
            { texto: 'Cerrar', clase: 'btn-borde', accion: function () { App.refrescar(); } }
          ]
        });
      })
      .catch(function (e) {
        console.error(e);
        U.cerrarModal();
        boton.disabled = false;
        U.toast('No se pudieron guardar los precios: ' + e.message, 'error', 7000);
      });
  }

  /* ═══════════════ Paso 2: mapeo y confirmación ═══════════════ */

  function campos() {
    if (destino === 'ventas') return CAMPOS_VENTA;
    if (destino === 'clientes') return CAMPOS_CLIENTE;
    return CAMPOS_CATALOGO;
  }

  function rotDestino() {
    var d = DESTINOS.filter(function (x) { return x.id === destino; })[0];
    return d ? d.rot.toLowerCase() : destino;
  }

  function hoja() { return libro.hojas[hojaIdx]; }

  /** Si el libro trae varias hojas, se arranca por la que tiene más filas. */
  function elegirHojaConDatos(res) {
    // La lista de REFIRE tiene los pesos en la hoja "PESOS".
    if (esListaPrecios()) {
      for (var i = 0; i < res.hojas.length; i++) {
        if (U.norm(res.hojas[i].nombre) === 'pesos') return i;
      }
    }
    var mejor = 0;
    res.hojas.forEach(function (h, j) {
      if (h.filas.length > res.hojas[mejor].filas.length) mejor = j;
    });
    return mejor;
  }

  function encabezados() {
    var fila = hoja().filas[filaEncabezado] || [];
    var maxCols = 0;
    hoja().filas.slice(0, 50).forEach(function (f) { if (f.length > maxCols) maxCols = f.length; });
    var res = [];
    for (var i = 0; i < Math.max(maxCols, fila.length); i++) {
      var t = String(fila[i] === undefined ? '' : fila[i]).trim();
      res.push({ idx: i, texto: t || ('Columna ' + letra(i)) });
    }
    return res;
  }

  function letra(i) {
    var s = '';
    i = i + 1;
    while (i > 0) { var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }

  function adivinarMapeo() {
    mapeo = {};
    var enc = encabezados();
    campos().forEach(function (c) {
      var encontrado = enc.filter(function (e) {
        var n = U.norm(e.texto);
        return c.pistas.some(function (p) { return n === p || n.indexOf(p) !== -1; });
      })[0];
      mapeo[c.clave] = encontrado ? encontrado.idx : '';
    });
  }

  /**
   * Muchas planillas traen un título suelto arriba antes de los encabezados
   * reales. Se prueba fila por fila cuál reconoce más columnas.
   */
  function elegirFilaEncabezado() {
    var filas = hoja().filas;
    var mejorFila = 0, mejorPuntaje = -1;

    for (var i = 0; i < Math.min(10, filas.length); i++) {
      filaEncabezado = i;
      adivinarMapeo();
      var puntaje = campos().reduce(function (acc, c) {
        if (mapeo[c.clave] === '') return acc;
        return acc + (c.requerido ? 2 : 1);
      }, 0);
      if (puntaje > mejorPuntaje) { mejorPuntaje = puntaje; mejorFila = i; }
    }

    filaEncabezado = mejorFila;
    adivinarMapeo();
  }

  function pasoMapeo(cont) {
    var h = hoja();

    /* ── Panel de origen ── */
    var panel = U.el('div', { class: 'panel' });
    var cab = U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Archivo leído' }),
        U.el('p', { class: 'sub', text: h.filas.length + ' filas · hoja "' + h.nombre + '"' })
      ])
    ]);
    var bOtro = U.el('button', { class: 'btn btn-borde', text: 'Elegir otro archivo' });
    bOtro.addEventListener('click', function () { libro = null; App.refrescar(); });
    cab.appendChild(bOtro);
    panel.appendChild(cab);

    var cuerpo = U.el('div', { class: 'panel-cuerpo' });
    var gOrigen = U.el('div', { class: 'grid g3' });

    if (libro.hojas.length > 1) {
      var selHoja = U.el('select');
      libro.hojas.forEach(function (x, i) {
        var op = U.el('option', { value: i, text: x.nombre + ' (' + x.filas.length + ' filas)' });
        if (i === hojaIdx) op.selected = true;
        selHoja.appendChild(op);
      });
      selHoja.addEventListener('change', function () {
        hojaIdx = Number(selHoja.value); elegirFilaEncabezado(); App.refrescar();
      });
      gOrigen.appendChild(U.el('label', { class: 'campo' }, [U.el('span', { text: 'Hoja' }), selHoja]));
    }

    var selEnc = U.el('select');
    for (var i = 0; i < Math.min(10, h.filas.length); i++) {
      var resumen = (h.filas[i] || []).slice(0, 4).map(function (v) { return String(v).slice(0, 18); }).join(' | ');
      var op2 = U.el('option', { value: i, text: 'Fila ' + (i + 1) + ': ' + resumen });
      if (i === filaEncabezado) op2.selected = true;
      selEnc.appendChild(op2);
    }
    selEnc.addEventListener('change', function () {
      filaEncabezado = Number(selEnc.value); adivinarMapeo(); App.refrescar();
    });
    gOrigen.appendChild(U.el('label', { class: 'campo' },
      [U.el('span', { text: 'Fila de títulos' }), selEnc]));

    cuerpo.appendChild(gOrigen);
    panel.appendChild(cuerpo);

    /* Vista previa */
    panel.appendChild(vistaPrevia());
    cont.appendChild(panel);

    /* ── Panel de mapeo ── */
    var pMap = U.el('div', { class: 'panel' });
    pMap.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [
        U.el('h3', { text: 'Qué columna es cada cosa' }),
        U.el('p', { class: 'sub', text: 'El sistema ya intentó adivinarlo. Revisá que esté bien.' })
      ])
    ]));

    var cMap = U.el('div', { class: 'panel-cuerpo' });
    var gMap = U.el('div', { class: 'grid g3' });
    var enc = encabezados();

    campos().forEach(function (c) {
      var s = U.el('select');
      s.appendChild(U.el('option', { value: '', text: '— no importar —' }));
      enc.forEach(function (e) {
        var op = U.el('option', { value: e.idx, text: letra(e.idx) + ' · ' + e.texto });
        if (mapeo[c.clave] === e.idx) op.selected = true;
        s.appendChild(op);
      });
      s.addEventListener('change', function () {
        mapeo[c.clave] = s.value === '' ? '' : Number(s.value);
        actualizarResumen();
      });
      gMap.appendChild(U.el('label', { class: 'campo' }, [
        U.el('span', { text: c.rot + (c.requerido ? ' *' : '') }), s
      ]));
    });
    cMap.appendChild(gMap);
    pMap.appendChild(cMap);
    cont.appendChild(pMap);

    /* ── Opciones ── */
    var pOpc = U.el('div', { class: 'panel' });
    pOpc.appendChild(U.el('div', { class: 'panel-cab' }, [U.el('h3', { text: 'Opciones' })]));
    var cOpc = U.el('div', { class: 'panel-cuerpo' });

    function check(clave, texto, ayuda) {
      var c = U.el('input', { type: 'checkbox' });
      c.checked = !!opciones[clave];
      c.addEventListener('change', function () { opciones[clave] = c.checked; actualizarResumen(); });
      var l = U.el('label', { class: 'check', style: 'align-items:flex-start;margin-bottom:12px' }, [
        c,
        U.el('span', {}, [
          U.el('div', { text: texto }),
          ayuda ? U.el('div', { class: 'txt-chico', text: ayuda }) : null
        ])
      ]);
      return l;
    }

    if (destino === 'ventas') {
      cOpc.appendChild(check('saltearRepetidos', 'Saltear los números de serie que ya existan',
        'Evita duplicar si se importa el mismo archivo dos veces.'));
      cOpc.appendChild(check('crearEquipos', 'Agregar al catálogo los equipos que no existan',
        'Así después aparecen en el desplegable al cargar una venta nueva.'));
      cOpc.appendChild(check('crearClientes', 'Crear fichas de cliente',
        'Solo tiene sentido si mapeaste la columna CUIT. Sin CUIT, el nombre del cliente igual queda guardado en cada venta.'));
    } else if (esCatalogo()) {
      cOpc.appendChild(check('crearFaltantes',
        'Agregar los que no estén en el catálogo',
        'Si se destilda, solo se actualizan los precios de los que ya existen.'));
    } else {
      cOpc.appendChild(U.el('p', { class: 'txt-chico', style: 'margin:0',
        text: 'Los clientes se identifican por CUIT: si ya existe, se le actualizan los datos.' }));
    }
    pOpc.appendChild(cOpc);
    cont.appendChild(pOpc);

    /* ── Resumen y botón ── */
    var pRes = U.el('div', { class: 'panel' });
    var cRes = U.el('div', { class: 'panel-cuerpo' });
    var resumen = U.el('div');
    cRes.appendChild(resumen);
    pRes.appendChild(cRes);

    var accionesPie = U.el('div', { class: 'acciones-form' });
    var bCancelar = U.el('button', { class: 'btn btn-borde', text: 'Cancelar' });
    bCancelar.addEventListener('click', function () { libro = null; App.refrescar(); });
    var bImportar = U.el('button', { class: 'btn btn-accion', text: 'IMPORTAR' });
    bImportar.addEventListener('click', function () { confirmarImportacion(bImportar); });
    accionesPie.appendChild(bCancelar);
    accionesPie.appendChild(bImportar);
    pRes.appendChild(accionesPie);
    cont.appendChild(pRes);

    function actualizarResumen() {
      var faltan = campos().filter(function (c) { return c.requerido && mapeo[c.clave] === ''; });
      resumen.innerHTML = '';
      if (faltan.length) {
        resumen.appendChild(U.el('div', { class: 'alerta alerta-error',
          text: 'Falta indicar la columna de: ' + faltan.map(function (c) { return c.rot; }).join(', ') + '.' }));
        bImportar.disabled = true;
        return;
      }
      bImportar.disabled = false;
      var prev = analizar();
      var t = U.el('div', { class: 'tarjetas', style: 'margin-bottom:0' });
      [['Filas con datos', U.miles(prev.total)],
       ['Se van a importar', U.miles(prev.nuevos)],
       ['Repetidos (se saltean)', U.miles(prev.repetidos)],
       ['Filas vacías o incompletas', U.miles(prev.invalidos)]
      ].forEach(function (d) {
        t.appendChild(U.el('div', { class: 'tarjeta' }, [
          U.el('div', { class: 'num', text: d[1] }), U.el('div', { class: 'rot', text: d[0] })]));
      });
      resumen.appendChild(t);
    }
    actualizarResumen();
  }

  function vistaPrevia() {
    var h = hoja();
    var enc = encabezados();
    var scroll = U.el('div', { class: 'tabla-scroll', style: 'border-top:1px solid var(--gris-2)' });
    var tabla = U.el('table', { class: 'tabla' });

    var trh = U.el('tr');
    enc.slice(0, 12).forEach(function (e) {
      trh.appendChild(U.el('th', { text: letra(e.idx) + ' · ' + e.texto }));
    });
    tabla.appendChild(U.el('thead', {}, [trh]));

    var tb = U.el('tbody');
    h.filas.slice(filaEncabezado + 1, filaEncabezado + 7).forEach(function (f) {
      var tr = U.el('tr');
      enc.slice(0, 12).forEach(function (e) {
        tr.appendChild(U.el('td', { text: String(f[e.idx] === undefined ? '' : f[e.idx]).slice(0, 60) }));
      });
      tb.appendChild(tr);
    });
    tabla.appendChild(tb);
    scroll.appendChild(tabla);
    return scroll;
  }

  /* ═══════════════ Análisis previo ═══════════════ */

  function celda(fila, idx) {
    if (idx === '' || idx === undefined) return '';
    var v = fila[idx];
    return v === undefined || v === null ? '' : String(v).trim();
  }

  function analizar() {
    var filas = hoja().filas.slice(filaEncabezado + 1);
    var seriesExistentes = {};
    App.cache.ventas.forEach(function (v) {
      if (v.nroSerie) seriesExistentes[U.norm(v.nroSerie)] = true;
    });
    var cuitsExistentes = {};
    App.cache.clientes.forEach(function (c) { cuitsExistentes[U.soloDigitos(c.cuit)] = true; });

    var res = { total: 0, nuevos: 0, repetidos: 0, invalidos: 0 };
    var vistos = {};

    filas.forEach(function (f) {
      var vacia = campos().every(function (c) { return celda(f, mapeo[c.clave]) === ''; });
      if (vacia) return;
      res.total++;

      var faltaObligatorio = campos().some(function (c) {
        return c.requerido && celda(f, mapeo[c.clave]) === '';
      });
      if (faltaObligatorio) { res.invalidos++; return; }

      var clave;
      if (destino === 'ventas') clave = U.norm(celda(f, mapeo.nroSerie));
      else if (destino === 'clientes') clave = U.soloDigitos(celda(f, mapeo.cuit));
      else clave = U.norm(celda(f, mapeo.nombre));

      var yaEsta = destino === 'ventas'
        ? (seriesExistentes[clave] && opciones.saltearRepetidos)
        : false;

      if (vistos[clave] || yaEsta) { res.repetidos++; return; }
      vistos[clave] = true;
      res.nuevos++;
    });

    return res;
  }

  /* ═══════════════ Importación ═══════════════ */

  function confirmarImportacion(boton) {
    var prev = analizar();
    if (!prev.nuevos) { U.toast('No hay filas nuevas para importar.', 'aviso'); return; }

    U.confirmar(
      'Confirmar importación',
      'Se van a procesar ' + U.miles(prev.nuevos) + ' renglones de ' + rotDestino() + '. ' +
      (prev.repetidos ? U.miles(prev.repetidos) + ' se saltean por estar repetidos. ' : '') +
      'Conviene tener un respaldo hecho antes de una carga grande.',
      function () { ejecutar(boton); },
      'Importar', 'btn-accion'
    );
  }

  function ejecutar(boton) {
    boton.disabled = true;

    var cuerpo = U.el('div');
    cuerpo.appendChild(U.el('p', { id: 'imp-txt', style: 'margin-top:0', text: 'Preparando…' }));
    var barra = U.el('div', { class: 'progreso' }, [U.el('div')]);
    cuerpo.appendChild(barra);
    U.modal({ titulo: 'Importando', cuerpo: cuerpo, botones: [] });

    var relleno = barra.firstChild;
    var texto = cuerpo.querySelector('#imp-txt');
    function progreso(p, msg) {
      relleno.style.width = Math.round(p * 100) + '%';
      if (msg) texto.textContent = msg;
    }

    var promesa = destino === 'ventas' ? importarVentas(progreso)
      : (destino === 'clientes' ? importarClientes(progreso) : importarCatalogo(progreso));

    promesa.then(function (res) {
      return App.cargarCache().then(function () { return res; });
    }).then(function (res) {
      U.cerrarModal();
      libro = null;
      var aDonde = destino === 'clientes' ? 'clientes' : (esCatalogo() ? 'catalogos' : 'consultas');
      U.modal({
        titulo: 'Importación terminada',
        cuerpo: '<div class="alerta alerta-ok" style="margin-bottom:14px">Se importaron <strong>' +
          U.miles(res.importados) + '</strong> registros.</div>' +
          '<ul style="line-height:1.8;margin:0;padding-left:20px">' +
          (res.actualizados ? '<li>Actualizados (ya existían): ' + U.miles(res.actualizados) + '</li>' : '') +
          '<li>Saltados por estar repetidos: ' + U.miles(res.repetidos) + '</li>' +
          '<li>Filas incompletas ignoradas: ' + U.miles(res.invalidos) + '</li>' +
          (res.omitidos ? '<li>No estaban en el catálogo y no se agregaron: ' + U.miles(res.omitidos) + '</li>' : '') +
          (res.equiposNuevos ? '<li>Equipos agregados al catálogo: ' + U.miles(res.equiposNuevos) + '</li>' : '') +
          (res.clientesNuevos ? '<li>Fichas de cliente creadas: ' + U.miles(res.clientesNuevos) + '</li>' : '') +
          '</ul>',
        botones: [{ texto: 'Ver el listado', clase: 'btn-primario', accion: function () { App.ir(aDonde); } },
                  { texto: 'Cerrar', clase: 'btn-borde', accion: function () { App.refrescar(); } }]
      });
    }).catch(function (e) {
      console.error(e);
      U.cerrarModal();
      boton.disabled = false;
      U.toast('Falló la importación: ' + e.message, 'error', 7000);
    });
  }

  /** Procesa un array en tandas, cediendo el hilo para que la barra avance. */
  function porTandas(items, tam, fn, alAvanzar) {
    var i = 0;
    function paso() {
      if (i >= items.length) return Promise.resolve();
      var tanda = items.slice(i, i + tam);
      return Promise.resolve(fn(tanda)).then(function () {
        i += tam;
        if (alAvanzar) alAvanzar(Math.min(i, items.length) / items.length);
        return new Promise(function (r) { setTimeout(r, 0); }).then(paso);
      });
    }
    return paso();
  }

  function importarVentas(progreso) {
    var filas = hoja().filas.slice(filaEncabezado + 1);
    var res = { importados: 0, repetidos: 0, invalidos: 0, equiposNuevos: 0, clientesNuevos: 0 };

    var seriesExistentes = {};
    App.cache.ventas.forEach(function (v) { if (v.nroSerie) seriesExistentes[U.norm(v.nroSerie)] = true; });

    var equiposPorNombre = {};
    App.cache.equipos.forEach(function (e) { equiposPorNombre[U.norm(e.nombre)] = e; });

    var clientesPorCuit = {};
    App.cache.clientes.forEach(function (c) { clientesPorCuit[U.soloDigitos(c.cuit)] = c; });

    var estadosValidos = {};
    (App.cache.listas.estados || Datos.ESTADOS).forEach(function (e) { estadosValidos[U.norm(e.nombre)] = e.nombre; });

    var nro = App.proximoNumero();
    var ahora = new Date().toISOString();
    var ventasNuevas = [], equiposNuevos = [], clientesNuevos = [];

    progreso(0.05, 'Armando los registros…');

    filas.forEach(function (f) {
      var vacia = CAMPOS_VENTA.every(function (c) { return celda(f, mapeo[c.clave]) === ''; });
      if (vacia) return;

      var serie = celda(f, mapeo.nroSerie);
      var equipo = celda(f, mapeo.equipoNombre);
      var cliente = celda(f, mapeo.clienteNombre);

      if (!serie || !equipo || !cliente) { res.invalidos++; return; }

      var claveSerie = U.norm(serie);
      if (seriesExistentes[claveSerie] && opciones.saltearRepetidos) { res.repetidos++; return; }
      seriesExistentes[claveSerie] = true;

      /* Equipo: se agrega al catálogo si no estaba */
      var eq = equiposPorNombre[U.norm(equipo)];
      if (!eq && opciones.crearEquipos) {
        eq = { id: U.id('eq'), nombre: equipo, activo: true };
        equiposPorNombre[U.norm(equipo)] = eq;
        equiposNuevos.push(eq);
      }

      /* Cliente: solo se crea ficha si hay CUIT */
      var cuit = U.soloDigitos(celda(f, mapeo.clienteCuit));
      var cli = cuit ? clientesPorCuit[cuit] : null;
      if (!cli && cuit && cuit.length === 11 && opciones.crearClientes) {
        cli = { id: U.id('cli'), cuit: cuit, razonSocial: cliente, activo: true, creadoEn: ahora };
        clientesPorCuit[cuit] = cli;
        clientesNuevos.push(cli);
      }

      var estadoCrudo = celda(f, mapeo.estado);
      var estado = estadosValidos[U.norm(estadoCrudo)] || Datos.ESTADO_HISTORICA;

      ventasNuevas.push({
        id: U.id('vta'),
        nro: nro++,
        origen: 'historica',
        fecha: normalizarFecha(celda(f, mapeo.fecha)),
        vendedorId: '',
        vendedorNombre: celda(f, mapeo.vendedorNombre),
        clienteId: cli ? cli.id : '',
        clienteCuit: cuit,
        clienteNombre: cliente,
        equipoId: eq ? eq.id : '',
        equipoNombre: equipo,
        nroSerie: serie,
        accionamiento: celda(f, mapeo.accionamiento),
        montadoSobre: celda(f, mapeo.montadoSobre),
        color: celda(f, mapeo.color),
        plataforma: '',
        tomaFuerza: false,
        tomaFuerzaNro: '',
        accesorios: [],
        medidasEspeciales: '',
        planillaId: null,
        cuitFacturacion: cuit,
        formaPago: '',
        plazoEntregaDias: '',
        fechaPrometida: '',
        moneda: 'ARS',
        alicuotaIva: 21,
        precioVenta: 0,
        precioAcordado: 0,
        estado: estado,
        autorizacion: null,
        creadoPor: Auth.usuario.nombre,
        creadoEn: ahora,
        actualizadoEn: ahora,
        historial: [{ fecha: ahora, usuario: Auth.usuario.nombre, accion: 'Importada del histórico', detalle: '' }]
      });
    });

    res.equiposNuevos = equiposNuevos.length;
    res.clientesNuevos = clientesNuevos.length;
    res.importados = ventasNuevas.length;

    progreso(0.1, 'Guardando ' + U.miles(ventasNuevas.length) + ' ventas…');

    return Store.bulk('equipos', equiposNuevos)
      .then(function () { return Store.bulk('clientes', clientesNuevos); })
      .then(function () {
        return porTandas(ventasNuevas, 400, function (tanda) {
          return Store.bulk('ventas', tanda);
        }, function (p) {
          progreso(0.1 + p * 0.9, 'Guardando… ' + Math.round(p * 100) + '%');
        });
      })
      .then(function () { return res; });
  }

  function importarClientes(progreso) {
    var filas = hoja().filas.slice(filaEncabezado + 1);
    var res = { importados: 0, repetidos: 0, invalidos: 0 };

    var porCuit = {};
    App.cache.clientes.forEach(function (c) { porCuit[U.soloDigitos(c.cuit)] = c; });

    var aGuardar = [];
    var vistos = {};
    var ahora = new Date().toISOString();

    progreso(0.05, 'Armando los registros…');

    filas.forEach(function (f) {
      var cuit = U.soloDigitos(celda(f, mapeo.cuit));
      var razon = celda(f, mapeo.razonSocial);
      if (!cuit && !razon) return;
      if (cuit.length !== 11 || !razon) { res.invalidos++; return; }
      if (vistos[cuit]) { res.repetidos++; return; }
      vistos[cuit] = true;

      var existente = porCuit[cuit];
      var reg = existente || { id: U.id('cli'), cuit: cuit, activo: true, creadoEn: ahora };
      reg.razonSocial = razon;
      ['nombreFantasia', 'condicionIva', 'direccion', 'localidad', 'provincia', 'telefono', 'email']
        .forEach(function (k) {
          var v = celda(f, mapeo[k]);
          if (v) reg[k] = v;
        });
      aGuardar.push(reg);
      if (!existente) res.importados++; else res.repetidos++;
    });

    progreso(0.15, 'Guardando…');
    return porTandas(aGuardar, 400, function (tanda) {
      return Store.bulk('clientes', tanda);
    }, function (p) {
      progreso(0.15 + p * 0.85, 'Guardando… ' + Math.round(p * 100) + '%');
    }).then(function () { return res; });
  }

  /**
   * Precios de equipos o accesorios.
   * Si el nombre ya está en el catálogo se le actualiza el precio;
   * si no está, se agrega (según la opción elegida).
   */
  function importarCatalogo(progreso) {
    var tienda = destino;                        // 'equipos' | 'accesorios'
    var filas = hoja().filas.slice(filaEncabezado + 1);
    var res = { importados: 0, actualizados: 0, repetidos: 0, invalidos: 0, omitidos: 0 };

    var porNombre = {};
    App.cache[tienda].forEach(function (i) { porNombre[U.norm(i.nombre)] = i; });

    var aGuardar = [];
    var vistos = {};

    progreso(0.05, 'Armando los registros…');

    filas.forEach(function (f) {
      var nombre = celda(f, mapeo.nombre);
      var precioCrudo = celda(f, mapeo.precio);
      if (!nombre && !precioCrudo) return;
      if (!nombre) { res.invalidos++; return; }

      var clave = U.norm(nombre);
      if (vistos[clave]) { res.repetidos++; return; }
      vistos[clave] = true;

      // U.num entiende "$ 1.250.000,50" igual que "1250000.5".
      var precio = U.num(String(precioCrudo).replace(/[^\d.,-]/g, ''));

      var existente = porNombre[clave];
      if (existente) {
        existente.precio = precio;
        aGuardar.push(existente);
        res.actualizados++;
        return;
      }
      if (!opciones.crearFaltantes) { res.omitidos++; return; }

      var nuevo = { id: U.id(tienda.slice(0, 3)), nombre: nombre, precio: precio, activo: true };
      porNombre[clave] = nuevo;
      aGuardar.push(nuevo);
      res.importados++;
    });

    progreso(0.15, 'Guardando…');
    return porTandas(aGuardar, 400, function (tanda) {
      return Store.bulk(tienda, tanda);
    }, function (p) {
      progreso(0.15 + p * 0.85, 'Guardando… ' + Math.round(p * 100) + '%');
    }).then(function () { return res; });
  }

  /** Acepta ISO, dd/mm/aaaa y dd-mm-aaaa. */
  function normalizarFecha(v) {
    if (!v) return '';
    var s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) {
      var a = m[3].length === 2 ? (Number(m[3]) > 50 ? '19' + m[3] : '20' + m[3]) : m[3];
      return a + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    }
    return '';
  }

     Respaldo

  Vistas.respaldo = {

      /* Exportar */
      var p1 = U.el('div', { class: 'panel' });

        U.el('div', {}, [U.el('h3', { text: 'Descargar respaldo' }),
          U.el('p', { class: 'sub', text: 'Genera un archivo .json con ventas, clientes, catálogos y usuarios.' })])
      ]));
      var c1 = U.el('div', { class: 'panel-cuerpo' });
      var b1 = U.el('button', { class: 'btn btn-primario', text: 'Descargar respaldo completo' });
      b1.addEventListener('click', function () {
        Store.exportar().then(function (datos) {
          U.descargar('respaldo_hidromecanica_' + U.hoyISO() + '.json',
            JSON.stringify(datos), 'application/json');
          U.toast('Respaldo descargado.', 'ok');
        });
      });
      c1.appendChild(b1);
      p1.appendChild(c1);
      cont.appendChild(p1);

      /* Importar */
      var p2 = U.el('div', { class: 'panel' });
      p2.appendChild(U.el('div', { class: 'panel-cab' }, [
        U.el('div', {}, [U.el('h3', { text: 'Restaurar desde un respaldo' }),
          U.el('p', { class: 'sub', text: 'Sirve también para pasar los datos a otra computadora.' })])
      ]));
      var c2 = U.el('div', { class: 'panel-cuerpo' });
      var inp = U.el('input', { type: 'file', accept: '.json', style: 'display:none' });
      var b2 = U.el('button', { class: 'btn btn-borde', text: 'Elegir archivo de respaldo' });
      b2.addEventListener('click', function () { inp.click(); });
      inp.addEventListener('change', function () {

                .then(function () { return App.cargarCache(); })
                .then(function () {
                  U.toast('Respaldo restaurado.', 'ok');
                  App.refrescar();
                })
                .catch(function (e) { U.toast(e.message, 'error'); });
            }, 'Restaurar');
        }).catch(function () {
          U.toast('El archivo no es un respaldo válido.', 'error');
        });
        inp.value = '';
      });
      c2.appendChild(b2);
      c2.appendChild(inp);
      p2.appendChild(c2);
      cont.appendChild(p2);

      /* Zona peligrosa */
      var p3 = U.el('div', { class: 'panel' });
      p3.appendChild(U.el('div', { class: 'panel-cab' }, [
        U.el('div', {}, [U.el('h3', { text: 'Borrar todo' }),
          U.el('p', { class: 'sub', text: 'Deja el sistema como recién instalado.' })])
      ]));
      var c3 = U.el('div', { class: 'panel-cuerpo' });
      var b3 = U.el('button', { class: 'btn btn-peligro', text: 'Borrar toda la información' });
      b3.addEventListener('click', function () {
        U.confirmar('Borrar todo',
          'Se borran TODAS las ventas, clientes, catálogos y usuarios. Asegurate de tener un respaldo. ' +
          'Después de esto vas a tener que volver a entrar con admin / admin123.',
          function () {
            Store.borrarTodo()
              .then(function () { Auth.salir(); global.location.reload(); });
          }, 'Sí, borrar todo');
      });
      c3.appendChild(b3);
      p3.appendChild(c3);
      cont.appendChild(p3);
    }
  };

})(window);

(function (global) {
  'use strict';

  var App = {};
  App.vistaActual = null;
  App.cache = {
    ventas: [], clientes: [], equipos: [], accesorios: [], usuarios: [],
    ingresos: [], reparaciones: [],
    listas: Datos.completarListas(null)
  };

  /* ═══════════════ Definición del menú ═══════════════ */

  var MENU = [
    { grupo: 'Ventas' },
    { id: 'consultas',     texto: 'Consultas',       ico: '☰' },
    { subtitulo: 'Gestión' },
    { id: 'venta',         texto: 'Venta',           ico: '+', sub: true },
    { id: 'ventaMultiple', texto: 'Venta múltiple',  ico: '⧉', sub: true },

    { grupo: 'Autorización', soloDueno: true },
    { id: 'autorizar',     texto: 'Autorizar',       ico: '✓', soloDueno: true, globo: 'pendientes' },

    { grupo: 'Taller' },
    { id: 'ingresos',      texto: 'Ingresos',        ico: '⇥' },
    { id: 'reparaciones',  texto: 'Reparaciones',    ico: '🔧' },

    { grupo: 'Datos' },
    { id: 'clientes',      texto: 'Clientes',        ico: '◫' },
    { id: 'catalogos',     texto: 'Equipos y accesorios', ico: '⚙' },

    { grupo: 'Administración', soloDueno: true },
    { id: 'importar',      texto: 'Importar Excel',  ico: '↥', soloDueno: true },
    { id: 'usuarios',      texto: 'Usuarios',        ico: '◎', soloDueno: true },
    { id: 'respaldo',      texto: 'Respaldo',        ico: '⛁', soloDueno: true }
  ];

  /* ═══════════════ Caché ═══════════════ */

  App.cargarCache = function () {
    return Promise.all([
      Store.all('ventas'), Store.all('clientes'), Store.all('equipos'),
      Store.all('accesorios'), Store.all('usuarios'), Store.getConfig('listas', null),
      Store.all('ingresos'), Store.all('reparaciones')
    ]).then(function (r) {
      App.cache.ventas = r[0] || [];
      App.cache.clientes = r[1] || [];
      App.cache.equipos = r[2] || [];
      App.cache.accesorios = r[3] || [];
      App.cache.usuarios = r[4] || [];
      App.cache.listas = Datos.completarListas(r[5]);
      App.cache.ingresos = r[6] || [];
      App.cache.reparaciones = r[7] || [];
    });
  };

  App.recargar = function (tienda) {
    if (tienda === 'listas') {
      return Store.getConfig('listas', null).then(function (l) { if (l) App.cache.listas = l; });
    }
    return Store.all(tienda).then(function (r) { App.cache[tienda] = r || []; });
  };

  /* ───── Consultas rápidas sobre la caché ───── */

  App.ventasPendientes = function () {
    return App.cache.ventas.filter(function (v) {
      return v.autorizacion && v.autorizacion.estado === 'pendiente';
    });
  };

  App.ventasVisibles = function () {
    // Todo lo que ya pasó por autorización (o que es histórico importado).
    return App.cache.ventas.filter(function (v) {
      return !v.autorizacion || v.autorizacion.estado !== 'pendiente';
    });
  };

  App.vendedores = function () {
    return App.cache.usuarios.filter(function (u) { return u.activo; });
  };

  App.equiposActivos = function () {
    return U.ordenarPor(App.cache.equipos.filter(function (e) { return e.activo !== false; }), 'nombre');
  };

  App.accesoriosActivos = function () {
    return U.ordenarPor(App.cache.accesorios.filter(function (e) { return e.activo !== false; }), 'nombre');
  };

  App.clientePorCuit = function (cuit) {
    var d = U.soloDigitos(cuit);
    return App.cache.clientes.filter(function (c) { return U.soloDigitos(c.cuit) === d; })[0] || null;
  };

  App.proximoNumero = function () {
    var max = 0;
    App.cache.ventas.forEach(function (v) { if (Number(v.nro) > max) max = Number(v.nro); });
    return max + 1;
  };

  App.ventaPorId = function (id) {
    return App.cache.ventas.filter(function (v) { return v.id === id; })[0] || null;
  };

  /** Reparaciones de una venta puntual (el equipo con ese número de serie). */
  App.reparacionesDeVenta = function (venta) {
    return App.cache.reparaciones.filter(function (r) {
      if (r.ventaId && r.ventaId === venta.id) return true;
      return !!(r.nroSerie && venta.nroSerie && U.norm(r.nroSerie) === U.norm(venta.nroSerie));
    }).sort(function (a, b) {
      return String(b.fechaIngreso || '').localeCompare(String(a.fechaIngreso || ''));
    });
  };

  App.ingresosDeVenta = function (venta) {
    return App.cache.ingresos.filter(function (i) {
      if (i.ventaId && i.ventaId === venta.id) return true;
      return !!(i.nroSerie && venta.nroSerie && U.norm(i.nroSerie) === U.norm(venta.nroSerie));
    });
  };

  /* ═══════════════ Migración de datos viejos ═══════════════ */

  /**
   * Pone al día las ventas guardadas con versiones anteriores del sistema:
   * campos nuevos que antes no existían y el estado que cambió de nombre.
   * Solo escribe las que realmente cambiaron.
   */
  App.migrar = function () {
    var cambiadas = [];

    App.cache.ventas.forEach(function (v) {
      var toco = false;

      if (v.estado === 'En producción') { v.estado = 'En fábrica'; toco = true; }

      // Campos agregados después de la primera versión.
      var nuevos = {
        nroFactura: '', facturaId: null,
        nroRemito: '', remitoId: null,
        estadoPago: '', fechaEntrega: '', garantiaDias: '',
        observaciones: '', dimensiones: '',
        // Datos de la hoja que va a fábrica; los completa el ingeniero.
        voltaje: '', ancho: '', largo: '', biela: ''
      };
      Object.keys(nuevos).forEach(function (k) {
        if (v[k] === undefined) { v[k] = nuevos[k]; toco = true; }
      });

      // Los accesorios ahora guardan también el precio con el que se vendieron.
      (v.accesorios || []).forEach(function (a) {
        if (a.precioUnitario === undefined) { a.precioUnitario = 0; toco = true; }
      });

      // El cuadro que estaba como "Dimensiones" en el formulario pasó a ser
      // "Observaciones". Lo que se hubiera escrito ahí se mueve, para no perderlo.
      // "dimensiones" sigue existiendo, pero ahora solo se carga desde la hoja
      // de fábrica de tijeras, niveladores, cajas y prensas.
      if (v.dimensiones && !v.observaciones) {
        v.observaciones = v.dimensiones;
        toco = true;
      }

      if (toco) { delete v._busqueda; cambiadas.push(v); }
    });

    // Los equipos necesitan precio, familia (auxilio / plataforma / general)
    // y rubro (la sección de la lista de precios).
    var equiposTocados = App.cache.equipos.filter(function (e) {
      return e.precio === undefined || e.tipo === undefined || e.rubro === undefined;
    });
    equiposTocados.forEach(function (e) {
      if (e.precio === undefined) e.precio = 0;
      if (e.tipo === undefined) e.tipo = Datos.adivinarTipoEquipo(e.nombre);
      if (e.rubro === undefined) e.rubro = '';
    });

    var faltaPrecioAcc = App.cache.accesorios.filter(function (a) { return a.precio === undefined; });
    faltaPrecioAcc.forEach(function (a) { a.precio = 0; });

    if (!cambiadas.length && !equiposTocados.length && !faltaPrecioAcc.length) return Promise.resolve();

    return Store.bulk('ventas', cambiadas)
      .then(function () { return Store.bulk('equipos', equiposTocados); })
      .then(function () { return Store.bulk('accesorios', faltaPrecioAcc); });
  };

  /** Familia del equipo de una venta (para saber qué hoja imprimir). */
  App.tipoDeVenta = function (v) {
    var eq = App.cache.equipos.filter(function (e) {
      return e.id === v.equipoId || e.nombre === v.equipoNombre;
    })[0];
    if (eq && eq.tipo) return eq.tipo;
    return Datos.adivinarTipoEquipo(v.equipoNombre);
  };

  /** Borra una venta y los archivos que tenía colgando. */
  App.borrarVenta = function (v) {
    var archivos = [v.planillaId, v.facturaId, v.remitoId].filter(Boolean);
    return Promise.all(archivos.map(function (id) { return Store.del('archivos', id); }))
      .then(function () { return Store.del('ventas', v.id); })
      .then(function () {
        App.cache.ventas = App.cache.ventas.filter(function (x) { return x.id !== v.id; });
      });
  };

  /* ═══════════════ Navegación ═══════════════ */

  App.pintarMenu = function () {
    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    var dueno = Auth.esDueno();

    MENU.forEach(function (m) {
      if (m.soloDueno && !dueno) return;

      if (m.grupo) {
        nav.appendChild(U.el('div', { class: 'nav-grupo', text: m.grupo }));
        return;
      }
      if (m.subtitulo) {
        nav.appendChild(U.el('div', { class: 'nav-grupo', text: m.subtitulo }));
        return;
      }

      var hijos = [
        U.el('span', { class: 'ico', text: m.ico || '' }),
        U.el('span', { text: m.texto })
      ];

      if (m.globo === 'pendientes') {
        var n = App.ventasPendientes().length;
        if (n) hijos.push(U.el('span', { class: 'globo', text: String(n) }));
      }

      var b = U.el('button', {
        class: 'nav-item' + (m.sub ? ' nav-sub' : '') + (App.vistaActual === m.id ? ' activo' : ''),
        'data-vista': m.id
      }, hijos);
      b.addEventListener('click', function () { App.ir(m.id); });
      nav.appendChild(b);
    });
  };

  App.ir = function (idVista, params) {
    var def = global.Vistas[idVista];
    if (!def) { U.toast('Esa sección todavía no está disponible.', 'aviso'); return; }
    if (def.soloDueno && !Auth.esDueno()) {
      U.toast('Esta sección es solo para Gerencia.', 'error');
      return;
    }

    App.vistaActual = idVista;
    App.pintarMenu();

    document.getElementById('titulo-vista').textContent = def.titulo || '';
    document.getElementById('subtitulo-vista').textContent =
      typeof def.sub === 'function' ? def.sub() : (def.sub || '');

    var acciones = document.getElementById('topbar-acciones');
    acciones.innerHTML = '';

    var cont = document.getElementById('vista');
    cont.innerHTML = '';
    window.scrollTo(0, 0);

    try {
      def.render(cont, acciones, params || {});
    } catch (e) {
      console.error(e);
      cont.innerHTML = '<div class="alerta alerta-error">Se produjo un error al abrir esta sección: ' +
        U.esc(e.message) + '</div>';
    }
  };

  /** Vuelve a dibujar la vista actual (después de guardar algo). */
  App.refrescar = function () {
    if (App.vistaActual) App.ir(App.vistaActual);
  };

  /* ═══════════════ Avisos de la parte superior ═══════════════ */

  App.pintarAvisos = function () {
    var cont = document.getElementById('avisos');
    cont.innerHTML = '';

    if (Store.modo === 'memoria') {
      cont.appendChild(U.el('div', { class: 'alerta alerta-error' }, [
        U.el('span', { html: '<strong>Atención: no se está guardando nada.</strong> Este navegador tiene ' +
          'el almacenamiento bloqueado, así que todo lo que cargues se pierde al cerrar la pestaña. ' +
          'Abrí el archivo con doble clic desde una carpeta (no desde una ventana privada ni desde un correo).' })
      ]));
    } else if (Store.modo === 'ls') {
      cont.appendChild(U.el('div', { class: 'alerta alerta-aviso' }, [
        U.el('span', { html: '<strong>Modo de guardado reducido.</strong> El navegador no habilitó ' +
          'la base de datos local, así que se está usando un espacio más chico. Los PDF ocupan mucho: ' +
          'conviene exportar respaldos seguido desde Administración → Respaldo.' })
      ]));
    }

    var admin = App.cache.usuarios.filter(function (u) { return u.claveInicial; });
    if (admin.length && Auth.esDueno()) {
      var av = U.el('div', { class: 'alerta alerta-aviso' }, [
        U.el('span', { html: '<strong>Contraseña por defecto sin cambiar.</strong> El usuario ' +
          '<code>admin</code> sigue con la contraseña inicial.' })
      ]);
      var b = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Cambiar ahora' });
      b.addEventListener('click', function () { App.ir('usuarios'); });
      av.appendChild(b);
      cont.appendChild(av);
    }
  };

  /* ═══════════════ Visor de PDF ═══════════════ */

  var urlVisorActual = null;

  App.abrirPDF = function (idArchivo, titulo) {
    Store.urlArchivo(idArchivo).then(function (a) {
      if (!a) { U.toast('No se encontró la planilla adjunta.', 'error'); return; }
      cerrarVisor();
      urlVisorActual = a.esObjeto ? a.url : null;
      mostrarVisor('pdf', a.url, titulo || a.nombre || 'Planilla de medidas');
    }).catch(function (e) {
      U.toast('No se pudo abrir el PDF: ' + e.message, 'error');
    });
  };

  /** Abre el visor con una URL ya armada (PDF todavía no guardado). */
  App.abrirPDFUrl = function (url, titulo) {
    cerrarVisor();
    mostrarVisor('pdf', url, titulo || 'Planilla de medidas');
  };

  /** Abre una foto a pantalla completa. */
  App.abrirFoto = function (idArchivo, titulo) {
    Store.urlArchivo(idArchivo).then(function (a) {
      if (!a) { U.toast('No se encontró la foto.', 'error'); return; }
      cerrarVisor();
      urlVisorActual = a.esObjeto ? a.url : null;
      mostrarVisor('img', a.url, titulo || a.nombre || 'Foto');
    });
  };

  App.abrirFotoUrl = function (url, titulo) {
    cerrarVisor();
    mostrarVisor('img', url, titulo || 'Foto');
  };

  function mostrarVisor(tipo, url, titulo) {
    var marco = document.getElementById('visor-iframe');
    var caja = document.getElementById('visor-imagen');
    var img = document.getElementById('visor-img');

    document.getElementById('visor-titulo').textContent = titulo;
    if (tipo === 'img') {
      marco.classList.add('oculto');
      caja.classList.remove('oculto');
      img.src = url;
    } else {
      caja.classList.add('oculto');
      marco.classList.remove('oculto');
      marco.src = url;
    }
    document.getElementById('visor-fondo').classList.remove('oculto');
    document.getElementById('visor-nueva').onclick = function () { global.open(url, '_blank'); };
  }

  function cerrarVisor() {
    document.getElementById('visor-fondo').classList.add('oculto');
    document.getElementById('visor-iframe').src = 'about:blank';
    document.getElementById('visor-img').src = '';
    if (urlVisorActual) { URL.revokeObjectURL(urlVisorActual); urlVisorActual = null; }
  }

  App.cerrarVisor = cerrarVisor;

  /* ═══════════════ Bitácora ═══════════════ */

  App.anotar = function (venta, accion, detalle) {
    if (!venta.historial) venta.historial = [];
    venta.historial.push({
      fecha: new Date().toISOString(),
      usuario: Auth.usuario ? Auth.usuario.nombre : '—',
      accion: accion,
      detalle: detalle || ''
    });
  };

  /* ═══════════════ Sesión ═══════════════ */

  function mostrarLogin() {
    document.getElementById('pantalla-login').classList.remove('oculto');
    document.getElementById('app').classList.add('oculto');
    document.getElementById('login-usuario').focus();
  }

  function mostrarApp() {
    document.getElementById('pantalla-login').classList.add('oculto');
    document.getElementById('app').classList.remove('oculto');

    var u = Auth.usuario;
    document.getElementById('usr-nombre').textContent = u.nombre;
    document.getElementById('usr-rol').textContent = Auth.rolTexto(u.rol);
    document.getElementById('usr-avatar').textContent = U.iniciales(u.nombre);
    document.getElementById('pie-almacenamiento').textContent =
      Store.modo === 'idb' ? 'Guardado local · base de datos'
        : (Store.modo === 'ls' ? 'Guardado local · modo reducido' : 'SIN GUARDADO — solo lectura');

    App.pintarAvisos();
    App.ir('consultas');
  }

  App.entrar = function () {
    return App.cargarCache().then(mostrarApp);
  };

  /* ═══════════════ Arranque ═══════════════ */

  /** Pone los logos de REFIRE (vienen incrustados en logos.js). */
  function pintarLogos() {
    if (!global.Logos) return;
    var login = document.getElementById('logo-login');
    var iso = document.getElementById('logo-iso');
    if (login) login.src = Logos.completo;
    if (iso) iso.src = Logos.iso;
  }

  function iniciar() {
    pintarLogos();

    Store.init()
      .then(function () { return Datos.sembrar(); })
      .then(function () { return App.cargarCache(); })
      .then(function () { return App.migrar(); })
      .then(function () { return Auth.restaurar(); })
      .then(function (u) {
        document.getElementById('cargando').classList.add('oculto');
        var pie = document.getElementById('login-pie');
        if (App.cache.usuarios.some(function (x) { return x.claveInicial; })) {
          pie.innerHTML = 'Primer ingreso: usuario <strong>admin</strong> · contraseña <strong>admin123</strong><br>' +
            'Cambiala apenas entres, desde Administración → Usuarios.';
        } else {
          pie.textContent = 'Sistema de gestión de ventas y producción';
        }
        if (u) mostrarApp(); else mostrarLogin();
      })
      .catch(function (e) {
        console.error(e);
        document.getElementById('cargando').innerHTML =
          '<div class="alerta alerta-error" style="max-width:520px">No se pudo iniciar el sistema:<br><br>' +
          U.esc(e.message) + '</div>';
      });

    /* Login */
    document.getElementById('form-login').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var err = document.getElementById('login-error');
      err.classList.add('oculto');
      var usuario = document.getElementById('login-usuario').value.trim();
      var clave = document.getElementById('login-clave').value;

      Auth.ingresar(usuario, clave).then(function () {
        document.getElementById('login-clave').value = '';
        return App.entrar();
      }).catch(function (e) {
        err.textContent = e.message;
        err.classList.remove('oculto');
      });
    });

    document.getElementById('btn-salir').addEventListener('click', function () {
      Auth.salir();
      document.getElementById('login-usuario').value = '';
      document.getElementById('login-clave').value = '';
      mostrarLogin();
    });

    /* Modales */
    document.getElementById('modal-cerrar').addEventListener('click', U.cerrarModal);
    document.getElementById('modal-fondo').addEventListener('click', function (ev) {
      if (ev.target === this) U.cerrarModal();
    });
    document.getElementById('visor-cerrar').addEventListener('click', cerrarVisor);
    document.getElementById('visor-fondo').addEventListener('click', function (ev) {
      if (ev.target === this) cerrarVisor();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if (!document.getElementById('visor-fondo').classList.contains('oculto')) cerrarVisor();
      else if (!document.getElementById('modal-fondo').classList.contains('oculto')) U.cerrarModal();
    });
  }

  global.App = App;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(window);
</script>
</body>
</html>
