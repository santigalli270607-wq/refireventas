        U.el('td', { text: r.equipoNombre || '—' }),
        U.el('td', {}, [U.el('span', { class: 'serie', text: r.nroSerie || '—' })]),
        U.el('td', { text: r.clienteNombre || '—' }),
        U.el('td', { class: 'txt-chico', text: (r.falla || '').slice(0, 60) || '—' }),
        U.el('td', { html: r.enGarantia
          ? '<span class="pill pill-verde">En garantía</span>'
          : '<span class="txt-chico">—</span>' }),
        U.el('td', { html: '<span class="pill pill-' + Datos.colorEstadoReparacion(r.estado) + '">' +
          U.esc(r.estado || '—') + '</span>' })
      ]);
      tr.addEventListener('click', function () { verReparacion(r); });
      tb.appendChild(tr);
    });
    tabla.appendChild(tb);
    scroll.appendChild(tabla);
    panel.appendChild(scroll);
    cont.appendChild(panel);
  }

  /* ═══════════════ Alta / edición ═══════════════ */

  function proximoNro() {
    var max = 0;
    App.cache.reparaciones.forEach(function (r) { if (Number(r.nro) > max) max = Number(r.nro); });
    return max + 1;
  }

  /**
   * @param {object|null} reparacion  para editar
   * @param {object|null} venta       equipo elegido (obligatorio al crear)
   * @param {object|null} ingreso     ingreso a planta del que sale, si aplica
   */
  function formReparacion(reparacion, venta, ingreso) {
    var esNueva = !reparacion;
    var reg = reparacion ? U.clonar(reparacion) : {
      id: U.id('rep'),
      nro: proximoNro(),
      fechaIngreso: (ingreso && ingreso.fechaIngreso) || U.hoyISO(),
      estado: 'Ingresada',
      repuestos: [],
      fotos: (ingreso && ingreso.fotos ? ingreso.fotos.slice() : [])
    };

    var ventaVinc = venta || (reg.ventaId ? App.ventaPorId(reg.ventaId) : null);
    if (ventaVinc) {
      reg.ventaId = ventaVinc.id;
      reg.equipoNombre = reg.equipoNombre || ventaVinc.equipoNombre;
      reg.nroSerie = reg.nroSerie || ventaVinc.nroSerie;
      reg.clienteNombre = reg.clienteNombre || ventaVinc.clienteNombre;
    }
    if (ingreso) reg.ingresoId = ingreso.id;

    var panel = U.el('div', { class: 'panel' });

    /* ── 1. Equipo ── */
    var cajaEq = U.el('div');
    var zonaEq = U.el('div');
    cajaEq.appendChild(zonaEq);

    function pintarEquipo() {
      zonaEq.innerHTML = '';
      if (ventaVinc) {
        zonaEq.appendChild(C.tarjetaVenta(ventaVinc, function () {
          C.elegirVenta(function (v) {
            ventaVinc = v;
            reg.ventaId = v.id;
            reg.equipoNombre = v.equipoNombre;
            reg.nroSerie = v.nroSerie;
            reg.clienteNombre = v.clienteNombre;
            actualizarGarantia();
            pintarEquipo();
          });
        }));
      } else {
        var b = U.el('button', { class: 'btn btn-primario', type: 'button', text: 'Elegir el equipo vendido' });
        b.addEventListener('click', function () {
          C.elegirVenta(function (v) {
            ventaVinc = v; reg.ventaId = v.id;
            reg.equipoNombre = v.equipoNombre; reg.nroSerie = v.nroSerie; reg.clienteNombre = v.clienteNombre;
            actualizarGarantia();
            pintarEquipo();
          });
        });
        zonaEq.appendChild(b);
      }
    }
    pintarEquipo();
    panel.appendChild(C.seccion(1, 'Equipo a reparar', cajaEq));

    /* ── 2. Datos de la reparación ── */
    var inpFechaIng = C.inp({ type: 'date', value: reg.fechaIngreso || U.hoyISO() });
    var inpFechaSal = C.inp({ type: 'date', value: reg.fechaSalida || '' });
    var selEstado = C.selEstado(Datos.listaEstadosReparacion(), reg.estado || 'Ingresada', null);
    var inpTecnico = C.inp({ type: 'text', value: reg.tecnico || '', placeholder: 'Quién la hace' });

    var chkGarantia = U.el('input', { type: 'checkbox' });
    chkGarantia.checked = !!reg.enGarantia;
    var textoGarantia = U.el('span', { class: 'txt-chico' });

    function actualizarGarantia() {
      var dentro = C.enGarantia(ventaVinc, inpFechaIng.value);
      if (esNueva) chkGarantia.checked = dentro;
      var g = ventaVinc ? U.garantia(ventaVinc.fechaEntrega, ventaVinc.garantiaDias) : null;
      if (!g) {
        textoGarantia.textContent = 'El equipo no tiene garantía cargada.';
      } else if (dentro) {
        textoGarantia.textContent = 'Le quedan ' + g.restantes + ' días (vence el ' + U.fecha(g.vence) + ').';
      } else {
        textoGarantia.textContent = 'La garantía venció el ' + U.fecha(g.vence) + '.';
      }
    }
    inpFechaIng.addEventListener('change', actualizarGarantia);
    actualizarGarantia();

    var campoGar = U.el('div', { class: 'campo' }, [
      U.el('span', { text: 'Garantía' }),
      U.el('label', { class: 'check' }, [chkGarantia, U.el('span', { text: 'Entra por garantía' })]),
      textoGarantia
    ]);

    var txtFalla = U.el('textarea', { rows: '3', placeholder: 'Qué informó el cliente que le pasa al equipo' });
    txtFalla.value = reg.falla || '';
    var txtDiag = U.el('textarea', { rows: '3', placeholder: 'Qué se encontró al revisarlo' });
    txtDiag.value = reg.diagnostico || '';
    var txtTrabajos = U.el('textarea', { rows: '4', placeholder: 'Qué se hizo' });
    txtTrabajos.value = reg.trabajos || '';

    var g2 = U.el('div', { class: 'grid g3' });
    g2.appendChild(C.campo('Fecha de ingreso *', inpFechaIng));
    g2.appendChild(C.campo('Fecha de salida', inpFechaSal, 'Cuando se entrega'));
    g2.appendChild(C.campo('Estado', selEstado));
    g2.appendChild(C.campo('Técnico', inpTecnico));
    g2.appendChild(campoGar);
    g2.appendChild(U.el('div', { class: 'col-todo' }, [C.campo('Falla informada', txtFalla)]));
    g2.appendChild(U.el('div', { class: 'col-todo' }, [C.campo('Diagnóstico', txtDiag)]));
    g2.appendChild(U.el('div', { class: 'col-todo' }, [C.campo('Trabajos realizados', txtTrabajos)]));
    panel.appendChild(C.seccion(2, 'Detalle de la reparación', g2));

    /* ── 3. Repuestos y costos ── */
    var cajaRep = U.el('div');
    var contRep = U.el('div');
    cajaRep.appendChild(contRep);

    function filaRepuesto(datos) {
      datos = datos || {};
      var fila = U.el('div', { class: 'fila-accesorio' });
      var nom = C.inp({ type: 'text', value: datos.nombre || '', placeholder: 'Repuesto' });
      var cant = C.inp({ type: 'number', min: '1', step: '1', value: datos.cantidad || 1 });
      var x = U.el('button', { class: 'btn btn-borde', type: 'button', text: '×', title: 'Quitar' });
      x.addEventListener('click', function () { fila.remove(); recalcular(); });

      var precio = C.inp({ type: 'number', min: '0', step: '0.01', value: datos.precioUnitario || 0 });
      precio.addEventListener('input', recalcular);
      cant.addEventListener('input', recalcular);

      fila.style.gridTemplateColumns = '1fr 90px 130px 40px';
      fila.appendChild(C.campo('Repuesto', nom));
      fila.appendChild(C.campo('Cant.', cant));
      fila.appendChild(C.campo('Precio unit.', precio));
      fila.appendChild(x);
      fila._leer = function () {
        if (!nom.value.trim()) return null;
        return {
          nombre: nom.value.trim(),
          cantidad: Math.max(1, Number(cant.value) || 1),
          precioUnitario: Number(precio.value) || 0
        };
      };
      return fila;
    }

    (reg.repuestos || []).forEach(function (r) { contRep.appendChild(filaRepuesto(r)); });

    var bAddRep = U.el('button', { class: 'btn btn-chico btn-borde', type: 'button', text: '+ Agregar repuesto' });
    bAddRep.addEventListener('click', function () { contRep.appendChild(filaRepuesto()); recalcular(); });
    cajaRep.appendChild(bAddRep);

    cajaRep.appendChild(U.el('div', { class: 'sep' }));
    var inpManoObra = C.inp({ type: 'number', min: '0', step: '0.01', value: reg.manoObra || 0 });
    inpManoObra.addEventListener('input', recalcular);
    var gCosto = U.el('div', { class: 'grid g2' });

    var totales = U.el('div', { class: 'total-caja' });
    gCosto.appendChild(totales);
    cajaRep.appendChild(gCosto);

    function recalcular() {
      var repuestos = U.$$('.fila-accesorio', contRep).map(function (f) { return f._leer(); }).filter(Boolean);
      var totRep = repuestos.reduce(function (a, r) { return a + r.cantidad * r.precioUnitario; }, 0);
      var mo = Number(inpManoObra.value) || 0;
      var enGar = chkGarantia.checked;

      totales.innerHTML = '';
      totales.appendChild(U.el('div', { class: 'total-linea' }, [
        U.el('span', { text: 'Repuestos' }), U.el('strong', { text: U.plata(totRep) })]));
      totales.appendChild(U.el('div', { class: 'total-linea' }, [
        U.el('span', { text: 'Mano de obra' }), U.el('strong', { text: U.plata(mo) })]));
      totales.appendChild(U.el('div', { class: 'total-linea grande' }, [
        U.el('span', { text: enGar ? 'Total (sin cargo por garantía)' : 'Total a cobrar' }),
        U.el('span', { text: enGar ? U.plata(0) : U.plata(totRep + mo) })]));
    }
    chkGarantia.addEventListener('change', recalcular);
    recalcular();

    panel.appendChild(C.seccion(3, 'Repuestos y costos', cajaRep));

    /* ── 4. Fotos ── */
    var fotos = Fotos.bloque(reg.fotos || []);
    panel.appendChild(C.seccion(4, 'Fotos', fotos.el));

    /* ── Acciones ── */
    var acciones = U.el('div', { class: 'acciones-form' });
    var bCancelar = U.el('button', { class: 'btn btn-borde', type: 'button', text: 'CANCELAR' });
    bCancelar.addEventListener('click', function () {
      fotos.descartarNuevas();
      App.ir('reparaciones');
    });
    var bGuardar = U.el('button', { class: 'btn btn-accion', type: 'button',
      text: esNueva ? 'GUARDAR REPARACIÓN' : 'GUARDAR CAMBIOS' });
    bGuardar.addEventListener('click', function () {
      if (!ventaVinc) { U.toast('Elegí el equipo que se va a reparar.', 'error'); return; }
      if (!inpFechaIng.value) { U.toast('Cargá la fecha de ingreso.', 'error'); return; }

      var repuestos = U.$$('.fila-accesorio', contRep).map(function (f) { return f._leer(); }).filter(Boolean);
      var totRep = repuestos.reduce(function (a, r) { return a + r.cantidad * r.precioUnitario; }, 0);

      reg.ventaId = ventaVinc.id;
      reg.equipoNombre = ventaVinc.equipoNombre;
      reg.nroSerie = ventaVinc.nroSerie;
      reg.clienteNombre = ventaVinc.clienteNombre;
      reg.fechaIngreso = inpFechaIng.value;
      reg.fechaSalida = inpFechaSal.value;
      reg.estado = selEstado.value;
      reg.tecnico = inpTecnico.value.trim();
      reg.enGarantia = chkGarantia.checked;
      reg.falla = txtFalla.value.trim();
      reg.diagnostico = txtDiag.value.trim();
      reg.trabajos = txtTrabajos.value.trim();
      reg.repuestos = repuestos;
      reg.manoObra = Number(inpManoObra.value) || 0;
      reg.total = chkGarantia.checked ? 0 : totRep + reg.manoObra;
      reg.fotos = fotos.ids();
      reg.actualizadoEn = new Date().toISOString();
      if (esNueva) { reg.creadoPor = Auth.usuario.nombre; reg.creadoEn = reg.actualizadoEn; }

      Store.put('reparaciones', reg)
        .then(function () { return App.recargar('reparaciones'); })
        .then(function () {
          fotos.confirmar();
          U.toast(esNueva ? 'Reparación cargada.' : 'Reparación actualizada.', 'ok');
          App.ir('reparaciones');
        })
        .catch(function (e) { U.toast('No se pudo guardar: ' + e.message, 'error'); });
    });
    acciones.appendChild(bCancelar);
    acciones.appendChild(bGuardar);
    panel.appendChild(acciones);

    document.getElementById('titulo-vista').textContent = esNueva ? 'Nueva reparación' : 'Editar reparación N° ' + reg.nro;
    document.getElementById('subtitulo-vista').textContent =
      ventaVinc ? (ventaVinc.equipoNombre || '') + ' — ' + (ventaVinc.clienteNombre || '') : '';
    document.getElementById('topbar-acciones').innerHTML = '';
    var vista = document.getElementById('vista');
    vista.innerHTML = '';
    vista.appendChild(panel);
    global.scrollTo(0, 0);
  }

  /* ═══════════════ Ficha ═══════════════ */

/* ───────── app/js/vistas/clientes.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/clientes.js — alta y consulta de clientes

   El CUIT es la clave: es lo que el vendedor tipea en la
   venta para que se completen todos los datos solos.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};

  var busqueda = '';

  Vistas.clientes = {
    titulo: 'Clientes',
    sub: function () { return U.miles(App.cache.clientes.length) + ' clientes cargados'; },

    render: function (cont, acciones) {
      var bNuevo = U.el('button', { class: 'btn btn-accion', text: '+ Nuevo cliente' });
      bNuevo.addEventListener('click', function () {
        Vistas.formCliente(null, function () { App.refrescar(); });
      });

      var bExp = U.el('button', { class: 'btn btn-borde', text: 'Exportar' });
      bExp.addEventListener('click', exportar);
      acciones.appendChild(bExp);

      var panel = U.el('div', { class: 'panel' });

      /* Buscador */
      var cabPanel = U.el('div', { class: 'panel-cuerpo', style: 'border-bottom:1px solid var(--gris-2)' });
      var wrap = U.el('div', { class: 'barra-buscar', style: 'max-width:420px' });
      var inpBuscar = U.el('input', { type: 'text', placeholder: 'Buscar por razón social, fantasía o CUIT…', value: busqueda });
      inpBuscar.addEventListener('input', U.debounce(function () {
        busqueda = inpBuscar.value;
        pintar(lista);
      }, 200));
      wrap.appendChild(inpBuscar);
      cabPanel.appendChild(wrap);
      panel.appendChild(cabPanel);

      var lista = U.el('div');
      panel.appendChild(lista);
      cont.appendChild(panel);
      pintar(lista);
    }
  };

  function filtrados() {
    var t = U.norm(busqueda);
    var res = App.cache.clientes.filter(function (c) {
      if (!t) return true;
      return U.norm([c.razonSocial, c.nombreFantasia, c.cuit, c.localidad].join(' ')).indexOf(t) !== -1;
    });
    return U.ordenarPor(res, 'razonSocial');
  }

  function pintar(cont) {
    cont.innerHTML = '';
    var res = filtrados();

    if (!res.length) {
      cont.appendChild(U.el('div', { class: 'vacio' }, [
        U.el('div', { class: 'grande', text: '◫' }),
        U.el('div', { text: App.cache.clientes.length
          ? 'Ningún cliente coincide con la búsqueda.'
          : 'Todavía no hay clientes cargados.' })
      ]));
      return;
    }

    var scroll = U.el('div', { class: 'tabla-scroll' });
    var tabla = U.el('table', { class: 'tabla' });
    tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
      U.el('th', { text: 'Razón social' }),
      U.el('th', { text: 'CUIT', style: 'width:140px' }),
      U.el('th', { text: 'Condición IVA', style: 'width:170px' }),
      U.el('th', { text: 'Localidad' }),
      U.el('th', { text: 'Teléfono', style: 'width:150px' }),
      U.el('th', { text: 'Ventas', style: 'width:80px' }),
      U.el('th', { text: '', style: 'width:90px' })
    ])]));

    var tb = U.el('tbody');
    res.slice(0, 500).forEach(function (c) {
      var ventas = App.cache.ventas.filter(function (v) {
        return U.soloDigitos(v.clienteCuit) === U.soloDigitos(c.cuit);
      }).length;

      var bEd = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Editar' });
      bEd.addEventListener('click', function () {
        Vistas.formCliente(c, function () { App.refrescar(); });
      });

      tb.appendChild(U.el('tr', {}, [
        U.el('td', {}, [
          U.el('div', { text: c.razonSocial || '—' }),
          c.nombreFantasia ? U.el('div', { class: 'txt-chico', text: c.nombreFantasia }) : null
        ]),
        U.el('td', { class: 'nowrap', text: U.cuitFmt(c.cuit) }),
        U.el('td', { text: c.condicionIva || '—' }),
        U.el('td', { text: c.localidad || '—' }),
        U.el('td', { text: c.telefono || '—' }),
        U.el('td', { class: 'num-col', text: U.miles(ventas) }),
        U.el('td', {}, [bEd])
      ]));
    });
    tabla.appendChild(tb);
    scroll.appendChild(tabla);
    cont.appendChild(scroll);

    if (res.length > 500) {
      cont.appendChild(U.el('div', { class: 'paginacion' }, [
        U.el('div', { class: 'info', text: 'Se muestran los primeros 500 de ' + U.miles(res.length) +
          '. Afiná la búsqueda para ver el resto.' })
      ]));
    }
  }

  /* ═══════════════ Formulario ═══════════════ */

  /**
   * Alta o edición de cliente.
   * @param {object|null} cliente  null = alta; puede venir { cuit } precargado
   * @param {function}    alGuardar
   */
  Vistas.formCliente = function (cliente, alGuardar) {
    var esEdicion = !!(cliente && cliente.id);
    var c = cliente || {};

    function campo(rot, control, ancho) {
      var l = U.el('label', { class: 'campo' }, [U.el('span', { text: rot }), control]);
      if (ancho) l.style.gridColumn = '1/-1';
      return l;
    }

    var inpCuit = U.el('input', { type: 'text', value: c.cuit ? U.cuitFmt(c.cuit) : '', placeholder: '30-12345678-9' });
    var inpRazon = U.el('input', { type: 'text', value: c.razonSocial || '' });
    var inpFantasia = U.el('input', { type: 'text', value: c.nombreFantasia || '' });
    var selIva = U.el('select');
    (App.cache.listas.condicionesIva || Datos.CONDICIONES_IVA).forEach(function (o) {
      var op = U.el('option', { value: o, text: o });
      if (o === c.condicionIva) op.selected = true;
      selIva.appendChild(op);
    });
    var inpDir = U.el('input', { type: 'text', value: c.direccion || '' });
    var inpLoc = U.el('input', { type: 'text', value: c.localidad || '' });
    var inpProv = U.el('input', { type: 'text', value: c.provincia || '' });
    var inpTel = U.el('input', { type: 'tel', value: c.telefono || '' });
    var inpMail = U.el('input', { type: 'email', value: c.email || '' });
    var txtObs = U.el('textarea', { rows: '3' });
    txtObs.value = c.observaciones || '';

    var avisoCuit = U.el('div', { class: 'msg-error oculto' });
    inpCuit.addEventListener('blur', function () {
      var d = U.soloDigitos(inpCuit.value);
      if (!d) { avisoCuit.classList.add('oculto'); return; }
      inpCuit.value = U.cuitFmt(d);
      if (d.length === 11 && !U.cuitValido(d)) {
        avisoCuit.textContent = 'Ojo: el dígito verificador de ese CUIT no cierra. Se puede guardar igual.';
        avisoCuit.classList.remove('oculto');
      } else {
        avisoCuit.classList.add('oculto');
      }
    });

    var cuerpo = U.el('div');
    var g = U.el('div', { class: 'grid g2' });
    g.appendChild(U.el('div', {}, [campo('CUIT *', inpCuit), avisoCuit]));
    g.appendChild(campo('Condición frente al IVA', selIva));
    g.appendChild(campo('Razón social *', inpRazon, true));
    g.appendChild(campo('Nombre de fantasía', inpFantasia, true));
    g.appendChild(campo('Dirección', inpDir, true));
    g.appendChild(campo('Localidad', inpLoc));
    g.appendChild(campo('Provincia', inpProv));
    g.appendChild(campo('Teléfono', inpTel));
    g.appendChild(campo('Email', inpMail));
    g.appendChild(campo('Observaciones', txtObs, true));
    cuerpo.appendChild(g);

    U.modal({
      titulo: esEdicion ? 'Editar cliente' : 'Nuevo cliente',
      cuerpo: cuerpo,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        {
          texto: esEdicion ? 'Guardar cambios' : 'Crear cliente',
          clase: 'btn-primario',
          accion: function () {
            var d = U.soloDigitos(inpCuit.value);
            if (d.length !== 11) { U.toast('El CUIT tiene que tener 11 dígitos.', 'error'); return false; }
            if (!inpRazon.value.trim()) { U.toast('Cargá la razón social.', 'error'); return false; }

            var repetido = App.cache.clientes.filter(function (x) {
              return U.soloDigitos(x.cuit) === d && x.id !== c.id;
            })[0];
            if (repetido) { U.toast('Ya existe un cliente con ese CUIT: ' + repetido.razonSocial, 'error'); return false; }

            var reg = {
              id: c.id || U.id('cli'),
              cuit: d,
              razonSocial: inpRazon.value.trim(),
              nombreFantasia: inpFantasia.value.trim(),
              condicionIva: selIva.value,
              direccion: inpDir.value.trim(),
              localidad: inpLoc.value.trim(),
              provincia: inpProv.value.trim(),
              telefono: inpTel.value.trim(),
              email: inpMail.value.trim(),
              observaciones: txtObs.value.trim(),
              activo: true,
              creadoEn: c.creadoEn || new Date().toISOString()
            };

            Store.put('clientes', reg).then(function () {
              return App.recargar('clientes');
            }).then(function () {
              U.toast(esEdicion ? 'Cliente actualizado.' : 'Cliente creado.', 'ok');
              if (alGuardar) alGuardar(reg);
            }).catch(function (e) {
              U.toast('No se pudo guardar: ' + e.message, 'error');
            });
          }
        }
      ]
    });

    setTimeout(function () { (c.cuit ? inpRazon : inpCuit).focus(); }, 60);
  };

  function exportar() {
    var res = filtrados();
    if (!res.length) { U.toast('No hay clientes para exportar.', 'aviso'); return; }
    var enc = ['CUIT', 'Razón social', 'Nombre de fantasía', 'Condición IVA', 'Dirección',
      'Localidad', 'Provincia', 'Teléfono', 'Email', 'Observaciones'];
    var filas = res.map(function (c) {
      return [U.cuitFmt(c.cuit), c.razonSocial, c.nombreFantasia, c.condicionIva,
        c.direccion, c.localidad, c.provincia, c.telefono, c.email, c.observaciones];
    });
    U.descargar('clientes_' + U.hoyISO() + '.csv', U.aCSV(enc, filas), 'text/csv;charset=utf-8');
  }

})(window);

/* ───────── app/js/vistas/catalogos.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/catalogos.js — equipos, accesorios y listas

   Los precios de acá son los "de lista": al cargar una venta
   se traen solos y el vendedor puede pisarlos si hace falta.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};
  var C = global.Comunes;

  var solapa = 'equipos';
  var busqueda = '';
  var rubroFiltro = '';

  Vistas.catalogos = {
    titulo: 'Equipos y accesorios',
    sub: 'Lo que aparece en los desplegables al cargar una venta',

    render: function (cont, acciones) {
      var puedeEditar = Auth.puede('editarCatalogos');

      var barra = U.el('div', { class: 'fila-flex', style: 'margin-bottom:16px' });
      [['equipos', 'Equipos'], ['accesorios', 'Accesorios'], ['listas', 'Listas y colores']]
        .forEach(function (s) {
          var b = U.el('button', {
            class: 'btn ' + (solapa === s[0] ? 'btn-primario' : 'btn-borde'), text: s[1]
          });

          barra.appendChild(b);
        });
      cont.appendChild(barra);

      if (!puedeEditar) {
        cont.appendChild(U.el('div', { class: 'alerta alerta-info', style: 'margin-bottom:16px',
          text: 'Podés consultar los catálogos. Para modificarlos hace falta un usuario de Gerencia.' }));
      }

      if (solapa === 'listas') { pintarListas(cont, puedeEditar); return; }

      var tienda = solapa;
      var singular = solapa === 'equipos' ? 'equipo' : 'accesorio';

      if (puedeEditar) {
        var bNuevo = U.el('button', { class: 'btn btn-accion', text: '+ Nuevo ' + singular });
        bNuevo.addEventListener('click', function () { editarItem(tienda, null); });
        acciones.appendChild(bNuevo);

        if (tienda === 'equipos') {
          var bLista = U.el('button', { class: 'btn btn-primario', text: '↥ Actualizar lista de precios' });
          bLista.addEventListener('click', function () { App.ir('importar', { destino: 'listaPrecios' }); });
          acciones.appendChild(bLista);
        }

        var bImp = U.el('button', { class: 'btn btn-borde', text: 'Cargar precios desde Excel simple' });
        bImp.addEventListener('click', function () { App.ir('importar', { destino: tienda }); });
        acciones.appendChild(bImp);
      }

      var panel = U.el('div', { class: 'panel' });

      /* Buscador y filtro por rubro */
      var cabPanel = U.el('div', { class: 'panel-cuerpo', style: 'border-bottom:1px solid var(--gris-2)' });
      var filtros = U.el('div', { class: 'filtros' });

      var wrap = U.el('div', { class: 'barra-buscar' });
      var inpBuscar = C.inp({ type: 'text', placeholder: 'Buscar…', value: busqueda });
      inpBuscar.addEventListener('input', U.debounce(function () {
        busqueda = inpBuscar.value; pintarTabla(cuerpo, tienda, puedeEditar);
      }, 200));
      wrap.appendChild(inpBuscar);
      filtros.appendChild(U.el('label', { class: 'campo' }, [U.el('span', { text: 'Buscar' }), wrap]));

      if (tienda === 'equipos') {
        var usados = {};
        App.cache.equipos.forEach(function (e) { if (e.rubro) usados[e.rubro] = 1; });
        var selRub = C.sel(Object.keys(usados).sort(), rubroFiltro, 'Todos los rubros');
        selRub.addEventListener('change', function () {
          rubroFiltro = selRub.value; pintarTabla(cuerpo, tienda, puedeEditar);
        });
        filtros.appendChild(U.el('label', { class: 'campo' }, [U.el('span', { text: 'Rubro' }), selRub]));
      }

      cabPanel.appendChild(filtros);
      panel.appendChild(cabPanel);

      var cuerpo = U.el('div');
      panel.appendChild(cuerpo);
      cont.appendChild(panel);
      pintarTabla(cuerpo, tienda, puedeEditar);

      if (puedeEditar) {
        cont.appendChild(U.el('div', { class: 'alerta alerta-info',
          html: '<strong>Se edita directo en la tabla.</strong> Escribí el precio y hacé clic afuera: ' +
            'se guarda solo. Es el precio que después se trae al cargar una venta.' +
            (tienda === 'equipos'
              ? '<br><strong>La familia</strong> define qué datos lleva la hoja que se manda a fábrica: ' +
                'los auxilios llevan camión y voltaje, las plataformas llevan además ancho, largo y biela, ' +
                'y las tijeras, niveladores, cajas y prensas llevan dimensiones. El sistema la adivina por ' +
                'el nombre, pero conviene revisarla.'
              : '') }));
      }
    }
  };

  function filtrados(tienda) {
    var t = U.norm(busqueda);
    var res = App.cache[tienda].filter(function (i) {
      if (tienda === 'equipos' && rubroFiltro && i.rubro !== rubroFiltro) return false;
      return !t || U.norm(i.nombre).indexOf(t) !== -1;
    });
    return U.ordenarPor(res, 'nombre');
  }

  function pintarTabla(cont, tienda, puedeEditar) {
    cont.innerHTML = '';
    var items = filtrados(tienda);

    if (!items.length) {
      cont.appendChild(U.el('div', { class: 'vacio',
        text: App.cache[tienda].length ? 'Nada coincide con la búsqueda.' : 'No hay ' + tienda + ' cargados.' }));
      return;
    }

    var conPrecio = items.filter(function (i) { return Number(i.precio) > 0; }).length;

    var esEquipos = tienda === 'equipos';

    var scroll = U.el('div', { class: 'tabla-scroll' });
    var tabla = U.el('table', { class: 'tabla' });
    tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
      U.el('th', { text: 'Nombre' }),
      esEquipos ? U.el('th', { text: 'Rubro', style: 'width:190px' }) : null,
      esEquipos ? U.el('th', { text: 'Familia', style: 'width:230px' }) : null,
      U.el('th', { text: 'Precio de lista', style: 'width:170px' }),
      U.el('th', { text: 'Situación', style: 'width:120px' }),
      U.el('th', { text: 'Usado en', style: 'width:100px' }),
      U.el('th', { text: '', style: 'width:190px' })

    var tb = U.el('tbody');
    items.forEach(function (it) {
      var usos = contarUsos(tienda, it);

      var tdPrecio = U.el('td');

          var nuevo = Number(inpPrecio.value) || 0;

          Store.put(tienda, it).then(function () {
            U.toast(it.nombre + ': ' + U.plata(nuevo), 'ok', 1800);

      if (puedeEditar) {

          text: it.activo === false ? 'Reactivar' : 'Desactivar' });
        bAct.addEventListener('click', function () {
          it.activo = it.activo === false;
          Store.put(tienda, it).then(function () {
            U.toast(it.activo ? 'Reactivado.' : 'Desactivado. Ya no aparece al cargar ventas.', 'ok');

          });
        });
        acc.appendChild(bAct);
      }

      /* Rubro: la sección de la que vino en la lista de precios */
      var tdRubro = null;
      if (esEquipos) {
        tdRubro = U.el('td');
        if (puedeEditar) {
          var selRubro = C.sel(Datos.RUBROS, it.rubro || '', '— sin rubro —');
          selRubro.addEventListener('change', function () {
            it.rubro = selRubro.value;
            if (!it.tipoManual && it.rubro) {
              var t = Datos.tipoDesdeRubro(it.rubro);
              if (t) it.tipo = t;
            }
            Store.put(tienda, it).then(function () { App.refrescar(); });
          });
          tdRubro.appendChild(selRubro);
        } else {
          tdRubro.textContent = it.rubro || '—';
        }
      }

      /* Familia: decide qué hoja se imprime para fábrica */
      var tdFamilia = null;
      if (esEquipos) {

  function contarUsos(tienda, it) {
    if (tienda === 'equipos') {

        return v.equipoId === it.id || v.equipoNombre === it.nombre;
      }).length;
    }
    return App.cache.ventas.filter(function (v) {
      return (v.accesorios || []).some(function (a) { return a.accesorioId === it.id; });

  function editarItem(tienda, it) {

    var inpPrecio = C.inp({ type: 'number', min: '0', step: '0.01', value: it ? (it.precio || '') : '' });

    var selTipo = null;
    if (tienda === 'equipos') {
      selTipo = C.sel(Datos.TIPOS_EQUIPO.map(function (t) { return { valor: t.id, texto: t.rot }; }),
        (it && it.tipo) || Datos.adivinarTipoEquipo(it ? it.nombre : ''), null);
    }

    var cuerpo = U.el('div');
    var g = U.el('div', { class: 'grid g2' });
    g.appendChild(C.campo('Nombre', inpNombre));
    g.appendChild(C.campo('Precio de lista', inpPrecio, 'Se puede dejar en cero'));
    if (selTipo) {
      g.appendChild(C.campo('Familia', selTipo, 'Define qué datos lleva la hoja que va a fábrica'));
    }
    cuerpo.appendChild(g);

    if (it) {
      cuerpo.appendChild(U.el('p', { class: 'txt-chico', style: 'margin-bottom:0',
        text: 'Cambiar el nombre o el precio no modifica las ventas ya cargadas: cada venta guarda ' +
              'el nombre y el precio con el que se vendió.' }));
    }

    U.modal({
      titulo: (esNuevo ? 'Nuevo ' : 'Editar ') + (tienda === 'equipos' ? 'equipo' : 'accesorio'),
      cuerpo: cuerpo,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        { texto: 'Guardar', clase: 'btn-primario', accion: function () {
          var n = inpNombre.value.trim();
          if (!n) { U.toast('Escribí un nombre.', 'error'); return false; }
          var reg = it || { id: U.id(tienda.slice(0, 3)), activo: true };
          reg.nombre = n;
          reg.precio = Number(inpPrecio.value) || 0;
          if (selTipo) reg.tipo = selTipo.value;
          Store.put(tienda, reg)
            .then(function () { return App.recargar(tienda); })
            .then(function () { U.toast('Guardado.', 'ok'); App.refrescar(); });
        } }
      ]
    });
    setTimeout(function () { inpNombre.focus(); }, 60);
  }

  /* ═══════════════ Listas del formulario ═══════════════ */

  var LISTAS_ESTADO = [
    { clave: 'estados', rot: 'Estados de venta',
      ayuda: 'Con estos estados Gerencia sigue la producción. El color pinta la fila en Consultas.' },
    { clave: 'estadosPago', rot: 'Estados de pago',
      ayuda: 'La columna Estado de pago del listado de ventas.' },
    { clave: 'estadosReparacion', rot: 'Estados de reparación',
      ayuda: 'Para seguir las reparaciones en el taller.' },
    { clave: 'estadosIngreso', rot: 'Estados de ingreso a planta',
      ayuda: 'Para los equipos que entran a planta.' }
  ];

  var LISTAS_TEXTO = [
    { clave: 'accionamientos', rot: 'Accionamientos', ayuda: 'Aparecen al cargar los datos de producción.' },
    { clave: 'formasPago', rot: 'Formas de pago', ayuda: 'Aparecen en los datos para administración.' },
    { clave: 'condicionesIva', rot: 'Condiciones frente al IVA', ayuda: 'Aparecen en la ficha del cliente.' }
  ];

  function pintarListas(cont, puedeEditar) {
    var listas = App.cache.listas;

    LISTAS_ESTADO.forEach(function (def) {
      cont.appendChild(panelEstados(def, listas, puedeEditar));
    });
    LISTAS_TEXTO.forEach(function (def) {
      cont.appendChild(panelTextos(def, listas, puedeEditar));
    });
  }

  function panelEstados(def, listas, puedeEditar) {
    var panel = U.el('div', { class: 'panel' });
    panel.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [U.el('h3', { text: def.rot }), U.el('p', { class: 'sub', text: def.ayuda })])
    ]));

    var valores = listas[def.clave] || [];
    var scroll = U.el('div', { class: 'tabla-scroll' });
    var tabla = U.el('table', { class: 'tabla' });
    tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
      U.el('th', { text: 'Estado' }),
      U.el('th', { text: 'Cómo se ve', style: 'width:200px' }),
      U.el('th', { text: 'Color', style: 'width:260px' }),
      U.el('th', { text: '', style: 'width:100px' })
    ])]));

    var tb = U.el('tbody');
    valores.forEach(function (e, i) {
      var muestra = U.el('span', { class: 'pill pill-' + e.color, text: e.nombre });

      var paleta = U.el('div', { class: 'paleta' });
      if (puedeEditar) {
        Datos.COLORES.forEach(function (col) {
          var b = U.el('button', {
            type: 'button',
            class: col.id === e.color ? 'elegido' : '',
            style: 'background:' + col.muestra,
            title: col.rot
          });
          b.addEventListener('click', function () {
            e.color = col.id;
            guardarListas(listas);
          });
          paleta.appendChild(b);
        });
      } else {
        paleta.appendChild(U.el('span', { class: 'txt-chico', text: (
          (Datos.COLORES.filter(function (c) { return c.id === e.color; })[0] || {}).rot || e.color) }));
      }

      var acc = U.el('div');
      if (puedeEditar && !e.sistema) {
        var x = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Quitar' });
        x.addEventListener('click', function () {
          valores.splice(i, 1);
          guardarListas(listas);
        });
        acc.appendChild(x);
      } else if (e.sistema) {
        acc.appendChild(U.el('span', { class: 'txt-chico', text: 'de sistema' }));
      }

      tb.appendChild(U.el('tr', { class: 'fila-' + e.color }, [
        U.el('td', { text: e.nombre }),
        U.el('td', {}, [muestra]),
        U.el('td', {}, [paleta]),
        U.el('td', {}, [acc])
      ]));
    });
    tabla.appendChild(tb);
    scroll.appendChild(tabla);
    panel.appendChild(scroll);

    if (puedeEditar) {
      var cuerpo = U.el('div', { class: 'panel-cuerpo' });
      var fila = U.el('div', { class: 'fila-flex' });
      var inp = C.inp({ type: 'text', placeholder: 'Nombre del estado nuevo', style: 'max-width:280px' });
      var b = U.el('button', { class: 'btn btn-borde', text: 'Agregar' });
      function agregar() {
        var n = inp.value.trim();
        if (!n) return;
        if (valores.some(function (x) { return U.norm(x.nombre) === U.norm(n); })) {
          U.toast('Ya existe un estado con ese nombre.', 'error');
          return;
        }
        valores.push({ nombre: n, color: 'gris' });
        inp.value = '';
        guardarListas(listas);
      }
      b.addEventListener('click', agregar);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); agregar(); } });
      fila.appendChild(inp);
      fila.appendChild(b);
      cuerpo.appendChild(fila);
      panel.appendChild(cuerpo);
    }

    return panel;
  }

  function panelTextos(def, listas, puedeEditar) {
    var panel = U.el('div', { class: 'panel' });
    panel.appendChild(U.el('div', { class: 'panel-cab' }, [
      U.el('div', {}, [U.el('h3', { text: def.rot }), U.el('p', { class: 'sub', text: def.ayuda })])
    ]));

    var cuerpo = U.el('div', { class: 'panel-cuerpo' });
    var valores = listas[def.clave] || [];

    var chips = U.el('div', { class: 'chips' });
    valores.forEach(function (v, i) {
      var chip = U.el('span', { class: 'chip' }, [U.el('span', { text: v })]);
      if (puedeEditar) {
        var x = U.el('button', { class: 'btn-x', style: 'font-size:17px;margin-left:4px', text: '×', title: 'Quitar' });
        x.addEventListener('click', function () { valores.splice(i, 1); guardarListas(listas); });
        chip.appendChild(x);
      }
      chips.appendChild(chip);
    });
    cuerpo.appendChild(chips);

    if (puedeEditar) {
      var fila = U.el('div', { class: 'fila-flex', style: 'margin-top:14px' });
      var inp = C.inp({ type: 'text', placeholder: 'Agregar…', style: 'max-width:280px' });
      var b = U.el('button', { class: 'btn btn-borde', text: 'Agregar' });
      function agregar() {
        var n = inp.value.trim();
        if (!n) return;
        valores.push(n);
        inp.value = '';
        guardarListas(listas);
      }
      b.addEventListener('click', agregar);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); agregar(); } });
      fila.appendChild(inp);
      fila.appendChild(b);
      cuerpo.appendChild(fila);
    }

    panel.appendChild(cuerpo);
    return panel;
  }

  function guardarListas(listas) {
    Store.setConfig('listas', listas)
      .then(function () { return App.recargar('listas'); })
      .then(function () { U.toast('Lista actualizada.', 'ok', 1800); App.refrescar(); });
  }

})(window);

/* ───────── app/js/vistas/usuarios.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/usuarios.js — alta y administración de usuarios
   Solo accesible para el perfil Gerencia.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};

  Vistas.usuarios = {
    titulo: 'Usuarios',
    soloDueno: true,
    sub: 'Vendedores y Gerencia con acceso al sistema',

    render: function (cont, acciones) {
      var bNuevo = U.el('button', { class: 'btn btn-accion', text: '+ Nuevo usuario' });
      bNuevo.addEventListener('click', function () { formUsuario(null); });
      acciones.appendChild(bNuevo);

      var panel = U.el('div', { class: 'panel' });
      var scroll = U.el('div', { class: 'tabla-scroll' });
      var tabla = U.el('table', { class: 'tabla' });
      tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
        U.el('th', { text: 'Nombre' }),
        U.el('th', { text: 'Usuario', style: 'width:160px' }),
        U.el('th', { text: 'Perfil', style: 'width:130px' }),
        U.el('th', { text: 'Situación', style: 'width:120px' }),
        U.el('th', { text: 'Ventas', style: 'width:80px' }),
        U.el('th', { text: '', style: 'width:260px' })
      ])]));

      var tb = U.el('tbody');
      U.ordenarPor(App.cache.usuarios, 'nombre').forEach(function (u) {
        tb.appendChild(fila(u));
      });
      tabla.appendChild(tb);
      scroll.appendChild(tabla);
      panel.appendChild(scroll);
      cont.appendChild(panel);

      cont.appendChild(U.el('div', { class: 'alerta alerta-info' , html:
        '<strong>Cómo funcionan los perfiles.</strong><br>' +
        '<strong>Vendedor:</strong> carga ventas, consulta el listado completo y administra clientes.<br>' +
        '<strong>Gerencia:</strong> todo lo anterior, más autorizar ventas, cambiar el estado de producción, ' +
        'importar el histórico y administrar usuarios.' }));
    }
  };

  function fila(u) {
    var ventas = App.cache.ventas.filter(function (v) { return v.vendedorId === u.id; }).length;
    var esYo = Auth.usuario && Auth.usuario.id === u.id;

    var acc = U.el('div', { class: 'fila-flex' });

    var bEd = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Editar' });
    bEd.addEventListener('click', function () { formUsuario(u); });
    acc.appendChild(bEd);

    var bClave = U.el('button', { class: 'btn btn-chico btn-borde', text: 'Contraseña' });
    bClave.addEventListener('click', function () { formClave(u); });
    acc.appendChild(bClave);

    var bAct = U.el('button', { class: 'btn btn-chico btn-borde', text: u.activo ? 'Desactivar' : 'Reactivar' });
    bAct.disabled = esYo;
    if (esYo) bAct.title = 'No podés desactivarte a vos mismo.';
    bAct.addEventListener('click', function () {
      if (u.activo && esUltimoDueno(u)) {
        U.toast('Tiene que quedar al menos un usuario de Gerencia activo.', 'error');
        return;
      }
      u.activo = !u.activo;
      Store.put('usuarios', u)
        .then(function () { return App.recargar('usuarios'); })
        .then(function () { U.toast('Listo.', 'ok'); App.refrescar(); });
    });
    acc.appendChild(bAct);

    return U.el('tr', {}, [
      U.el('td', {}, [
        U.el('div', { text: u.nombre }),
        esYo ? U.el('div', { class: 'txt-chico', text: 'Sos vos' }) : null
      ]),
      U.el('td', {}, [U.el('span', { class: 'serie', text: u.usuario })]),
      U.el('td', { html: u.rol === 'dueno'
        ? '<span class="pill pill-rojo">Gerencia</span>'
        : '<span class="pill pill-gris">Vendedor</span>' }),
      U.el('td', { html: u.activo
        ? '<span class="pill pill-verde">Activo</span>'
        : '<span class="pill pill-rojo">Desactivado</span>' }),
      U.el('td', { class: 'num-col', text: U.miles(ventas) }),
      U.el('td', {}, [acc])
    ]);
  }

  function esUltimoDueno(u) {
    if (u.rol !== 'dueno') return false;
    return App.cache.usuarios.filter(function (x) {
      return x.rol === 'dueno' && x.activo && x.id !== u.id;
    }).length === 0;
  }

  /* ═══════════════ Alta / edición ═══════════════ */

  function formUsuario(u) {
    var esNuevo = !u;
    var cuerpo = U.el('div');

    function campo(rot, ctrl, ayuda) {
      var hijos = [U.el('span', { text: rot })];
      if (ayuda) hijos.push(U.el('span', { class: 'ayuda', text: ayuda }));
      hijos.push(ctrl);
      return U.el('label', { class: 'campo' }, hijos);
    }

    var inpNombre = U.el('input', { type: 'text', value: u ? u.nombre : '', placeholder: 'Nombre y apellido' });
    var inpUsuario = U.el('input', { type: 'text', value: u ? u.usuario : '', placeholder: 'Con lo que ingresa' });
    var selRol = U.el('select');
    [['vendedor', 'Vendedor'], ['dueno', 'Gerencia']].forEach(function (r) {
      var op = U.el('option', { value: r[0], text: r[1] });
      if (u && u.rol === r[0]) op.selected = true;
      selRol.appendChild(op);
    });
    var inpClave = U.el('input', { type: 'password', placeholder: 'Mínimo 6 caracteres', autocomplete: 'new-password' });

    var g = U.el('div', { class: 'grid g2' });
    g.appendChild(campo('Nombre completo *', inpNombre));
    g.appendChild(campo('Nombre de usuario *', inpUsuario));
    g.appendChild(campo('Perfil *', selRol));
    if (esNuevo) g.appendChild(campo('Contraseña *', inpClave));
    cuerpo.appendChild(g);

    U.modal({
      titulo: esNuevo ? 'Nuevo usuario' : 'Editar usuario',
      cuerpo: cuerpo,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        { texto: esNuevo ? 'Crear' : 'Guardar', clase: 'btn-primario', accion: function () {
          var nombre = inpNombre.value.trim();
          var usuario = inpUsuario.value.trim();
          if (!nombre) { U.toast('Cargá el nombre.', 'error'); return false; }
          if (!usuario) { U.toast('Cargá el nombre de usuario.', 'error'); return false; }
          if (esNuevo && inpClave.value.length < 6) {
            U.toast('La contraseña tiene que tener al menos 6 caracteres.', 'error'); return false;
          }
          if (!esNuevo && u.rol === 'dueno' && selRol.value !== 'dueno' && esUltimoDueno(u)) {
            U.toast('Tiene que quedar al menos un usuario de Gerencia activo.', 'error'); return false;
          }

          var promesa;
          if (esNuevo) {
            promesa = Auth.crear({ nombre: nombre, usuario: usuario, rol: selRol.value, clave: inpClave.value });
          } else {
            var repetido = App.cache.usuarios.some(function (x) {
              return U.norm(x.usuario) === U.norm(usuario) && x.id !== u.id;
            });
            if (repetido) { U.toast('Ya hay otro usuario con ese nombre de acceso.', 'error'); return false; }
            u.nombre = nombre; u.usuario = usuario; u.rol = selRol.value;
            promesa = Store.put('usuarios', u);
          }

          promesa
            .then(function () { return App.recargar('usuarios'); })
            .then(function () {
              U.toast(esNuevo ? 'Usuario creado.' : 'Usuario actualizado.', 'ok');
              App.pintarAvisos();
              App.refrescar();
            })
            .catch(function (e) { U.toast(e.message, 'error'); });
        } }
      ]
    });
    setTimeout(function () { inpNombre.focus(); }, 60);
  }

  function formClave(u) {
    var cuerpo = U.el('div');
    var i1 = U.el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'Mínimo 6 caracteres' });
    var i2 = U.el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'Repetir' });

    cuerpo.appendChild(U.el('p', { style: 'margin-top:0', text: 'Contraseña nueva para ' + u.nombre + '.' }));
    cuerpo.appendChild(U.el('label', { class: 'campo' }, [U.el('span', { text: 'Contraseña nueva' }), i1]));
    cuerpo.appendChild(U.el('label', { class: 'campo', style: 'margin-top:12px' },
      [U.el('span', { text: 'Repetir contraseña' }), i2]));

    U.modal({
      titulo: 'Cambiar contraseña',
      cuerpo: cuerpo,
      botones: [
        { texto: 'Cancelar', clase: 'btn-borde' },
        { texto: 'Cambiar', clase: 'btn-primario', accion: function () {
          if (i1.value.length < 6) { U.toast('Mínimo 6 caracteres.', 'error'); return false; }
          if (i1.value !== i2.value) { U.toast('Las dos contraseñas no coinciden.', 'error'); return false; }
          Auth.cambiarClave(u.id, i1.value)
            .then(function () { return App.recargar('usuarios'); })
            .then(function () {
              U.toast('Contraseña cambiada.', 'ok');
              App.pintarAvisos();
              App.refrescar();
            })
            .catch(function (e) { U.toast(e.message, 'error'); });
        } }
      ]
    });
    setTimeout(function () { i1.focus(); }, 60);
  }

})(window);

/* ───────── app/js/vistas/imprimir.js ───────── */
/* ═══════════════════════════════════════════════════════
   vistas/imprimir.js — hoja para mandar a fábrica

   El ingeniero abre la venta, revisa los datos y saca el papel.
   Cada familia de equipo lleva datos distintos:

     AUXILIOS     equipo, cliente, camión, accesorios, color,
                  nro. de serie, voltaje
     PLATAFORMAS  equipo, cliente, camión, ancho, largo, biela,
                  voltaje, puerta / doble puerta, toma de fuerza
                  con su número, accesorios y nro. de serie
     TIJERAS,     equipo, cliente, dimensiones, accesorios,
     NIVELADORES, color y nro. de serie
     CAJAS,
     PRENSAS

   Todo viene completado con lo que hay cargado en la venta y
   se puede corregir antes de imprimir. Lo que se corrige queda
   guardado en la venta.
   ═══════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  var Vistas = global.Vistas = global.Vistas || {};
  var C = global.Comunes;

  /* Qué campos lleva cada hoja, en el orden en que van impresos. */
  var PLANTILLAS = {
    auxilio: {
      rot: 'Auxilio',
      campos: ['equipoNombre', 'clienteNombre', 'montadoSobre', 'color', 'voltaje', 'nroSerie'],
      accesorios: true
    },
    plataforma: {
      rot: 'Plataforma',
      campos: ['equipoNombre', 'clienteNombre', 'montadoSobre', 'ancho', 'largo', 'biela',
               'voltaje', 'nroSerie'],
      tildes: true,        // puerta / doble puerta y toma de fuerza
      accesorios: true
    },
    general: {
      rot: 'Tijera / Nivelador / Caja / Prensa',
      campos: ['equipoNombre', 'clienteNombre', 'dimensiones', 'color', 'nroSerie'],
      accesorios: true
    }
  };

  var ROTULOS = {
    equipoNombre:  'Equipo',
    clienteNombre: 'Cliente',
    montadoSobre:  'Camión',
    color:         'Color',
    voltaje:       'Voltaje',
    nroSerie:      'Nro. de serie',
    ancho:         'Ancho',
    largo:         'Largo',
    biela:         'Biela',
    dimensiones:   'Dimensiones'
  };

  /* Los que se escriben en una línea; el resto va en un cuadro grande. */
  var MULTILINEA = { dimensiones: true };

  /** Texto de accesorios por defecto, a partir de los de la venta. */
  function accesoriosPorDefecto(v) {
    if (v.accesoriosHoja) return v.accesoriosHoja;
    return (v.accesorios || []).map(function (a) {
      return a.nombre + (a.cantidad > 1 ? '  x' + a.cantidad : '');
    }).join('\n');
  }

  /* ═══════════════ Ventana de revisión ═══════════════ */

  Vistas.hojaFabrica = function (venta) {
    var tipo = App.tipoDeVenta(venta);
    if (!PLANTILLAS[tipo]) tipo = 'general';

    var cuerpo = U.el('div');
    var campos = {};        // clave -> control
    var zonaCampos = U.el('div');

    /* Selector de plantilla */
    var selTipo = C.sel(Object.keys(PLANTILLAS).map(function (k) {
      return { valor: k, texto: PLANTILLAS[k].rot };
    }), tipo, null);
    selTipo.addEventListener('change', function () { tipo = selTipo.value; pintarCampos(); });

    cuerpo.appendChild(C.campo('Tipo de hoja', selTipo,
      'Se elige sola según el equipo. Si no es la correcta, cambiala acá.'));
    cuerpo.appendChild(U.el('div', { class: 'sep' }));
    cuerpo.appendChild(zonaCampos);

    function pintarCampos() {
      var def = PLANTILLAS[tipo];
      zonaCampos.innerHTML = '';
      campos = {};

      var g = U.el('div', { class: 'grid g2' });
      def.campos.forEach(function (k) {
        var ctrl;
        if (MULTILINEA[k]) {
          ctrl = U.el('textarea', { rows: '3' });
          ctrl.value = venta[k] || '';
        } else {
          ctrl = C.inp({ type: 'text', value: venta[k] || '' });
        }
        campos[k] = ctrl;
        var lab = C.campo(ROTULOS[k] || k, ctrl);
        if (MULTILINEA[k]) lab.style.gridColumn = '1/-1';
        g.appendChild(lab);
      });
      zonaCampos.appendChild(g);

      /* Tildes de plataforma */
      if (def.tildes) {
        zonaCampos.appendChild(U.el('div', { class: 'sep' }));

        var selPuerta = C.sel(

  /** Lo corregido en la hoja queda guardado en la venta. */
  function guardarEnVenta(v, d) {

      v[k] = d[k];
    });

    if (JSON.stringify(v) === antes) return;

    v.actualizadoEn = new Date().toISOString();
    delete v._busqueda;

    var tabla = U.el('table');

    def.campos.forEach(function (k) {

      tb.appendChild(U.el('tr', {}, [
        U.el('td', { class: 'rot', text: ROTULOS[k] || k }),
        U.el('td', { class: 'val' + (destacar ? ' grande' : ''), text: d[k] || '' })
      ]));
    });

    if (def.tildes) {
      var tildes = U.el('div', { class: 'tildes' });
      tildes.appendChild(tilde('Puerta', d.plataforma === 'Puerta'));
      tildes.appendChild(tilde('Doble puerta', d.plataforma === 'Doble puerta'));
      tildes.appendChild(tilde('Toma de fuerza' + (d.tomaFuerzaNro ? '  N° ' + d.tomaFuerzaNro : ''),

    if (v.medidasEspeciales) hoja.appendChild(bloqueLibre('Medidas especiales', v.medidasEspeciales));
    if (v.observaciones) hoja.appendChild(bloqueLibre('Observaciones', v.observaciones));

      U.el('span', { text: 'Impreso por ' + (Auth.usuario ? Auth.usuario.nombre : '') +
        ' el ' + U.fecha(U.hoyISO()) })
    ]));

    cont.appendChild(hoja);
